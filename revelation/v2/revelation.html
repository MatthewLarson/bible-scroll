N('7:5','From the tribe of Judah','israel',{t:'An unusual tribal list', p:'Judah first, Dan and Ephraim missing.', b:`There are about 20 tribal lists in the Old Testament, and this one matches none. Judah, the tribe of the Messiah, comes first instead of Reuben. Dan is missing; Irenaeus thought the antichrist would come from Dan (Jeremiah 8:16; Genesis 49:17), and Dan was linked to idolatry (Judges 18; 1 Kings 12:29). Ephraim is absent but Joseph is named. Levi, usually left out of military lists, is included.`, r:'Genesis 49:17; Judges 18:30; 1 Kings 12:29; Numbers 1:5–15', top:'twelve-tribes', s:['bauckham','irenaeus']});
N('7:9','a huge crowd that no one could count','spec',{t:'The promise to Abraham, counted and uncountable', p:'144,000 is what John hears. What he sees is Abraham’s uncountable family.', b:`God promised Abraham descendants "as many as the stars... if you can count them" (Genesis 15:5) and "too many to count" (Genesis 16:10; 32:12). The census in 7:4–8 is a military muster like Numbers 1. My view, following Bauckham: the crowd is the same group as the 144,000, seen as it truly is, Abraham's promise fulfilled through every nation, just as John heard "Lion" and saw "Lamb" in chapter 5.`, r:'Genesis 15:5; Genesis 32:12; Numbers 1:2–3; 5:5–6; Galatians 3:29', top:'144000', s:['climax']});
N('7:9','palm branches','history',{t:'Palm branches', p:'Waved at the Feast of Tabernacles and at victories.', b:`Palm branches were used at the Feast of Tabernacles (Leviticus 23:40), at the victory celebrations of the Maccabees (1 Maccabees 13:51; 2 Maccabees 10:7), and at Jesus's entry into Jerusalem (John 12:13). 7:15 says God will "spread his tent over them," another Tabernacles echo.`, r:'Leviticus 23:40; John 12:13; Zechariah 14:16', top:'144000'});
N('7:14','the great suffering','views',{t:'"The great tribulation"', p:'One future seven-year period, or the suffering of the whole church age?', b:`The Greek has the article: "the great tribulation," as in Daniel 12:1 and Matthew 24:21. Futurists see a specific future period, and this crowd as people saved during it. Preterists see the war of AD 66–70 and the persecutions of the time. Idealists note John says he already shares "the suffering" (1:9) with his readers.`, r:'Daniel 12:1; Matthew 24:21; 1:9', top:'tribulation', s:['gregg']});
N('7:14','washed their robes and made them white in the blood','symbol',{t:'Washed white in blood', p:'A paradox: red blood makes white robes.', b:`The image draws on Exodus 19:10, 14, where the people wash their clothes before meeting God at Sinai, and on Isaiah 1:18: "though your sins are like scarlet, they shall be as white as snow." The blessing in 22:14 repeats it.`, r:'Exodus 19:10; Isaiah 1:18; 22:14; 1 John 1:7'});
N('7:17','God will wipe every tear from their eyes','echo',{t:'Isaiah’s banquet', p:'Isaiah 25:8: "The Sovereign LORD will wipe away the tears from all faces."', b:`Isaiah 25:6–8 describes a feast for all peoples on God's mountain, where death is swallowed up forever and tears are wiped away. Revelation uses this promise here and again in 21:4. Verse 16 quotes Isaiah 49:10, and the Lamb as shepherd recalls Psalm 23.`, r:'Isaiah 25:8; Isaiah 49:10; Psalm 23:1–2; 21:4'});

/* ---- chapter 8 ---- */
N('8:1','silence in heaven for about half an hour','spec',{t:'Silence for the prayers', p:'Jewish tradition said heaven’s songs paused so that Israel’s prayers could be heard.', b:`Habakkuk 2:20 and Zephaniah 1:7 call for silence before the LORD's judgment. In temple worship, the burning of incense came in a hush while the people prayed (Luke 1:10). Some later rabbinic traditions say the angels fall silent so Israel's prayers can be heard (b. Hagigah 12b). Many commentators connect these. My suggestion: the "half hour" is the length of the evening incense offering, during which the people stood outside praying. The next verses show exactly that offering.`, r:'Habakkuk 2:20; Zephaniah 1:7; Luke 1:10; 8:3–4', s:['bauckham','aune']});
N('8:5','threw it down to the earth','echo',{t:'Fire from the altar', p:'Ezekiel 10: coals from between the cherubim scattered over Jerusalem.', b:`In Ezekiel 10:2 a man in linen fills his hands with burning coals from among the cherubim and scatters them over the city. The prayers of 6:10 rise, and the answer comes down as fire.`, r:'Ezekiel 10:2; 6:10; 5:8', top:'trumpets'});
N('8:7','Hail and fire mixed with blood','echo',{t:'The plagues of Egypt', p:'The trumpets copy the plagues of Exodus.', b:`Hail and fire (Exodus 9:23–25), water to blood (Exodus 7:20), darkness (Exodus 10:21), locusts (Exodus 10:12–15). The trumpets and bowls retell the Exodus on a world scale, with the beast's kingdom as Egypt and the church as Israel leaving it.`, r:'Exodus 9:23–25; Exodus 7:20–21; Exodus 10:12–23', top:'exodus-pattern'});
N('8:7','A third','symbol',{t:'A third', p:'Limited judgment: a warning, not yet the end.', b:`Trumpet judgments strike "a third" again and again (12 times in chapter 8). The bowls later strike everything. The partial strikes are warnings that leave room to repent, which 9:20–21 says people refused to do. Compare Ezekiel 5:2, 12, where Jerusalem's people are divided into thirds.`, r:'Ezekiel 5:2; Ezekiel 5:12; Zechariah 13:8–9; 9:20–21', top:'trumpets'});
N('8:8','a huge mountain on fire was thrown into the sea','history',{t:'Mount Vesuvius?', p:'Vesuvius erupted in AD 79, and a writer of the time described it in similar terms.', b:`Some scholars note that Vesuvius's eruption, which buried Pompeii, was described as a burning mountain, and the <i>Sibylline Oracles</i> (4.130–136) treat it as God's punishment of Rome. Jeremiah 51:25 calls Babylon a "burned-out mountain." Others read the mountain as a fallen kingdom, since mountains often stand for kingdoms in prophecy.`, r:'Jeremiah 51:25; Mark 11:23', l:[['Eruption of Mount Vesuvius in 79 AD','Eruption of Mount Vesuvius in 79 AD']], s:['koester']});
N('8:11','Wormwood','symbol',{t:'Wormwood', p:'A bitter plant, used by the prophets for judgment.', b:`Jeremiah 9:15: "I will make this people eat wormwood and drink poisoned water." Many people linked this verse to Chernobyl (1986), because the Ukrainian word names a related plant (mugwort).`, r:'Jeremiah 9:15; Jeremiah 23:15; Amos 5:7', top:'wormwood'});
N('8:13','an eagle','word',{t:'An eagle or an angel?', greek:'ἀετοῦ (aetou, eagle) vs ἀγγέλου (angelou, angel)', p:'KJV says "an angel," but the oldest manuscripts say "an eagle."', b:`The Textus Receptus reads "angel," and so does the KJV. Nearly all early manuscripts read "eagle." Eagles (or vultures, the same Greek word) gather over the dead (Matthew 24:28), and Hosea 8:1 pictures an eagle over God's house with a trumpet to the lips.`, r:'Hosea 8:1; Matthew 24:28; Deuteronomy 28:49', top:'textual-history', s:['metzger']});

/* ---- chapter 9 ---- */
N('9:1','a star that had fallen','views',{t:'Who is the fallen star?', p:'Satan, a fallen angel, or simply an angel sent down?', b:`The Greek is a perfect tense, "had fallen," which suggests the star fell before John saw it. Isaiah 14:12 describes the fall of the "morning star." Jesus says "I saw Satan fall like lightning from heaven" (Luke 10:18). Others note that 20:1 has a good angel holding the same key, and read this star as an angel sent on a mission.`, r:'Isaiah 14:12; Luke 10:18; 20:1', top:'abyss'});
N('9:3','locusts','echo',{t:'Joel’s locust army', p:'Joel 2 describes an invading army as locusts that look like horses.', b:`Joel 1–2: a locust swarm "like horses" with teeth "of a lion," sounding "like the noise of chariots." Joel used a real locust plague to picture an invading army and the Day of the LORD. Readers have seen in these locusts Muslim armies (historicists), modern attack helicopters (some futurists), Roman armies (preterists), or demonic torment (idealists).`, r:'Joel 1:6; Joel 2:4–5; Exodus 10:12–15', top:'exodus-pattern', s:['gregg']});
N('9:5','five months','history',{t:'Five months', p:'The life span of a locust, or the length of the locust season.', b:`Locusts typically live about five months, and the dry season when they swarm (May to September) is about that long. Some preterists connect it to the five months of Gessius Florus's violence in AD 66, or to the five months of the Roman siege of Jerusalem in AD 70.`, s:['aune']});
N('9:11','Abaddon','word',{t:'Abaddon and Apollyon', greek:'Ἀβαδδών (Hebrew ʾabaddon, "destruction"); Ἀπολλύων (Apollyōn, "Destroyer")', p:'Hebrew "Destruction," Greek "Destroyer." A jab at Apollo?', b:`<i>Abaddon</i> is a Hebrew word for the place of destruction (Job 26:6; Proverbs 15:11). The Greek name <i>Apollyōn</i> sounds like Apollo, whose symbols included the locust. Emperors such as Nero and Domitian liked to be associated with Apollo. Many scholars think John is mocking the emperor's patron god.`, r:'Job 26:6; Job 28:22; Proverbs 15:11', top:'abaddon', s:['aune','koester']});
N('9:14','Euphrates','history',{t:'The Euphrates frontier', p:'The eastern border of Rome, and beyond it the feared Parthians.', b:`The Euphrates was the boundary between the Roman Empire and the Parthian Empire. Parthian horse-archers could shoot backward while riding, which may explain power "in their tails" (9:19). Rumors that Nero would return leading a Parthian army spread in the decades after his death.`, top:'euphrates', s:['koester']});
N('9:16','two hundred million','views',{t:'An army of 200 million', p:'A literal army from Asia, or a number meaning "beyond counting"?', b:`The Greek is "two myriads of myriads," twice the "ten thousand times ten thousand" of 5:11. Some futurists have pointed to China, which once claimed a militia of 200 million. Most others read an uncountable demonic host.`, r:'5:11; Psalm 68:17', s:['gregg']});
N('9:20','did not turn away from what their hands had made','echo',{t:'Idols that cannot see', p:'The prophets’ mockery of idols, and Pharaoh’s hard heart.', b:`The list of gold, silver, bronze, stone and wood idols that cannot see, hear, or walk comes from Daniel 5:23 and Psalm 115:4–7. Like Pharaoh after each plague (Exodus 8:15), people refuse to repent. Judgment in Revelation is aimed at repentance, which is why its failure is noted.`, r:'Daniel 5:23; Psalm 115:4–7; Exodus 8:15; 16:9; 16:11', top:'repentance'});
N('9:21','magic spells','word',{t:'"Sorceries": pharmakeia', greek:'φαρμάκων (pharmakōn), from φάρμακον (pharmakon, "drug, potion, spell")', p:'The root of "pharmacy," but here it means magic and potions.', b:`<i>Pharmakeia</i> meant mixing potions, poisons and spells. Some modern preachers read it as drug use or even the medical industry. In ancient usage it is about magic. It returns in 18:23, where Babylon deceives the nations by her <i>pharmakeia</i>.`, r:'Galatians 5:20; 18:23; 21:8; 22:15'});

/* ---- chapter 10 ---- */
N('10:1','another mighty angel','views',{t:'Is the mighty angel Christ?', p:'His face like the sun and feet like fire match Jesus in chapter 1.', b:`The cloud, rainbow, face like the sun and legs of fire echo 1:15–16 and the throne of 4:3. Some (especially older historicists) take him to be Christ. Most note he is called "another angel," swears by God rather than by himself, and resembles the angel of Daniel 10–12.`, r:'1:15–16; 4:3; Daniel 10:5–6; Daniel 12:7', top:'angels'});
N('10:4','Seal up what the seven thunders said','views',{t:'The unwritten message', p:'The one secret in an unsealed book.', b:`Some think the thunders were a series of judgments God decided to skip, in mercy (Bauckham). Others take it as a warning to humble interpreters: not everything is revealed (Deuteronomy 29:29). Psalm 29 describes "the voice of the LORD" as thunder seven times.`, r:'Psalm 29:3–9; Deuteronomy 29:29; 2 Corinthians 12:4; 22:10', top:'seven-thunders', s:['climax']});
N('10:6','There will be no more delay','word',{w:'time', p:'KJV "time no longer" is not about the end of time.'});
N('10:7','the mystery of God will be finished','echo',{t:'The mystery announced to the prophets', p:'Amos 3:7: "God does nothing without revealing his plan to his servants the prophets."', b:`The angel's words echo Amos 3:7 and Daniel 12:7. In the New Testament "mystery" means God's plan once hidden and now revealed: Christ, and Gentiles joined with Israel (Ephesians 3:3–6; Romans 16:25–26).`, r:'Amos 3:7; Daniel 12:7; Ephesians 3:3–6; Romans 16:25–26', top:'daniel'});
N('10:10','sweet as honey','echo',{t:'Eating the scroll', p:'Ezekiel ate a scroll that tasted like honey.', b:`Ezekiel 3:1–3: "Eat this scroll; then go and speak to the people of Israel... It tasted as sweet as honey in my mouth." Ezekiel's scroll was full of "lament and mourning and woe" (2:10). God's word is sweet to receive and painful to carry.`, r:'Ezekiel 2:8–3:3; Jeremiah 15:16; Psalm 19:10', top:'little-scroll'});

/* ---- chapter 11 ---- */
N('11:1','measure the temple of God','views',{t:'Which temple?', p:'Herod’s temple before AD 70, a future rebuilt temple, or the church?', b:`<b>Preterists</b>: the temple still stood when John wrote, so this was written before AD 70 and describes the siege. <b>Futurists</b>: a rebuilt third temple during the tribulation. <b>Idealists and many others</b>: the church as God's temple (1 Corinthians 3:16), protected inwardly while its outer life is trampled. Measuring signals protection, as in Ezekiel 40–42 and Zechariah 2:1–5.`, r:'Ezekiel 40:3; Zechariah 2:1–5; 1 Corinthians 3:16; Luke 21:24', top:'temple', s:['gregg']});
N('11:2','42 months','word',{w:'seven', p:'Revelation names 3½ years in several ways, but never "seven years."', top:'three-and-a-half'});
N('11:2','They will trample the holy city','echo',{t:'Trampled by the nations', p:'Jesus: "Jerusalem will be trampled by the Gentiles until the times of the Gentiles are fulfilled."', b:`Luke 21:24 uses the same words. Daniel 8:13 also speaks of the sanctuary being trampled. Preterists read the Roman siege; futurists a future occupation; idealists the church's suffering in the world.`, r:'Luke 21:24; Daniel 8:13; Zechariah 12:3', top:'jerusalem'});
N('11:4','the two olive trees and the two lampstands','echo',{t:'Zechariah’s two anointed ones', p:'In Zechariah 4 the two olive trees are a king and a priest.', b:`Zechariah 4:3, 11–14: two olive trees feed oil to a lampstand; they are "the two anointed ones who serve the Lord of all the earth," probably Zerubbabel the governor and Joshua the high priest. In Revelation the two witnesses are also two lampstands, which in 1:20 stand for churches.`, r:'Zechariah 4:2–14; 1:20', top:'two-witnesses'});
N('11:6','shut the sky','echo',{t:'Elijah and Moses', p:'One shuts the sky like Elijah, the other turns water to blood like Moses.', b:`Elijah stopped the rain (1 Kings 17:1) and called down fire (2 Kings 1:10). Moses turned water to blood (Exodus 7:20). Malachi 4:5 promised Elijah's return, and Moses and Elijah appear with Jesus at the transfiguration (Mark 9:4).`, r:'1 Kings 17:1; 2 Kings 1:10; Exodus 7:20; Malachi 4:5; Mark 9:4', top:'two-witnesses'});
N('11:8','the great city','views',{t:'Which great city?', p:'"Where their Lord was crucified" sounds like Jerusalem. But "the great city" is Babylon everywhere else.', b:`Preterists read Jerusalem: "where their Lord was also crucified." Others note that "the great city" is always Babylon later (16:19; 17:18; 18:10) and that John says it is called Sodom and Egypt "symbolically" (literally "spiritually"). On that reading it is the world's city, which crucified Jesus through Rome's governor.`, r:'16:19; 17:18; 18:10; Isaiah 1:9–10', top:'jerusalem', s:['gregg','bauckham']});
N('11:10','send each other gifts','spec',{t:'A dark Purim', p:'The book of Esther ends with feasting and sending gifts after enemies are killed.', b:`Esther 9:19–22 describes the Jewish festival of Purim, celebrated with "feasting and sending gifts to one another," after the enemies of God's people were defeated. Here the world celebrates the death of God's prophets in exactly those words. My suggestion: the scene is a deliberate inversion of Purim, and like Esther, the celebration is reversed in a moment (11:11).`, r:'Esther 9:19–22; 11:11'});
N('11:12','Come up here','views',{t:'"Come up here," again', p:'The same words as 4:1. Some see a mid-tribulation rapture here.', b:`Mid-tribulation readers see the church (pictured by the witnesses) raised and caught up halfway through, before the seventh trumpet, linking it to Paul's "last trumpet" (1 Corinthians 15:52). Others see a vindication scene modeled on Jesus's own resurrection and ascension.`, r:'4:1; 1 Corinthians 15:52; Acts 1:9', top:'rapture'});
N('11:15','The kingdom of the world has become the kingdom','word',{w:'kingdom', p:'The best manuscripts have one kingdom, the world’s, which changes hands.'});
N('11:19','the ark of his covenant','history',{t:'The lost ark', p:'Missing since 586 BC. Here it is seen in heaven.', b:`The ark disappeared when Babylon destroyed Solomon's temple. 2 Maccabees 2:4–8 says Jeremiah hid it in a cave until God gathers his people again. Revelation's answer: the true ark was always in heaven. Various groups have claimed to have it, including the Ethiopian Orthodox Church in Aksum.`, r:'Jeremiah 3:16; Hebrews 9:4', l:[['Ark of the Covenant','Ark of the Covenant']], top:'ark'});

/* ---- chapter 12 ---- */
N('12:1','a woman dressed in the sun','views',{t:'Who is the woman?', p:'Israel, Mary, the church, or all three?', b:`<b>Israel</b>: the sun, moon and twelve stars come from Joseph's dream of his family (Genesis 37:9), and Israel "gives birth" to the Messiah (Isaiah 66:7–8; Micah 5:3). <b>Mary</b>: she literally bore the child (a common Catholic and Orthodox reading). <b>The church</b>: her other children are believers (12:17). Many readers see the faithful people of God across both covenants.`, r:'Genesis 37:9; Isaiah 66:7–8; Micah 5:3; 12:17', top:'woman-of-ch12', s:['koester','gregg']});
N('12:1','a crown of twelve stars','myth',{t:'A queen of heaven', p:'Goddesses were pictured crowned with stars. So was the European flag.', b:`Ancient goddesses such as Isis and the Roman Juno were shown as queens of heaven with stars and the moon. John's woman is the true queen-mother. The circle of twelve gold stars on the European flag (1955) was partly inspired, by its designer's later account, by images of Mary based on this verse.`, l:[['Isis','Isis'],['Flag of Europe','Flag of Europe']], top:'woman-of-ch12'});
N('12:3','a huge red dragon with seven heads','myth',{t:'The seven-headed dragon', p:'Canaanite texts describe Litan, "the mighty one with seven heads."', b:`At Ugarit (about 1300 BC) Baal defeats Litan, "the twisting serpent, the mighty one with seven heads." The Old Testament calls this monster Leviathan and says God crushed its heads (Psalm 74:13–14; Isaiah 27:1). Babylon's Tiamat and Greek Typhon are similar chaos monsters.`, r:'Psalm 74:13–14; Isaiah 27:1; Job 41:1', l:[['Lotan','Lotan'],['Leviathan','Leviathan'],['Chaoskampf','Chaoskampf']], top:'dragon', s:['collins']});
N('12:4','a third of the stars','views',{t:'A third of the angels fell?', p:'A popular belief, but the text may mean something else.', b:`Many Christians believe a third of the angels followed Satan in a rebellion before creation, based on this verse. The verse is placed at the birth of Christ, and it echoes Daniel 8:10, where a horn (Antiochus) throws down some of the stars, meaning God's people. The idea of a pre-creation fall comes more from later tradition (and Milton's <i>Paradise Lost</i>) than from this text.`, r:'Daniel 8:10; Isaiah 14:12–15; Ezekiel 28:12–17; Jude 6', top:'dragon'});
N('12:5','snatched up to God','word',{w:'rapture', p:'The book’s only "rapture" (harpazō) is Jesus’s own ascension.', top:'rapture'});
N('12:5','She gave birth to a son','myth',{t:'Leto, Python and Apollo', p:'In Greek myth a dragon hunted a pregnant goddess. Ephesus told this story.', b:`The dragon Python hunted the pregnant Leto to keep her from bearing Apollo. She escaped (helped by the north wind or Poseidon) and gave birth on an island. Apollo later killed Python. Ephesus claimed the birth happened nearby, and Roman emperors presented themselves as Apollo. Many scholars think John retells the myth with Jesus as the real dragon-slayer.`, l:[['Leto','Leto'],['Python (mythology)','Python (mythology)']], top:'other-traditions', s:['collins','koester']});
N('12:7','Michael','echo',{t:'Michael', p:'In Daniel, the great prince who protects Israel.', b:`Daniel 10:13, 21; 12:1: Michael is "the great prince who protects your people," who arises in a time of great distress. Jude 9 calls him the archangel. In Revelation the war is won in heaven, but 12:11 says the real victory came "by the blood of the Lamb."`, r:'Daniel 10:13; Daniel 12:1; Jude 9; 12:11', top:'michael'});
N('12:9','that ancient serpent','echo',{t:'The serpent of Eden', p:'The dragon is the snake of Genesis 3, finally exposed.', b:`Revelation names the serpent of Genesis 3 as the devil, a link the Old Testament never makes outright (compare Wisdom 2:24 and Romans 16:20). Genesis 3:15 promised that the woman's offspring would crush the serpent's head; chapter 12 shows a woman, a child, and the serpent.`, r:'Genesis 3:1; Genesis 3:15; Romans 16:20; 20:2', top:'dragon'});
N('12:10','The accuser','word',{t:'Satan means "accuser"', greek:'ὁ κατήγωρ (ho katēgōr)', p:'The Hebrew satan is a prosecutor, as in Job and Zechariah.', b:`In Job 1–2 and Zechariah 3:1, "the satan" is the accuser in God's court. <i>Diabolos</i> (devil) means "slanderer." John's Greek word <i>katēgōr</i> is a legal term borrowed into Hebrew and Aramaic as well. After Christ's victory, the prosecutor loses his place in court (compare Romans 8:33–34).`, r:'Job 1:6–12; Zechariah 3:1–2; Romans 8:33–34; Luke 10:18'});
N('12:11','They defeated him by the blood of the Lamb','spec',{t:'Two weapons and a willingness', p:'The war in heaven is won on earth, by a cross and by testimony.', b:`Verses 7–9 show an angelic war; verses 10–11 reveal how it was really won: by the Lamb's blood, by believers' testimony, and by their refusal to love their lives. My reading: Michael's battle is the heavenly side of the cross, which explains why it happens right after the child is "snatched up" (12:5). Jesus links his death with Satan being "driven out" in John 12:31–32.`, r:'John 12:31–32; Colossians 2:15; 12:5', top:'overcomer'});
N('12:14','two wings of a great eagle','echo',{t:'On eagles’ wings', p:'God said he carried Israel out of Egypt "on eagles’ wings."', b:`Exodus 19:4: "I carried you on eagles' wings and brought you to myself." Deuteronomy 32:11 pictures God as an eagle spreading its wings over its young. The woman's flight into the wilderness, where she is fed, retells Israel's Exodus and manna. Some preterists see the Jerusalem church fleeing to Pella before AD 70 (Eusebius 3.5.3).`, r:'Exodus 19:4; Deuteronomy 32:11; Isaiah 40:31; Exodus 16:35', top:'exodus-pattern'});
N('12:14','a time, times, and half a time','echo',{t:'Daniel’s time formula', p:'Daniel 7:25 and 12:7: three and a half "times."', b:`The phrase comes from Daniel 7:25 and 12:7. Here it equals the 1,260 days of 12:6, which shows that John treats the different phrases as one period.`, r:'Daniel 7:25; Daniel 12:7; 12:6', top:'three-and-a-half'});
N('12:16','The earth opened its mouth','echo',{t:'The earth swallows', p:'In the Exodus story, the earth swallowed Pharaoh’s army and later Korah.', b:`Exodus 15:12 says of Pharaoh's army at the sea: "the earth swallowed them." Numbers 16:32: "the earth opened its mouth and swallowed" Korah's rebels. Creation itself takes the side of God's people.`, r:'Exodus 15:12; Numbers 16:32', top:'exodus-pattern'});

/* ---- chapter 13 ---- */
N('13:1','a beast coming up out of the sea','echo',{t:'Daniel’s four beasts in one', p:'Leopard, bear and lion, the beasts of Daniel 7, combined.', b:`Daniel 7:3–7 sees four beasts rise from the sea: a lion, a bear, a leopard, and a terrible fourth beast with ten horns. John's beast combines all four, in reverse order. Daniel's beasts are kingdoms (7:17). In John's time, the empire combining all earlier empires was Rome.`, r:'Daniel 7:2–8; Daniel 7:17; Daniel 7:23–24', top:'beasts'});
N('13:2','The beast I saw','word',{t:'Thērion: a wild animal', greek:'θηρίον (thērion)', p:'Not the "living creatures" of chapter 4. A wild, hunting animal.', b:`<i>Thērion</i> is a wild or dangerous animal, used for animals in the arena where Christians were killed. The word appears 38 times in Revelation, all for the beasts of chapters 11–20. The heavenly creatures of chapter 4 are <i>zōa</i>, "living ones."`, top:'beasts'});
N('13:3','the deadly wound was healed','history',{t:'The Nero legend', p:'Rumors said Nero had not died, or would return from the dead.', b:`Nero killed himself in AD 68 with a sword wound to the throat. Rumors spread that he was alive in the East and would return; at least three impostors appeared (Tacitus, <i>Histories</i> 2.8; Suetonius, <i>Nero</i> 57). Others link the healed head to Rome surviving the chaos of AD 69. Futurists expect a future ruler who survives or fakes a fatal wound.`, l:[['Nero redivivus legend','Nero redivivus legend']], top:'nero', s:['koester','aune']});
N('13:4','Who is like the beast?','spec',{t:'A counterfeit of "Who is like God?"', p:'The people’s cry parodies Israel’s song, and the name Michael.', b:`"Who is like you, LORD, among the gods?" was Israel's song after the Red Sea (Exodus 15:11). The name Michael means "Who is like God?" Many scholars note the parody of Exodus 15. My addition: placed just after Michael's victory in chapter 12, the crowd's question "Who is like the beast?" answers Michael's own name with the wrong answer.`, r:'Exodus 15:11; Micah 7:18; 12:7', top:'unholy-trinity'});
N('13:5','42 months','symbol',{t:'Limited authority', p:'"Was given," "was allowed": the beast’s power is on loan, for a set time.', b:`The verb "was given" appears again and again in chapter 13 (verses 5, 7, 14, 15). The beast's authority comes from the dragon (13:2), but the time limit comes from God. Forty-two months echoes Israel's 42 camps in the wilderness (Numbers 33).`, r:'Numbers 33:1–49; Daniel 7:25', top:'three-and-a-half'});
N('13:8','since the world was made','word',{t:'What happened "since the world was made"?', greek:'ἀπὸ καταβολῆς κόσμου (apo katabolēs kosmou)', p:'Names written since creation, or the Lamb slain since creation?', b:`The Greek word order allows "the Lamb slain from the foundation of the world" (KJV, NIV) or "names written from the foundation of the world" (ESV, NRSV). 17:8 uses the same phrase with names written in the book, which favors the second.`, r:'17:8; 1 Peter 1:19–20; Ephesians 1:4', top:'book-of-life'});
N('13:11','another beast coming up out of the earth','views',{t:'The second beast', p:'Later called "the false prophet." It looks like a lamb, but speaks like a dragon.', b:`Readers have seen: the priests of the imperial cult in Asia (preterists, many scholars); the papacy (Reformers); a future religious leader (futurists); or any religion that serves state power (idealists). From the 1850s, Seventh-day Adventist writers identified it with the United States, a "lamb-like" young nation with two horns (civil and religious liberty).`, top:'false-prophet', s:['friesen','gregg']});
N('13:15','give breath to the image','history',{t:'Speaking statues', p:'Ancient temples had statues that seemed to speak, and priests who staged wonders.', b:`Ancient writers describe hollow statues that "spoke" and tricks that made fire appear. Lucian (2nd century) mocked the false prophet Alexander, who made a snake-god appear to speak. In Asia, cities competed to build imperial temples with large emperor statues.`, l:[['Alexander of Abonoteichus','Alexander of Abonoteichus']], top:'imperial-cult', s:['friesen','aune']});
N('13:16','a mark on their right hand or on their forehead','word',{w:'inhand', p:'The Greek says "on," not "in." Charagma was a stamp or seal.', top:'mark'});
N('13:17','no one can buy or sell','history',{t:'Trade and the gods', p:'Guild membership and markets were tied to the worship of patron gods and the emperor.', b:`In cities like Thyatira, trade guilds held feasts honoring patron gods, and markets displayed the emperor's image. Roman coins bore his image and titles. Refusing to take part could cost a Christian their livelihood, a kind of pressure the letters of chapters 2–3 already describe.`, top:'mark', s:['koester','friesen']});
N('13:18','666','word',{w:'n616', p:'Some ancient copies read 616. Either way, it fits "Nero Caesar" in Hebrew letters.', top:'666'});

/* ---- chapter 14 ---- */
N('14:1','Mount Zion','echo',{t:'The king on Zion', p:'Psalm 2: "I have installed my king on Zion, my holy mountain."', b:`Psalm 2:6 sets God's anointed king on Zion against the rebellious nations, which is exactly the contrast with chapter 13. Joel 2:32: "on Mount Zion there will be deliverance." Hebrews 12:22 speaks of "the heavenly Jerusalem," Mount Zion, as something believers have already come to.`, r:'Psalm 2:6; Joel 2:32; Hebrews 12:22', top:'mount-zion'});
N('14:1',"his Father's name written on their foreheads",'symbol',{t:'Two foreheads', p:'Chapter 13 marks people with the beast’s name. Chapter 14 shows God’s.', b:`The two chapters are set side by side: the beast's mark and name (13:16–17) versus the Lamb's and Father's names (14:1). The high priest wore "Holy to the LORD" on his forehead (Exodus 28:36–38). Everyone belongs to someone.`, r:'13:16–17; Exodus 28:36–38; 22:4', top:'mark'});
N('14:4','did not make themselves impure with women','word',{w:'virgins', p:'A soldier’s purity before holy war? Faithfulness without idolatry?', top:'144000'});
N('14:4','firstfruits','israel',{t:'Firstfruits', p:'The first part of the harvest, given to God, promising more to come.', b:`Firstfruits were the first sheaves offered at the feast before the full harvest (Leviticus 23:10). James 1:18 calls believers "a kind of firstfruits of all he created." In this chapter, a full harvest follows (14:14–16).`, r:'Leviticus 23:10; James 1:18; Jeremiah 2:3; 14:15', top:'harvest'});
N('14:6','the eternal good news','views',{t:'The three angels’ messages', p:'A last call to repent. Seventh-day Adventists see their mission here.', b:`The first angel calls every nation to "fear God and give him glory" and worship the Creator. Adventist tradition reads 14:6–12 as God's last message, centered on the Sabbath (Exodus 20:11). Most others read a final offer of grace to all nations before the harvest.`, r:'Exodus 20:11; Matthew 24:14; 14:7', top:'three-angels'});
N('14:8','Fallen! Fallen is Babylon the Great','echo',{t:'Isaiah’s fall of Babylon', p:'"Babylon has fallen, has fallen!" (Isaiah 21:9).', b:`The cry is from Isaiah 21:9, and "Babylon the great" from Daniel 4:30, where Nebuchadnezzar boasts of the city he built. Jeremiah 51:7: "Babylon was a gold cup in the LORD's hand; she made the whole earth drunk."`, r:'Isaiah 21:9; Daniel 4:30; Jeremiah 51:7–8; 18:2', top:'babylon'});
N('14:11','The smoke of their torment rises forever and ever','views',{t:'Eternal torment?', p:'Eternal conscious punishment, final destruction, or symbol?', b:`Traditional readers see eternal conscious punishment. Others (conditional immortality, or "annihilationism") note that the image is copied from Isaiah 34:10, where Edom's smoke "rises forever" but the land is then inhabited by wild animals, so the image means complete, permanent destruction. A third group stresses that the scene is a warning meant to lead to repentance (14:7, 12).`, r:'Isaiah 34:9–10; Genesis 19:28; 19:3; 20:10', top:'lake-of-fire', s:['koester','gorman']});
N('14:13','Blessed are the dead who die in the Lord','echo',{t:'Rest from labor', p:'The second blessing of the book, for martyrs and all believers.', b:`"Rest" answers 14:11, where the beast's worshipers have "no rest." The verse echoes Hebrews 4:9–10 on entering God's rest. It is often read at Christian funerals.`, r:'Hebrews 4:9–10; 14:11; 6:11', top:'martyrs'});
N('14:14','someone like a son of man','views',{t:'Who reaps the grain?', p:'Christ, gathering his people? Or an angel of judgment?', b:`The "son of man" on a cloud with a gold crown seems to be Christ (1:13; Daniel 7:13). The grain harvest may picture the gathering of believers (Matthew 13:30; Mark 4:29); the grape harvest that follows is judgment. Some read both harvests as judgment. Notice that an angel tells him when to reap, as Jesus said only the Father knows the hour (Mark 13:32).`, r:'Daniel 7:13; Matthew 13:30; Mark 4:29; Joel 3:13; Mark 13:32', top:'harvest'});
N('14:20','about 184 miles','word',{t:'1,600 stadia', greek:'σταδίων χιλίων ἑξακοσίων (stadiōn chiliōn hexakosiōn)', p:'The Greek gives 1,600 stadia. Like most numbers here, it carries meaning.', b:`A stadion was about 607 feet, so 1,600 stadia is about 184 miles. The number is 40 × 40 or 4 × 4 × 100, both suggesting the whole world. Some point out it is close to the length of Israel from Tyre to the border of Egypt. Converting it to miles hides the pattern, so most literal translations keep "stadia."`, r:'Isaiah 63:1–6; Joel 3:13', top:'harvest'});

/* ---- chapter 15 ---- */
N('15:2','a sea of glass mixed with fire','echo',{t:'Standing beside the Red Sea', p:'Israel sang beside the sea after Pharaoh’s army drowned.', b:`Exodus 15: having crossed the sea, Moses and Israel sing. Here the conquerors of the beast stand beside a sea of glass and sing "the song of Moses and the song of the Lamb." The fire may suggest judgment or the pillar of fire.`, r:'Exodus 14:21–31; Exodus 15:1–18; 4:6', top:'sea-of-glass'});
N('15:3','the song of God\'s servant Moses and the song of the Lamb','spec',{t:'A song of Moses that never mentions their own victory', p:'Exodus 15 celebrates Israel’s rescue. This song celebrates God and the nations.', b:`Exodus 15 sings of Israel's escape and the enemy drowned. Remarkably, the song in Revelation 15:3–4 never mentions the singers' victory at all. It quotes Psalm 86:9 and Jeremiah 10:7 and ends with "all nations will come and worship." Bauckham noticed this. My addition: since the beast's followers just heard a call to repent (14:6–7), the song of the saved is about the nations turning to God, not about their own triumph.`, r:'Exodus 15:1–18; Psalm 86:9; Jeremiah 10:7; Deuteronomy 32:4; 14:6–7', top:'worship', s:['bauckham']});
N('15:5','the tent of the testimony','echo',{t:'The tent of witness', p:'The tabernacle in the wilderness, where the covenant tablets were kept.', b:`The "tent of the testimony" (Numbers 9:15; 17:7) held the ark and the tablets of the law. Judgment comes from the place of God's covenant. The smoke filling the temple recalls Exodus 40:34–35 and Isaiah 6:4.`, r:'Numbers 9:15; Exodus 40:34–35; Isaiah 6:4; 1 Kings 8:10–11', top:'temple'});

/* ---- chapter 16 ---- */
N('16:2','Ugly, painful sores','echo',{t:'The bowls and the trumpets', p:'Sores, blood, darkness: the plagues of Egypt again, now complete.', b:`The bowls follow the order of the trumpets: land, sea, rivers, sun, darkness, Euphrates, storm. The trumpets struck a third; the bowls strike all. Sores were Egypt's sixth plague (Exodus 9:8–11), and they fall on those who carry the beast's mark.`, r:'Exodus 9:8–11; Exodus 7:17–21; Exodus 10:21–23; 8:7–12', top:'bowls'});
N('16:6','you have given them blood to drink','symbol',{t:'Justice that fits', p:'They poured out blood; they receive blood.', b:`The angel calls this just because the punishment matches the crime. The pattern of "measure for measure" runs through the book: Babylon receives the cup she mixed (18:6), and the destroyers of the earth are destroyed (11:18).`, r:'18:6; 11:18; Isaiah 49:26; Galatians 6:7', top:'wrath'});
N('16:9','they refused to turn away from their sins','spec',{t:'Plagues meant to turn people', p:'Three times the bowls note people refusing to repent. Repentance was possible.', b:`16:9, 11 and 21 note that people curse God instead of repenting, just as in 9:20–21. If the plagues were only punishment, there would be no reason to note that people refused to repent. My reading: even the last judgments in Revelation are designed as a final appeal, like the plagues of Egypt, which were meant so that "the Egyptians will know that I am the LORD" (Exodus 7:5).`, r:'9:20–21; 16:11; 16:21; Exodus 7:5; 2 Peter 3:9', top:'repentance'});
N('16:12','the kings from the east','history',{t:'Kings from the east', p:'For John’s readers, the Parthians. For later readers, many candidates.', b:`Rome's eastern rivals the Parthians crossed the Euphrates more than once, and the Nero legend said Nero would return with them. In history and in the 20th century, readers have suggested Muslims, Japan, China, or other eastern powers. Cyrus took Babylon by diverting the Euphrates (Herodotus 1.191), and Isaiah 44:27–28 links the drying of rivers to Cyrus.`, r:'Isaiah 44:27–28; Jeremiah 51:36; 9:14', top:'euphrates'});
N('16:13','three evil spirits that looked like frogs','echo',{t:'Frogs', p:'Egypt’s second plague, and a symbol of unclean things.', b:`Frogs swarmed Egypt (Exodus 8:2–7), and Egypt's magicians copied the sign. Frogs were unclean animals (Leviticus 11:10). Some Persian texts call frogs creatures of the evil spirit Ahriman. Three spirits come from the three mouths of the dragon, the beast and the false prophet.`, r:'Exodus 8:2–7; Leviticus 11:10', top:'unholy-trinity'});
N('16:15','Look, I am coming like a thief!','spec',{t:'Why this interrupts Armageddon', p:'Right before the kings gather, Jesus speaks directly to the reader.', b:`Verse 15 breaks the scene with a beatitude about staying awake and keeping your clothes on, which echoes the warnings to Sardis (3:3–4) and Laodicea (3:18). My reading: John puts the call where you would least expect it, at the battle, because the real fight at Armageddon is about the reader staying faithful, not about military strategy.`, r:'3:3–4; 3:18; Matthew 24:43; 1 Thessalonians 5:2–6', top:'armageddon'});
N('16:16','Armageddon','word',{w:'armageddon', p:'Har Megiddo, "mountain of Megiddo." But Megiddo is a hill on a plain.', top:'armageddon'});
N('16:21','about a hundred pounds','word',{t:'"About a talent"', greek:'ὡς ταλαντιαία (hōs talantiaia)', p:'The Greek says the weight of a talent, roughly 75 to 100 pounds.', b:`A talent was a large weight, roughly 50–100 pounds depending on region. Josephus says that during the Roman siege of Jerusalem the catapults threw white stones weighing a talent, and that the watchmen shouted "The stone is coming!" (<i>Jewish War</i> 5.270). Preterists see this as the fulfillment; others read a supernatural storm, as in Exodus 9:24 and Joshua 10:11.`, r:'Exodus 9:24; Joshua 10:11; Ezekiel 38:22', s:['josephus','gregg']});

/* ---- chapter 17 ---- */
N('17:1','the great prostitute who sits on many waters','echo',{t:'"You who live by many waters"', p:'Jeremiah said this to ancient Babylon, which sat on the Euphrates.', b:`Jeremiah 51:13: "You who live by many waters and are rich in treasures, your end has come." Babylon sat on the Euphrates and its canals. 17:15 explains the waters as nations. The prophets often called idolatrous cities prostitutes (Isaiah 23:16–17 of Tyre; Nahum 3:4 of Nineveh; Ezekiel 16 of Jerusalem).`, r:'Jeremiah 51:13; Isaiah 23:16–17; Nahum 3:4; Ezekiel 16:15', top:'babylon'});
N('17:5','a mystery','word',{w:'mystery', p:'Is "Mystery" part of her name? The Greek allows "a name, a mystery."'});
N('17:6','drunk on the blood of God\'s people','history',{t:'Rome’s martyrs', p:'Nero’s persecution in AD 64 killed many Christians in Rome.', b:`Tacitus (<i>Annals</i> 15.44) describes Christians in Rome being torn by dogs, crucified, and burned as torches in Nero's gardens. Peter and Paul were remembered as martyrs there. Preterists who read Babylon as Jerusalem point instead to Matthew 23:35–37.`, r:'Matthew 23:35–37; 18:24', top:'nero', s:['koester']});
N('17:9','seven mountains','history',{t:'Seven hills', p:'Every ancient reader knew which city sat on seven hills.', b:`Rome was "the city of seven hills" (Latin poets: Virgil, Horace, Ovid, Martial). A coin of Vespasian shows the goddess Roma reclining on seven hills. The angel adds that the heads are also seven kings, so the image is doing double duty.`, l:[['Seven hills of Rome','Seven hills of Rome']], top:'rome', s:['aune','koester']});
N('17:10','Five have fallen, one is','views',{t:'Counting the seven kings', p:'Which emperors? The count changes the date of the book.', b:`Starting from Augustus: Augustus, Tiberius, Caligula, Claudius, Nero (five fallen), Galba or Vespasian (one is), and so on, depending on whether the three short reigns of AD 69 count. Starting from Julius Caesar shifts the list. Some say the seven are not emperors at all but seven empires (Egypt, Assyria, Babylon, Persia, Greece, Rome, and one to come), the common futurist view. Others read seven as a symbol of the full line of rulers.`, top:'dating', s:['aune','gregg']});
N('17:11','an eighth king','spec',{t:'An eighth who belongs to the seven', p:'Eight is the number of resurrection in early Christian thought.', b:`Early Christians called Sunday "the eighth day," the day of the resurrection (Barnabas 15:9). The beast "once was, now is not, and will come," a parody of God who "is, was, and is coming" (1:4). My speculation: the "eighth" king is a counterfeit resurrection, a revived old power posing as a new beginning. Interestingly, the Greek letters of "Jesus" (Iēsous) add up to 888, which some ancient Christians noticed (Sibylline Oracles 1.324–30), compared with the beast's 666.`, r:'1:4; 13:3; 17:8', top:'666'});
N('17:14','Lord of lords and King of kings','echo',{t:'Lord of lords', p:'Deuteronomy 10:17 and Daniel 4:37 in the Greek.', b:`Deuteronomy 10:17: "the LORD your God is God of gods and Lord of lords." In the Greek version of Daniel 4:37, Nebuchadnezzar calls God "Lord of lords and King of kings." The title appears again on the rider in 19:16, in reverse order.`, r:'Deuteronomy 10:17; Daniel 4:37; 1 Timothy 6:15; 19:16', top:'second-coming'});
N('17:16','will hate the prostitute','spec',{t:'Empire eats itself', p:'The beast turns on the city that rode it.', b:`The beast and its allies destroy the prostitute. Evil in Revelation is self-destructive, and God "put it into their hearts" (17:17). Preterists see Rome destroying Jerusalem; others, Rome burning in AD 64 or AD 69 (when the Capitol was burned in civil war); futurists a future betrayal. My reading: the scene shows that the economic system (the prostitute) and the political power (the beast) are allies of convenience, and the second will devour the first.`, r:'17:17; Ezekiel 23:25–29', top:'babylon'});

/* ---- chapter 18 ---- */
N('18:2','a home for demons','echo',{t:'A city of wild animals', p:'Isaiah and Jeremiah pictured fallen Babylon as a haunt of wild creatures.', b:`Isaiah 13:21–22; 34:11–14 and Jeremiah 50:39 describe Babylon and Edom becoming deserts haunted by owls, jackals and goat-demons. Ancient Babylon did become ruins, mostly abandoned by the 2nd century AD.`, r:'Isaiah 13:21–22; Isaiah 34:11–14; Jeremiah 50:39', top:'babylon'});
N('18:4','Come out of her, my people','echo',{t:'Leave Babylon', p:'Jeremiah 51:45: "Come out of her, my people! Run for your lives!"', b:`Jeremiah 51:45 and Isaiah 48:20; 52:11 call the exiles out of Babylon. Paul uses similar words for separation from idolatry (2 Corinthians 6:17). The reason here is to avoid sharing her sins, which suggests a spiritual and economic leaving, not only a physical one.`, r:'Jeremiah 51:45; Isaiah 52:11; 2 Corinthians 6:17; Genesis 19:15', top:'babylon'});
N('18:7','I sit as a queen','echo',{t:'"I will never be a widow"', p:'The boast of ancient Babylon in Isaiah 47.', b:`Isaiah 47:7–9: "You said, 'I will continue forever, the eternal queen!'... 'I will never be a widow.' Both of these will overtake you in a moment, on a single day." Revelation copies the boast and the "single day."`, r:'Isaiah 47:7–9; 18:8', top:'babylon'});
N('18:9','The kings of the earth','echo',{t:'The laments over Tyre', p:'Chapter 18 is modeled on Ezekiel’s funeral song for Tyre.', b:`Ezekiel 26–28 laments the trading city of Tyre: kings, merchants and sailors mourn, throw dust on their heads, and ask, "Who was ever like Tyre?" (27:32). Ezekiel 27:12–24 lists Tyre's cargo, like 18:12–13 here.`, r:'Ezekiel 26:16–18; Ezekiel 27:12–36', top:'babylon'});
N('18:13','slaves, that is, human lives','word',{t:'"Bodies and souls of men"', greek:'σωμάτων, καὶ ψυχὰς ἀνθρώπων (sōmatōn, kai psychas anthrōpōn)', p:'Slave traders called slaves "bodies." John adds: they are human lives.', b:`In Greek commerce, <i>sōmata</i> ("bodies") was the standard word for slaves. John adds "and human souls," quoting Ezekiel 27:13, where Tyre trades in "human beings." The cargo list ends with the item that exposes the rest. Rome's economy ran on slavery, perhaps 10 to 20 percent of the population.`, r:'Ezekiel 27:13; 1 Timothy 1:10', top:'babylon', s:['bauckham']});
N('18:21','a boulder the size of a large millstone','echo',{t:'A stone thrown into the river', p:'Jeremiah had a scroll tied to a stone and thrown into the Euphrates.', b:`Jeremiah 51:63–64: "When you finish reading this scroll, tie a stone to it and throw it into the Euphrates. Then say, 'So will Babylon sink to rise no more.'" Jesus spoke of a millstone tied around the neck of anyone who harms little ones (Matthew 18:6).`, r:'Jeremiah 51:63–64; Matthew 18:6', top:'babylon'});
N('18:23','The voices of a bridegroom and bride will never be heard in you again','spec',{t:'The bride moves to another city', p:'The wedding voices leave Babylon and are heard again at the Lamb’s wedding.', b:`Jeremiah used this line for Jerusalem's ruin (Jeremiah 7:34; 25:10). In the very next chapter, the wedding of the Lamb is announced (19:7). My observation: the book takes the bride and the wedding music away from Babylon, and moves them to the new city, which is itself "prepared like a bride" (21:2). It is a tale of two cities, and of two women.`, r:'Jeremiah 7:34; Jeremiah 25:10; 19:7; 21:2', top:'bride'});

/* ---- chapter 19 ---- */
N('19:1','Hallelujah','word',{t:'Hallelujah', greek:'ἁλληλουϊά (hallēlouia), Hebrew "praise Yah"', p:'Its only uses in the New Testament are here, four times.', b:`<i>Hallelu-yah</i> means "Praise the LORD." It occurs four times in 19:1–6 and nowhere else in the New Testament. Psalms 113–118 (the Hallel) were sung at Passover, and Psalm 104:35 ends with the first hallelujah of the psalter, right after a prayer that sinners vanish from the earth.`, r:'Psalm 104:35; Psalm 113:1; Psalm 146:1', top:'hallelujah'});
N('19:7','the wedding of the Lamb','echo',{t:'God’s marriage to his people', p:'The prophets called Israel God’s bride. Jesus called himself the bridegroom.', b:`Isaiah 54:5: "Your Maker is your husband." Hosea 2:19–20: "I will betroth you to me forever." Jesus called himself the bridegroom (Mark 2:19–20) and told wedding banquet parables (Matthew 22:1–14; 25:1–13). Paul applies it to Christ and the church (Ephesians 5:25–32).`, r:'Isaiah 54:5; Hosea 2:19–20; Mark 2:19–20; Matthew 22:1–14; Ephesians 5:25–32', top:'bride'});
N('19:8','the right things God\'s people have done','word',{w:'deeds', p:'"Righteousness of saints" is plural: righteous acts.'});
N('19:10','Worship God!','spec',{t:'Even John got it wrong, twice', p:'The book’s visionary bows to an angel, twice. A warning about being dazzled.', b:`John falls before the angel here and again in 22:8–9. The one who saw the vision was overwhelmed by its messenger. Several scholars suggest it warns against angel worship (compare Colossians 2:18). My application: if John himself could misplace his awe, readers should be humble about their interpretations, and keep worship on God alone, not on the prophecy or its interpreters.`, r:'22:8–9; Colossians 2:18; Acts 10:25–26'});
N('19:11','a white horse','echo',{t:'The faithful rider', p:'Christ’s white horse answers the conqueror of 6:2.', b:`Romans celebrated a triumph with the victorious general riding a white horse. The rider's eyes and sword repeat 1:14–16. He judges "with justice," from Isaiah 11:4.`, r:'6:2; 1:14–16; Isaiah 11:4; Psalm 45:3–5', top:'second-coming'});
N('19:13','a robe dipped in blood','spec',{t:'Whose blood? His own.', p:'The robe is bloodied before the battle starts.', b:`Isaiah 63:1–3 pictures the LORD coming with garments stained from treading the winepress of his enemies. But here the robe is already dipped in blood before any fighting, and the armies following him are in clean white. Many scholars (Caird, Bauckham) read the blood as Christ's own. I agree: the Word of God conquers as the Lamb who was slain (5:6), and the only weapon used is the sword of his mouth (19:15, 21).`, r:'Isaiah 63:1–3; 5:6; 7:14; 19:15; 19:21', top:'word-of-god', s:['bauckham']});
N('19:17','the great supper of God','echo',{t:'Two suppers', p:'Ezekiel 39: a feast for birds over Gog’s armies.', b:`Ezekiel 39:17–20: "Call out to every kind of bird... come together from all around to the sacrifice I am preparing for you." Revelation sets this "supper of God" against the "wedding supper of the Lamb" (19:9). Every reader is invited to one of the two meals.`, r:'Ezekiel 39:17–20; 19:9', top:'gog-magog'});
N('19:20','the lake of fire','history',{t:'Gehenna and the lake of fire', p:'Jesus spoke of Gehenna, a valley outside Jerusalem.', b:`The "lake of fire" is unique to Revelation. It draws on the fire of Sodom (Genesis 19:24), Isaiah 66:24, Daniel 7:11 (the beast "thrown into the blazing fire"), and Jesus's Gehenna, the Valley of Hinnom where children had been sacrificed (Jeremiah 7:31). 1 Enoch 90:24–26 has fallen angels thrown into a fiery abyss.`, r:'Daniel 7:11; Isaiah 66:24; Jeremiah 7:31; Matthew 25:41; 20:10', top:'lake-of-fire'});

/* ---- chapter 20 ---- */
N('20:2','a thousand years','views',{t:'The millennium', p:'A literal future reign, the church age, or a golden age before Christ returns?', b:`<b>Premillennial</b>: Christ returns first and reigns 1,000 years on earth. <b>Amillennial</b>: the thousand years is the present church age, with Satan bound by Christ's victory (Matthew 12:29). <b>Postmillennial</b>: the gospel will spread and bring a long golden age before Christ returns. The early church had both premillennial (Irenaeus) and non-literal (Origen, later Augustine) readers.`, r:'Matthew 12:29; Colossians 2:15; 1 Corinthians 15:23–25', top:'millennium', s:['gregg','augustine','irenaeus']});
N('20:2','tied him up','echo',{t:'Binding the strong man', p:'Jesus said he had come to tie up the strong man.', b:`Jesus: "How can anyone enter a strong man's house and carry off his possessions unless he first ties up the strong man?" (Matthew 12:29). Amillennialists read 20:2 as that binding, with Satan unable to "lead the nations astray" (stop the gospel) during the church age. Premillennialists note that Satan is very active in the New Testament (1 Peter 5:8), so the binding must be future. Compare Isaiah 24:21–22, where powers are imprisoned "and punished after many days."`, r:'Matthew 12:29; Isaiah 24:21–22; 1 Peter 5:8; Jude 6', top:'millennium'});
N('20:4','beheaded','history',{t:'Beheaded', p:'Beheading by axe was the Roman punishment for citizens.', b:`The Greek <i>pepelekismenōn</i> refers to beheading with an axe, the old Roman form of execution. Tradition says Paul, a citizen, was beheaded. The word marks these as martyrs of Rome.`, top:'martyrs'});
N('20:5','This is the first resurrection','views',{t:'The first resurrection', p:'A bodily resurrection, or new life in Christ?', b:`Premillennialists: a bodily resurrection of believers before the millennium, with the rest raised after. Amillennialists: either the new birth (John 5:24–29, where Jesus speaks of a spiritual resurrection now and a bodily one later), or the souls of martyrs entering heaven. The phrase "came to life" (<i>ezēsan</i>) is used of Jesus's resurrection in 2:8.`, r:'John 5:24–29; 2:8; 1 Corinthians 15:23; 1 Thessalonians 4:16', top:'first-resurrection'});
N('20:8','Gog and Magog','echo',{t:'Gog of the land of Magog', p:'Ezekiel 38–39: an invasion from the far north after Israel is restored.', b:`In Ezekiel, Gog is the ruler of the land of Magog who invades restored Israel and is destroyed by fire from heaven (Ezekiel 38:22; 39:6). In later Jewish tradition, Gog and Magog became two peoples representing all the nations. Readers have identified them with Scythians, Goths, Huns, Mongols, Turks and Russia.`, r:'Ezekiel 38:2–6; Ezekiel 38:22; Ezekiel 39:6; Genesis 10:2', top:'gog-magog'});
N('20:12','books were opened','echo',{t:'The books', p:'From Daniel 7:10: "The court was seated, and the books were opened."', b:`Daniel 7:10 and 12:1–2 picture books at the final judgment. Judgment is "by what they had done," and yet entry depends on the book of life (20:15), the Lamb's book (21:27). Works show who people are; the Lamb's book shows whose they are.`, r:'Daniel 7:10; Daniel 12:1–2; Malachi 3:16; 20:15; 21:27', top:'white-throne'});
N('20:14','Death and Hades were thrown into the lake of fire','spec',{t:'Death is thrown in first', p:'The first thing to be destroyed at the end is death.', b:`Death and Hades ride as the fourth horseman (6:8). Here they are thrown into the lake of fire. Paul: "The last enemy to be destroyed is death" (1 Corinthians 15:26). My reading: the lake of fire is presented as the destruction of the powers that ruin creation, which is why it is called "the second death." Whatever one concludes about its human victims, the text's first emphasis is that death itself dies.`, r:'6:8; 1 Corinthians 15:26; 1 Corinthians 15:54–55; Isaiah 25:8', top:'lake-of-fire'});

/* ---- chapter 21 ---- */
N('21:1','a new heaven and a new earth','echo',{t:'Isaiah’s new creation', p:'"See, I will create new heavens and a new earth" (Isaiah 65:17).', b:`Isaiah 65:17; 66:22; 2 Peter 3:13. The Greek word for new, <i>kainos</i>, often means new in quality, renewed, rather than brand new. Debate: is this creation destroyed and replaced, or renewed (Romans 8:19–22)?`, r:'Isaiah 65:17; Isaiah 66:22; 2 Peter 3:13; Romans 8:19–22', top:'new-creation'});
N('21:1','the sea was no more','symbol',{t:'No more sea', p:'Sea meant chaos, the beast’s home, and the gulf between John and his churches.', b:`The sea is where the beast rose (13:1), where Babylon's trade sailed (18:17), and where the dead lay (20:13). For John on Patmos, it also separated him from his churches. No more sea means nothing left that threatens or divides.`, r:'13:1; 18:17; 20:13; Isaiah 57:20', top:'sea'});
N('21:3','God\'s home is now with people','word',{t:'"The tabernacle of God"', greek:'ἡ σκηνὴ τοῦ θεοῦ (hē skēnē tou theou), "the tent of God"', p:'Skēnē, "tent," echoes the Hebrew Shekinah, God’s dwelling presence.', b:`<i>Skēnē</i> means tent or tabernacle. It sounds like the Hebrew <i>shekinah</i>, God's dwelling glory, and is used in John 1:14: "The Word became flesh and tabernacled among us." Leviticus 26:11–12 and Ezekiel 37:27 promise that God will dwell with his people. Note "his peoples," plural, in the best manuscripts.`, r:'Leviticus 26:11–12; Ezekiel 37:27; John 1:14; 7:15', top:'new-jerusalem'});
N('21:4','He will wipe every tear from their eyes','echo',{t:'No more death', p:'Isaiah 25:8: "He will swallow up death forever."', b:`Isaiah 25:8 and 65:19 ("the sound of weeping and of crying will be heard in it no more"). This promise was given to the multitude in 7:17, and now it is fulfilled for everyone in the city.`, r:'Isaiah 25:8; Isaiah 65:19; 7:17; 1 Corinthians 15:54'});
N('21:12','the names of the twelve tribes of Israel','israel',{t:'Israel and the apostles in one city', p:'The gates bear Israel’s tribes, the foundations the apostles.', b:`The city is built on both: twelve tribes on the gates (from Ezekiel 48:30–35) and twelve apostles on the foundations. Many read this as the one people of God from both covenants. Some dispensationalists see Israel and the church as distinct groups who share the same city.`, r:'Ezekiel 48:30–35; Ephesians 2:19–22; Matthew 19:28', top:'church-israel'});
N('21:16','about 1,400 miles','spec',{t:'The size of the known world', p:'12,000 stadia is roughly the size of the Hellenistic world.', b:`12,000 stadia (about 1,400 miles) is a symbolic number (12 × 1,000). Several scholars note that a square that size would cover roughly the area from Rome to the Euphrates, or the Hellenistic world. My speculation: John's readers may have pictured the new Jerusalem as large enough to cover all their known world, so the holy of holies becomes as large as the empire it replaces.`, r:'1 Kings 6:20; Ezekiel 48:16', top:'new-jerusalem'});
N('21:19','every kind of precious stone','echo',{t:'Jewels of the high priest and of Zion', p:'The high priest’s breastplate, and Isaiah’s jeweled city.', b:`Exodus 28:17–21 has twelve stones engraved with the names of the tribes. Isaiah 54:11–12: "I will build you with stones of turquoise, your foundations with sapphires... your gates of sparkling jewels." Tobit 13:16–17 also imagines Jerusalem rebuilt with gems.`, r:'Exodus 28:17–21; Isaiah 54:11–12; Ezekiel 28:13', top:'gems'});
N('21:21','a single pearl','spec',{t:'Pearl gates and the pearl of great price', p:'Jesus told of a merchant who sold everything for one pearl.', b:`Pearls were the most valuable gems in the Roman world. In Matthew 13:45–46 the kingdom of heaven is like a merchant who sold everything to buy one priceless pearl. My suggestion: John may want readers to recall that parable, especially after the merchants' lament over Babylon's pearls (18:12, 16). Babylon's merchants lose their pearls; the city of God is entered through them. (The "pearly gates" with Saint Peter as gatekeeper is later folklore.)`, r:'Matthew 13:45–46; 18:12; 18:16', top:'gems'});
N('21:22','I did not see a temple in the city','symbol',{t:'No temple', p:'The whole city is the Most Holy Place.', b:`The city is a cube (21:16), like the Most Holy Place (1 Kings 6:20). Only the high priest entered it, once a year. Now everyone lives in God's presence, and "they will see his face" (22:4), which even Moses could not (Exodus 33:20).`, r:'1 Kings 6:20; Exodus 33:20; 22:4; John 2:19–21', top:'temple'});
N('21:24','the kings of the earth will bring their glory into it','spec',{t:'The kings of the earth come back', p:'The same kings who served Babylon now bring their glory to the city.', b:`"The kings of the earth" committed sin with Babylon (17:2; 18:9) and fought the Lamb (19:19). Now they bring their glory into the new Jerusalem, as in Isaiah 60:3–11. Many scholars (Bauckham, Caird) see a note of hope for the nations here. My own reading is cautious: the text gives no timeline, but its final picture of "the nations" is of healing (22:2), not destruction.`, r:'Isaiah 60:3–11; 17:2; 19:19; 22:2', top:'new-jerusalem', s:['bauckham']});

/* ---- chapter 22 ---- */
N('22:1','the river of the water of life','echo',{t:'The river from the temple', p:'Ezekiel 47: a river flows from the temple and heals everything.', b:`Ezekiel 47:1–12: water flows from under the temple, growing deeper, making salt water fresh, with fruit trees on both banks whose leaves heal. Zechariah 14:8 and Psalm 46:4 ("a river whose streams make glad the city of God") join in. Genesis 2:10 has a river flowing out of Eden.`, r:'Ezekiel 47:1–12; Zechariah 14:8; Psalm 46:4; Genesis 2:10; John 7:37–38', top:'tree-of-life'});
N('22:2','healing the nations','spec',{t:'Why does anyone need healing?', p:'In a city with no more pain, the leaves are still "for healing the nations."', b:`If there is no more pain (21:4), why healing? Some read it as a picture of fullness of life, others as a continuing process. My speculation: the leaves answer the curse of Babel and of the nations' long war against God. The nations arrive in the city with histories that need healing, and the tree from Eden provides it.`, r:'Ezekiel 47:12; 21:4; Genesis 11:9; Genesis 3:22', top:'tree-of-life'});
N('22:3','There will no longer be any curse','echo',{t:'The curse lifted', p:'Genesis 3 began with a curse. Revelation ends with none.', b:`Genesis 3:17: "Cursed is the ground because of you." Zechariah 14:11: "Never again will it be destroyed. Jerusalem will be secure." The Bible's story ends where it began, in a garden, with the curse removed.`, r:'Genesis 3:17; Zechariah 14:11; Galatians 3:13', top:'new-creation'});
N('22:4','They will see his face','echo',{t:'The face of God', p:'Moses could not see God’s face and live. Here everyone does.', b:`Exodus 33:20: "You cannot see my face, for no one may see me and live." Psalm 17:15: "I will be satisfied with seeing your likeness." Jesus: "Blessed are the pure in heart, for they will see God" (Matthew 5:8). The name on their foreheads recalls the high priest's gold plate (Exodus 28:36–38).`, r:'Exodus 33:20; Psalm 17:15; Matthew 5:8; 1 John 3:2; Exodus 28:36–38'});
N('22:10','Do not seal up the words','echo',{t:'Unseal it', p:'Daniel was told to seal his book. John is told not to.', b:`Daniel 12:4: "Close up and seal the words of the scroll until the time of the end." John is told the opposite, "because the time is near." Preterists stress that the nearness was for the first readers. Others see "the time of the end" as having begun with Christ (Hebrews 1:2; 1 John 2:18).`, r:'Daniel 12:4; Daniel 12:9; Hebrews 1:2; 1 John 2:18', top:'soon'});
N('22:14','wash their robes','word',{w:'washrobes', p:'KJV "do his commandments" follows a different manuscript reading.'});
N('22:15','the dogs','history',{t:'"The dogs"', p:'A harsh word for people outside the covenant, used by Jews and by Paul.', b:`Dogs in the ancient Near East were scavengers, not pets. The word was an insult for the unclean or for pagans, and Deuteronomy 23:18 may use it for male temple prostitutes. Paul uses it for false teachers (Philippians 3:2). The list matches 21:8.`, r:'Deuteronomy 23:18; Philippians 3:2; 21:8; Matthew 7:6'});
N('22:16','the bright Morning Star','echo',{t:'The Root and the Star', p:'Isaiah’s root of Jesse and Balaam’s star from Jacob, together.', b:`"The Root of David" comes from Isaiah 11:1, 10 (see 5:5). "A star will come out of Jacob" is Balaam's prophecy (Numbers 24:17). The morning star was promised to Thyatira (2:28); now Jesus says he is that star.`, r:'Isaiah 11:1; Isaiah 11:10; Numbers 24:17; 2:28; 2 Peter 1:19'});
N('22:17','The Spirit and the bride say, "Come!"','spec',{t:'Who is being called to come?', p:'"Come!" is said three times: to Jesus, to the hearer, to the thirsty.', b:`The first "Come!" may be the church calling Jesus to return (22:20). The second invites each hearer to join that prayer. The third invites the thirsty to come and drink. My reading: the book ends by turning its four horsemen's "Come!" (6:1, 3, 5, 7), which summoned disasters, into a welcome. The same word that released judgment now opens the door to the water of life.`, r:'6:1; 6:3; 6:5; 6:7; Isaiah 55:1; John 7:37; 22:20'});
N('22:19','tree of life','word',{w:'bookoflife', p:'KJV "book of life" here comes from Erasmus’s back-translation from Latin.', top:'textual-history'});
N('22:20','Come, Lord Jesus','word',{t:'Maranatha', greek:'ἔρχου κύριε Ἰησοῦ (erchou kyrie Iēsou)', p:'The Greek form of the oldest Christian prayer, "Our Lord, come!"', b:`Paul kept the Aramaic <i>Maranatha</i> in 1 Corinthians 16:22. The Didache (10:6) uses it in a communion prayer. The book that began "the time is near" ends with the church praying for the coming of the one it worships.`, r:'1 Corinthians 16:22; 1:3; 22:7', top:'maranatha'});
N('13:12','the first beast','word',{w:'antichrist', p:'The word "antichrist" never appears in Revelation.', top:'antichrist'});
N('20:4','They came to life and ruled with Christ for a thousand years','word',{w:'millennium', p:'The whole doctrine of the millennium rests on this one passage.', top:'millennium'});

/* ---------- chapter 21 in depth: 21:8, the second death, and the city ---------- */
{
const c21 = CHAPTERS[20];
c21.sum.push(`Then comes a hard verse. Right after the promise "I will be their God," 21:8 lists the cowardly, the unfaithful, murderers, liars and others, and says their place is "the lake that burns with fire and sulfur. This is the second death." Below the four views are a closer look at what that verse does and does not say, what "the second death" meant to John's first readers, and a guide to the parts of the city.`);
c21.deep = [
 {h:'Does 21:8 cancel forgiveness?', html:`
  <p>Read on its own, 21:8 can sound like "sinners burn in hell." Read in its setting, it says something narrower and more pointed. Five things in the text itself are worth noticing.</p>
  <p><b>1. It describes people who stay that way, not people who once did those things.</b> Paul gives a very similar list: "Do you not know that wrongdoers will not inherit the kingdom of God?... And that is what some of you were. But you were washed" (1 Corinthians 6:9–11). Revelation says the same thing in its own picture language. The people inside the city are not people who never sinned. They are people who "washed their robes and made them white in the blood of the Lamb" (7:14; 22:14). The difference between inside and outside is not a clean record but a washing.</p>
  <p><b>2. Revelation keeps offering forgiveness up to its last page.</b> Even "Jezebel" is given "time to repent" (2:21). Two verses before 21:8, God says, "To anyone who is thirsty I will give water from the spring of the water of life as a free gift" (21:6). The book's last invitation is "Let anyone who wants to take the water of life as a free gift" (22:17). And the plagues keep noting, with sorrow, that people "refused to turn away from their sins" (9:20–21; 16:9, 11). Repentance is open until it is refused.</p>
  <p><b>3. The list starts with Christians who give up.</b> "Cowardly" (<i>deiloi</i>) and "unfaithful" (<i>apistoi</i>, "faithless") come first, before murderers. In a book written to persecuted churches, the cowardly are believers who deny Jesus to save themselves, the opposite of Antipas, who "did not deny" (2:13), and of the martyrs who "did not love their lives" (12:11). The verse is the dark twin of 21:7: "The one who wins the victory will inherit all this." It is a warning aimed first at the church, not a verdict on everyone outside it.</p>
  <p><b>4. "Liars" is a loyalty word.</b> In Revelation the liars are false apostles (2:2), people who "say they are Jews and are not, but are lying" (3:9), and the false prophet. The 144,000 have "no lie in their mouths" (14:5). Lying here means a false allegiance, the opposite of Jesus, "the faithful witness" (1:5).</p>
  <p><b>5. "Their place" is really "their share."</b> The Greek <i>to meros autōn</i> means "their portion," an inheritance word. Revelation uses the same word for those who have "a share in the first resurrection," over whom "the second death has no power" (20:6), and for a "share in the tree of life" (22:19). Everyone receives a share. The question the verse presses is which one you are choosing.</p>
  <p class="small">So 21:8 does not take back forgiveness. It assumes it: the cure for every item on the list is offered, free, in the verses on either side. What it denies is that someone can keep refusing the cure and still end up inside. The deeper questions are still debated (see "The second death," next), but none of the major Christian views reads this verse as "no forgiveness for murderers or liars."</p>`},
 {h:'Is this "hell"?', html:`
  <p>Not in the way the word is usually used. Modern translations of Revelation never use the word "hell." The KJV's "hell" (1:18; 6:8; 20:13–14) translates <i>Hadēs</i>, the realm of the dead, the grave. And in 20:14 Hades itself is thrown into the lake of fire. So "hell" and "the lake of fire" are not the same thing in Revelation; one is emptied into the other.</p>
  <p>The New Testament has several different words that English Bibles often flatten into "hell": <i>Hadēs</i> (the grave, Sheol); <i>Gehenna</i> (the burning valley outside Jerusalem, Jesus's word, Mark 9:43–48); <i>Tartarus</i> (a prison for fallen angels, 2 Peter 2:4); and Revelation's own "lake of fire." Keeping them apart helps you hear what each passage actually says.</p>`},
 {h:'The second death', html:`
  <p>The phrase appears four times in the Bible, all in Revelation: 2:11; 20:6; 20:14; 21:8. It is defined twice: "The lake of fire is the second death" (20:14; 21:8).</p>
  <p><b>Where it came from.</b> It was not John's invention. The Aramaic Targums, the paraphrases of Scripture read aloud in synagogues, use "the second death" for final judgment after the first, physical death. Targum Onkelos on Deuteronomy 33:6 reads, "Let Reuben live, and not die the second death." The Targum of Jeremiah 51:39 and 57 says Babylon's rulers will "die the second death and not live in the world to come." The Targum of Isaiah uses it as well (22:14; 65:6, 15). For John's Jewish readers it meant "shut out of the world to come." Notice that the Jeremiah Targum uses it of Babylon, the same enemy Revelation has just watched fall.</p>
  <p><b>A comfort before it is a threat.</b> Its first use is a promise to Smyrna, a church about to suffer and die: "The one who wins the victory will not be harmed by the second death" (2:11). The point is that the first death, the one Rome can inflict, is not the one that matters. Jesus said, "Do not be afraid of those who kill the body but cannot kill the soul" (Matthew 10:28).</p>
  <p><b>A pair with the first resurrection.</b> "Blessed and holy are those who share in the first resurrection. The second death has no power over them" (20:6). Augustine explained the pairing this way: there is a first resurrection of the soul now (coming to life in Christ, John 5:24–25) and a second of the body later; a first death of the body and a second, final death. An old Christian saying puts it: "Born once, die twice. Born twice, die once."</p>
  <p><b>What it means: the three main views.</b></p>
  <ul>
   <li><b>Eternal conscious punishment.</b> The second death is unending separation from God, felt forever. This is the historic majority view (Augustine, Aquinas, most Reformers), citing 14:11 and 20:10.</li>
   <li><b>Conditional immortality (annihilationism).</b> "Death" means what it says: the end of existence, final and permanent. Only God has immortality by nature (1 Timothy 6:16). Held by John Stott (cautiously) and Edward Fudge, and growing among evangelicals.</li>
   <li><b>Hopeful universalism.</b> The fire purifies, and in the end all may be restored, pointing to the open gates and the healing of the nations (21:25; 22:2). Held by Origen and some modern writers; a minority view that must explain 22:15, where some are still "outside."</li>
  </ul>
  <p class="small">A Greek parallel: Plutarch (about AD 100) also wrote of a "second death," the soul's final separation from the mind after the first death (<i>On the Face of the Moon</i> 943). It is a different idea with no known link to Revelation.</p>`},
 {spec:true, title:'The second death is what happens to death', body:`The book shows Death as a rider (6:8) and Death and Hades as a pair that hold the dead (1:18; 20:13). In 20:14 they are thrown into the lake, and only then does John say "this is the second death." My reading: the first thing that "dies the second death" is death itself. That is why the very next scene can say "there will be no more death" (21:4). The people of 21:8 are those who keep holding on to what is being destroyed. They tie their lives to the losing side, the way the kings tie themselves to Babylon and then mourn her (18:9). This is not a new doctrine, and it does not settle the debate between the views above. It is a way of seeing that the lake is first of all God ending everything that ruins his world, and that the warning of 21:8 is "don't be found holding on to it."`, refs:'6:8; 1:18; 20:13–14; 21:4; 18:9; 1 Corinthians 15:26'},
 {h:'Is the city literal or symbolic?', html:`
  <p>Literal readers (for example, John Walvoord and many dispensational teachers) take the city as a real place of real size, about 1,400 miles on each side, where the redeemed will live. Most other readers think it is a real future described in symbols, and the text gives several clues pointing that way:</p>
  <ul>
   <li><b>The angel says one thing and shows another.</b> "Come, I will show you the bride, the wife of the Lamb," and then he shows John a city (21:9–10). Earlier, the prostitute "is the great city" (17:18). Both women are cities and both cities are peoples. The new Jerusalem is first of all God's people.</li>
   <li><b>The numbers do not fit together as architecture.</b> The city is 12,000 stadia high, but its wall is 144 cubits (about 216 feet), tiny against a 1,400-mile height. Both numbers are built on twelve. They make sense as meaning, not as blueprints.</li>
   <li><b>The materials are impossible on purpose.</b> Gold "as clear as glass" (21:18, 21) is not a metal anyone has seen. Each gate is one pearl.</li>
   <li><b>"By human measurement, which the angel was using" (21:17).</b> This seems to say that the angel's numbers are given in our units so that we can read their meaning.</li>
  </ul>
  <p>A middle position is common: the new creation is a real, bodily, physical future (Romans 8:21; 1 Corinthians 15), and the city is a picture of what it will be like and who will be there.</p>`},
 {h:'The parts of the city, and what they may mean', html:`
  <div class="card"><h4>Coming down from heaven (21:2, 10)</h4><p>Ancient cities claimed to be founded by gods or heroes. Babel was built "with a tower that reaches to the heavens" (Genesis 11:4). This city is not built up by people; it comes down from God, as a gift.</p></div>
  <div class="card"><h4>A bride (21:2, 9)</h4><p>The city is a people. Compare Babylon, a prostitute dressed in gold, jewels and pearls (17:4). The bride is built from the same materials, but they are her structure, not her costume.</p></div>
  <div class="card"><h4>A high mountain (21:10)</h4><p>Ezekiel was taken "to a very high mountain" to see the new temple city (Ezekiel 40:2), and Isaiah saw the LORD's mountain raised above all others (Isaiah 2:2). John saw Babylon from a wilderness (17:3); he sees the bride from a mountain.</p></div>
  <div class="card"><h4>Like jasper (21:11, 18)</h4><p>The one on the throne "shone like jasper" (4:3). The city shines with God's own appearance.</p></div>
  <div class="card"><h4>A great, high wall (21:12, 17)</h4><p>Walls meant safety and identity: you were either a citizen or not. With gates that never close (21:25), this wall is not for defense. It marks who belongs.</p></div>
  <div class="card"><h4>Twelve gates, three on each side, with tribal names (21:12–13)</h4><p>Israel camped around the tabernacle three tribes to a side (Numbers 2). Ezekiel's city has twelve gates named for the tribes, three on each side (Ezekiel 48:30–35), and its name is "The LORD is there." An Aramaic text from the Dead Sea Scrolls, the "Description of the New Jerusalem" (4Q554 and others), also imagines a vast, measured city with twelve gates named for the tribes. John was writing within a known Jewish hope.</p></div>
  <div class="card"><h4>Twelve foundations with the apostles' names (21:14)</h4><p>"Built on the foundation of the apostles and prophets, with Christ Jesus himself as the chief cornerstone" (Ephesians 2:20). Israel on the gates, apostles underneath: one city for the people of both covenants.</p></div>
  <div class="card"><h4>The gold measuring rod (21:15)</h4><p>In Ezekiel 40:3 and Zechariah 2:1–5, measuring means God claims and protects a place. John measured the temple in 11:1 while the outer court was trampled; now the whole city is measured and nothing is left out.</p></div>
  <div class="card"><h4>A cube (21:16)</h4><p>The only cube in Scripture is the Most Holy Place in Solomon's temple, 20 cubits each way, overlaid with pure gold (1 Kings 6:20). Only the high priest entered it, once a year. Now the whole city is that room, and everyone lives there.</p></div>
  <div class="card"><h4>Pure gold, clear as glass (21:18, 21)</h4><p>The Most Holy Place was lined with gold (1 Kings 6:20–22). The city is made of what used to line God's private room. Glass in the Roman world was a luxury, and clear glass was hard to make; the image is of perfect purity with nothing hidden.</p></div>
  <div class="card"><h4>Twelve foundation jewels (21:19–20)</h4><p>They echo the twelve stones on the high priest's breastplate, each engraved with a tribe's name (Exodus 28:17–21), and Isaiah's promise of a city rebuilt with sapphires and rubies (Isaiah 54:11–12). The people once carried over the high priest's heart are now the city's foundation.</p></div>
  <div class="card"><h4>Gates of single pearls (21:21)</h4><p>Pearls were the most prized gems in Rome; Pliny says they held "the highest rank among all valuables" (<i>Natural History</i> 9.106). A later rabbinic tradition (Babylonian Talmud, <i>Bava Batra</i> 75a) says God will set huge single gems, 30 cubits across, as the gates of Jerusalem. Jesus's kingdom is "a pearl of great price" (Matthew 13:45–46).</p></div>
  <div class="card"><h4>One main street of gold (21:21; 22:1–2)</h4><p>Greek and Roman cities in Asia were built around a grand colonnaded main street. Ephesus had its marble Arcadian Way running to the harbor, lit at night in later centuries. This city's main street is gold, and down its middle runs the river of life (22:1–2).</p></div>
  <div class="card"><h4>No temple, no sun, no night (21:22–25)</h4><p>Every city in Asia was proud of its temples: Artemis at Ephesus, Zeus at Pergamum, the emperor in nearly all seven. This city has none, "because the Lord God, the All-Powerful, and the Lamb are its temple." "The sun will no more be your light... for the LORD will be your everlasting light" (Isaiah 60:19–20).</p></div>
  <div class="card"><h4>Gates never shut (21:25–26)</h4><p>Ancient city gates were closed every night against raiders, and opened by day for trade. Isaiah 60:11: "Your gates will always stand open, they will never be shut, day or night, so that people may bring you the wealth of the nations." No enemies are left, so there is nothing to shut out.</p></div>
  <div class="card"><h4>Nothing unclean enters (21:27)</h4><p>From Isaiah 52:1. Who gets in is decided by one thing: "those whose names are written in the Lamb's book of life." The entry list is the Lamb's, which is the answer to the worry about 21:8.</p></div>`},
 {spec:true, title:'A Babylon that has been turned inside out', body:`The Greek historian Herodotus, read by educated people all over Asia Minor, described ancient Babylon as a perfect square, 120 stadia on each side, with a huge wall, a hundred bronze gates, and the Euphrates running through the middle of the city (<i>Histories</i> 1.178–180). John's city is also a square, with a wall, many gates, and a river running down its middle (22:1). My suggestion: John's first readers would have heard the new Jerusalem as the true version of the famous great city. Babylon's river was a highway for trade and an invasion route (Cyrus took the city by diverting it); this city's river is the water of life. Babylon's gates kept enemies out; this city's gates never close. Babylon's merchants grew rich from its wealth (18:11–19); here the kings bring their glory in as a gift (21:24–26). Many scholars contrast the two cities as the two women of chapters 17 and 21. The link to Herodotus's square, walled, river city is my own, and I have not found it argued in the commentaries I know.`, refs:'17:4–5; 18:11–19; 21:16; 21:24–26; 22:1–2'}
];
}
