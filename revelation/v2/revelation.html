  {h:'The trumpets and the Exodus plagues', table:[['Trumpet','What happens','Exodus parallel'],['1','Hail and fire mixed with blood; a third of trees burned (8:7)','Plague 7: hail and fire (Exodus 9:23–25)'],['2','A burning mountain thrown into the sea; a third of the sea becomes blood (8:8–9)','Plague 1: water to blood (Exodus 7:20–21)'],['3','A star called Wormwood makes waters bitter (8:10–11)','Plague 1; the bitter water of Marah (Exodus 15:23)'],['4','A third of sun, moon and stars darkened (8:12)','Plague 9: darkness (Exodus 10:21–23)'],['5 (first woe)','Locusts from the abyss torment people for five months (9:1–11)','Plague 8: locusts (Exodus 10:12–15)'],['6 (second woe)','Four angels at the Euphrates; an army of 200 million (9:13–21)','Plague 10: death (Exodus 12:29)'],['7 (third woe)','"The kingdom of the world has become the kingdom of our Lord" (11:15)','Israel’s song after the Exodus (Exodus 15:18)']]},
  ['What trumpets meant',`Israel's ram's-horn and silver trumpets called the people to battle and to festivals, announced a new king, and warned of attack. At Jericho, seven priests blew seven trumpets for seven days, and the walls fell (Joshua 6). The prophets spoke of "the day of the trumpet and battle cry" (Zephaniah 1:16), and Paul of "the last trumpet" at the resurrection (1 Corinthians 15:52). Leviticus 23:24 sets a festival of trumpets.`],
  ['Warning, not the end',`The trumpets hit "a third," never everything. Their purpose is to call people to repent, but "the rest of humanity... did not repent" (9:20–21). This is why the seventh trumpet is followed by worship, not destruction.`],
  ['The pause',`Between the sixth and seventh trumpets comes a long interlude: the mighty angel and the little scroll (10:1–11) and the two witnesses (11:1–14). The same thing happens between the sixth and seventh seals (chapter 7).`]],
 views:{P:`Events of the Jewish war of AD 66–70.`,H:`The barbarian invasions of the Roman Empire (trumpets 1–4), the rise of Islam (5), and the Ottoman Turks (6). Some 19th-century writers calculated the Ottoman fall for August 11, 1840.`,F:`Literal judgments in the second part of the tribulation.`,I:`God's warnings throughout history, modeled on the plagues of Egypt.`},
 links:[['Seven trumpets','Seven trumpets'],['Shofar','Shofar'],['Plagues of Egypt','Plagues of Egypt']],
 sources:['beale','bauckham','gregg']});

TP({id:'bowls', kind:'Symbols', title:'The Seven Bowls', ch:[15,16],
 lead:`Seven gold bowls "filled with the anger of God" (15:7), poured out in chapter 16. They repeat the trumpets, but complete: where the trumpets hit a third, the bowls hit everything.`,
 sections:[
  {h:'Trumpets and bowls side by side', table:[['#','Trumpet (8–11)','Bowl (16)'],['1','Earth: hail and fire; a third of trees burned','Earth: painful sores on the beast’s worshipers'],['2','Sea: a third becomes blood','Sea: all becomes blood; everything in it dies'],['3','Rivers: a third made bitter','Rivers and springs become blood'],['4','Sun: a third darkened','Sun: scorches people with fire'],['5','Abyss: locusts torment people','The beast’s throne: his kingdom darkened'],['6','Euphrates: an army released','Euphrates: dried up for the kings of the east; Armageddon'],['7','Loud voices: "The kingdom... has become our Lord’s"','Air: "It is done!" Earthquake, hail, Babylon split']],
   note:'The two series follow the same order, and both echo the plagues of Egypt. Many scholars think they describe the same judgments from two angles, with growing intensity, not two different events.'},
  ['The same bowls',`The gold bowls first appear in 5:8, "full of incense, which are the prayers of God's people." The bowls of wrath are handed out from the heavenly temple. Many readers connect them: the prayers of the martyrs, "How long, Sovereign Lord, until you judge?" (6:10), are answered in the bowls. The third bowl's angel says, "They poured out the blood of your holy people... and you have given them blood to drink" (16:6).`],
  ['No repentance',`Three times the people "cursed the name of God" and "did not repent" (16:9, 11, 21). The bowls show that judgment alone does not change hearts.`],
  ['Blessed sayings in the middle',`Right in the middle of the sixth bowl comes a blessing: "Look, I am coming like a thief! Blessed is the one who stays awake" (16:15). Even here, the book speaks to its readers, not just about the world.`]],
 views:{P:`The final judgments on Jerusalem in AD 70 (or on Rome).`,H:`The judgments on the papacy and its supporters from the French Revolution onward.`,F:`The last and most severe judgments at the very end of the tribulation.`,I:`The final, complete judgment of God on a world that refuses him, pictured with Exodus plagues.`},
 links:[['Seven bowls','Seven bowls'],['Plagues of Egypt','Plagues of Egypt']],
 sources:['beale','bauckham']});

TP({id:'seal-of-god', kind:'Symbols', title:'The Seal of God', ch:[7,9,14,22],
 lead:`God's servants are sealed on their foreheads before the winds of judgment blow (7:3). Later they have the Lamb's name and his Father's name written there (14:1; 22:4). The beast's mark (13:16) is a copy of it.`,
 sections:[
  ['What a seal meant',`In the ancient world, a seal pressed into wax or clay showed ownership, protected a document from tampering, and marked it as genuine. Slaves and soldiers were sometimes tattooed or branded with their owner's or general's mark. A seal on the forehead says, "This person belongs to God, and is under his protection."`],
  ['Ezekiel’s mark',`Ezekiel saw a man with a writing kit put a mark on the foreheads of those who grieved over Jerusalem's sins; the executioners were told to spare them (Ezekiel 9:4–6). The mark was the Hebrew letter <i>tav</i>, which in the old script was written like an X or a cross. Early Christians noticed.`],
  ['Passover',`The blood on Israel's doorposts was a sign so that "the destroyer" would pass over (Exodus 12:13, 23). The sealed in Revelation are likewise protected from the plagues (9:4).`],
  ['Protection from what?',`The locusts cannot harm those with the seal (9:4). But sealed people still die as martyrs (6:9–11; 13:7). The seal protects from God's wrath and from losing faith, not from the world's hatred.`],
  ['The seal in the early church',`Paul says believers have been "sealed with the promised Holy Spirit" (Ephesians 1:13; 4:30; 2 Corinthians 1:22). By the second century, Christians called baptism "the seal" (2 Clement 7:6; Shepherd of Hermas, <i>Similitudes</i> 9.16).`],
  {fact:`A striking parallel: according to 3 Maccabees 2:29, the Egyptian king Ptolemy IV ordered Jews to be branded with the ivy leaf of Dionysus, the sign of his god, before they could enjoy civic rights. Being marked for a god in order to take part in public life was not an unknown idea.`}],
 views:{P:`The Christians in Judea marked for escape before AD 70.`,H:`The true church, sealed by the Spirit through the ages.`,F:`A real, perhaps visible mark on the 144,000 during the tribulation.`,I:`The Holy Spirit's presence in every believer, marking them as God's own.`},
 links:[['Seal of God','Seal of God'],['Taw','Taw'],['Sealing (Christianity)','Sealing (Christianity)']],
 sources:['beale','bauckham']});

TP({id:'tree-of-life', kind:'Symbols', title:'The Tree of Life', ch:[2,22],
 lead:`Promised to Ephesus (2:7) and standing on both banks of the river in the city (22:2), "producing twelve kinds of fruit," with leaves "for healing the nations." It is the Bible's last picture of Eden.`,
 sections:[
  ['From Eden',`God placed the tree of life in the middle of the garden (Genesis 2:9). After Adam and Eve sinned, God guarded "the way to the tree of life" with cherubim and a flaming sword (Genesis 3:22–24). Ezekiel saw a river from the temple lined with trees bearing fruit every month, whose leaves heal (Ezekiel 47:12). Revelation brings both together.`],
  ['In Jewish writings',`Proverbs calls wisdom "a tree of life to those who take hold of her" (Proverbs 3:18). In 1 Enoch 24–25, a fragrant tree near God's throne will be given to the righteous after the judgment. The Testament of Levi says the Messiah "will open the gates of paradise" and give the saints to eat from the tree of life (18:10–11).`],
  ['The cross as a tree',`Revelation's word for tree is <i>xylon</i>, which also means "wood." The apostles use the same word for the cross: "whom they killed by hanging him on a tree" (Acts 5:30; 1 Peter 2:24). Early Christian writers and artists loved this connection: the cross is the tree of life.`],
  ['KJV 22:19',`The KJV says "book of life," but the Greek manuscripts say "tree of life." Erasmus had no Greek manuscript of the last verses and translated them back from Latin, where a copying error had changed "tree" (<i>ligno</i>) to "book" (<i>libro</i>).`],
  {myth:{culture:'Ancient Near East', title:'Sacred trees', body:`Assyrian palace carvings show winged spirits tending a stylized "sacred tree," and many cultures told of a world tree or a tree of immortality (the Norse Yggdrasil; the plant of youth in the Epic of Gilgamesh, stolen by a snake). The Ephesian sanctuary of Artemis was also said to have begun at a sacred tree. Genesis and Revelation share the hope of a tree that gives life, but tie it to the one God.`, link:['Tree of life','Tree of life'], link2:'shared hope, different meaning'}}],
 claude:{title:'Eden’s guard becomes twelve angels at open gates',body:`After the fall, God placed cherubim at Eden "to guard the way to the tree of life" (Genesis 3:24). In the new Jerusalem there are angels at the gates again, twelve of them (21:12), but the gates are never shut (21:25), and 22:14 blesses those who "go through the gates" to the tree of life. My speculation: the angels at the gates are Eden's guard turned around, standing beside open doors instead of blocking the way.`, refs:'Genesis 3:24; 21:12; 21:25; 22:14'},
 views:{P:`The life of the new covenant, available now through Christ.`,H:`Eternal life given to the faithful at the end of history.`,F:`A literal tree in the new Jerusalem, perhaps more than one along the river.`,I:`Eternal life and healing, restored to humanity in Christ.`},
 links:[['Tree of life (biblical)','Tree of life (biblical)'],['Garden of Eden','Garden of Eden']],
 sources:['beale','koester']});

TP({id:'ark', kind:'Symbols', title:'The Ark of the Covenant', ch:[11],
 lead:`"God's temple in heaven was opened, and the ark of his covenant could be seen in his temple" (11:19). The most famous lost object in history appears for one verse.`,
 facts:[['Size','About 45 × 27 × 27 inches (2½ × 1½ × 1½ cubits)'],['Made of','Acacia wood covered with gold, with two gold cherubim on the lid'],['Contents','The stone tablets, a jar of manna, Aaron’s staff (Hebrews 9:4)'],['Last seen','Before Babylon destroyed the temple, 586 BC']],
 sections:[
  ['What happened to it?',`The Bible never says. Theories include: Pharaoh Shishak took it (1 Kings 14:25–26); Babylon took or destroyed it in 586 BC; Jeremiah hid it in a cave on Mount Nebo until God gathers his people (2 Maccabees 2:4–8); an angel hid it in the earth until the end (2 Baruch 6:7–10); or it was taken to Ethiopia, where the Ethiopian Orthodox Church says it is kept at Aksum. Jeremiah himself said a day would come when "they will no longer say, ‘The ark of the covenant of the LORD’... it will not be missed" (Jeremiah 3:16).`],
  ['Meaning in Revelation',`The ark was the throne of God's presence and the place of atonement. After the seventh trumpet, the hidden presence of God is opened to view, with lightning, thunder and earthquake as at Sinai. Its appearance says God has not forgotten his covenant.`],
  ['The hidden manna',`Jewish tradition said the jar of manna was hidden with the ark and would come back in the days of the Messiah (2 Baruch 29:8). Jesus's promise of "hidden manna" to Pergamum (2:17) probably draws on that hope.`],
  ['The woman of chapter 12',`The ark appears in 11:19 and the woman "clothed with the sun" in 12:1, with no break in the original. Some Catholic and Orthodox readers link the two and call Mary the "ark of the new covenant," since she carried the Word in her womb (compare Luke 1:35, 39–56 with 2 Samuel 6:2–16). Most Protestant readers see the woman as God's people.`]],
 views:{P:`God's covenant faithfulness revealed as the old temple order ends.`,H:`The restoration of true worship in history.`,F:`Some expect the physical ark to be found and used in a rebuilt temple; others read the heavenly original.`,I:`God's presence and covenant, now open to all.`},
 links:[['Ark of the Covenant','Ark of the Covenant'],['Church of Our Lady Mary of Zion','Church of Our Lady Mary of Zion']],
 sources:['koester','beale']});

TP({id:'little-scroll', kind:'Symbols', title:'The Little Scroll', ch:[10],
 lead:`A mighty angel holds a small open scroll. John is told to take it and eat it: sweet as honey in his mouth, sour in his stomach (10:9–10). Then: "You must prophesy again" (10:11).`,
 sections:[
  ['Background',`Ezekiel was handed a scroll "written on the front and back," told to eat it, and found it "as sweet as honey" before he was sent to a rebellious people (Ezekiel 2:8–3:3). Jeremiah said, "When your words came, I ate them; they were my joy" (Jeremiah 15:16). Eating the scroll means taking God's message completely inside.`],
  ['Sweet and sour',`The word of God is sweet to receive, and bitter to carry, because it contains judgment and suffering, for the world and for the messenger. Chapter 11, which follows immediately, is the story of witnesses who prophesy and are killed.`],
  ['Little scroll or the same scroll?',`John uses a diminutive word, <i>biblaridion</i>, "little scroll." Many think it holds chapter 11 or chapters 11–22. Richard Bauckham argues that it is the same as the sealed scroll of chapter 5, now opened, and that its message is the story of the witnessing church that follows. It is "little" only next to the giant angel.`],
  ['The angel’s oath',`The angel stands on sea and land and swears by the Creator that "there will be no more delay" (10:6), echoing the angel in Daniel 12:7 who swore it would be "a time, times, and half a time."`]],
 views:{P:`A message about the fate of Jerusalem, sweet in promise and bitter in judgment.`,H:`The Bible rediscovered at the Reformation, sweet to the Reformers but bitter in persecution.`,F:`A further revelation of tribulation events from chapter 11 on.`,I:`The calling of every prophet and preacher: to take God's word in fully and speak it at a cost.`},
 links:[['Revelation 10','Revelation 10']],
 sources:['climax','beale']});

TP({id:'seven-thunders', kind:'Symbols', title:'The Seven Thunders', ch:[10],
 lead:`"Seal up what the seven thunders said. Do not write it down" (10:4). It is the only sealed message in a book whose last instruction is "Do not seal up the words" (22:10).`,
 sections:[
  ['Thunder as God’s voice',`Psalm 29 calls God's voice thunder seven times: "The voice of the LORD is over the waters; the God of glory thunders." When God spoke to Jesus, the crowd "said it had thundered" (John 12:28–29). The seven thunders are a full message from God.`],
  {h:'Thunder in Revelation', table:[['Verse','When it sounds'],['4:5','From the throne, with lightning'],['6:1','The first living creature calls "Come!" with a voice like thunder'],['8:5','Fire from the altar thrown to earth: thunder, lightning, earthquake'],['10:3–4','The seven thunders answer the angel’s roar'],['11:19','The temple opens at the seventh trumpet: thunder, lightning, earthquake, hail'],['14:2','A voice from heaven like thunder, and like harpists playing'],['16:18','The seventh bowl: thunder, lightning, the greatest earthquake'],['19:6','The final "Hallelujah" sounds like mighty thunder']],
   note:'Thunder marks God speaking and each seventh judgment, growing louder each time (8:5; 11:19; 16:18). The only thunder John may not write down is the one in chapter 10.'},
  ['Why seal it?',`Several readings: (1) It was a further cycle of judgments that God canceled, choosing "no more delay" and the call to witness instead (Richard Bauckham). (2) It is a reminder that not everything is revealed: "The secret things belong to the LORD our God" (Deuteronomy 29:29). Paul too heard "things that cannot be told" (2 Corinthians 12:4). (3) It was meant for John alone.`],
  ['People who claimed to know',`Through the centuries some have claimed to reveal what the thunders said. In the 1960s the American evangelist William Branham taught that their meaning was being revealed in his ministry. Most churches have warned that the text itself tells us not to fill this gap.`]],
 views:{P:`Judgments on Jerusalem that God chose not to reveal.`,H:`Sometimes linked to the "thunders" of the Reformation against Rome.`,F:`Real future judgments that will happen but are not described.`,I:`A lesson in humility: God's plan is bigger than anything written down.`},
 links:[['Seven thunders','Seven thunders'],['Psalm 29','Psalm 29']],
 sources:['climax','beale']});

TP({id:'gems', kind:'Symbols', title:'The Twelve Jewels', ch:[21],
 lead:`The twelve foundations of the city wall are decorated with twelve precious stones (21:19–20). Ancient stone names do not always match modern ones, so the identifications below are the most likely, not certain.`,
 sections:[
  {h:'The foundation stones', table:[['#','Greek','Probably','Color'],['1','<i>iaspis</i>','Jasper, or a clear crystal','Clear or green; God’s own color (4:3; 21:11)'],['2','<i>sappheiros</i>','Lapis lazuli','Deep blue with gold flecks'],['3','<i>chalkēdōn</i>','Chalcedony, a kind of agate','Greenish or milky blue'],['4','<i>smaragdos</i>','Emerald','Green'],['5','<i>sardonyx</i>','Sardonyx','Red and white bands'],['6','<i>sardion</i>','Carnelian','Red'],['7','<i>chrysolithos</i>','Gold-colored stone (topaz or yellow jasper)','Yellow'],['8','<i>bēryllos</i>','Beryl','Sea green'],['9','<i>topazion</i>','Peridot','Yellow-green'],['10','<i>chrysoprasos</i>','Chrysoprase','Apple green'],['11','<i>hyakinthos</i>','Sapphire or jacinth','Blue'],['12','<i>amethystos</i>','Amethyst','Purple']],
   note:'Ancient "sapphire" was usually lapis lazuli, and ancient "topaz" was usually peridot, from an island in the Red Sea.'},
  ['The high priest’s breastplate',`Exodus 28:17–21 lists twelve stones set in four rows on the high priest's breastplate, each engraved with the name of a tribe. Eight of Revelation's twelve match the Greek Old Testament's list. In the new Jerusalem, the names of the tribes are on the gates and the names of the apostles on the jeweled foundations (21:12–14): the whole city is dressed like a high priest.`],
  ['Isaiah and Tobit',`"I will build your foundations with lapis lazuli. I will make your battlements of rubies, your gates of sparkling jewels" (Isaiah 54:11–12). Tobit 13:16–17 pictures Jerusalem's walls of precious stones. Babylon wears jewels as decoration (17:4); the city of God is built of them.`],
  ['The zodiac?',`The first-century writers Philo and Josephus linked the breastplate's twelve stones with the twelve signs of the zodiac. R. H. Charles noticed that Revelation's order is close to a traditional order of zodiac stones reversed, as if the city undoes the claims of astrology. Others doubt the pattern, since the ancient lists vary.`]],
 views:{P:`A symbol of the glory of the church in the new covenant.`,H:`The church's final glory.`,F:`Literal jeweled foundations in a real city.`,I:`The beauty and value of God's people, the true priesthood.`},
 links:[['Priestly breastplate','Priestly breastplate'],['Lapis lazuli','Lapis lazuli']],
 sources:['aune','koester']});

TP({id:'wormwood', kind:'Symbols', title:'Wormwood', ch:[8],
 lead:`At the third trumpet "a great star, blazing like a torch, fell from the sky" on the rivers and springs. "The name of the star is Wormwood." A third of the waters became bitter, and many people died (8:10–11).`,
 sections:[
  ['The plant',`Wormwood (<i>Artemisia absinthium</i>) is a bitter herb, used in ancient medicine against intestinal worms (hence its name) and later to flavor absinthe. It is named after the goddess Artemis, the great goddess of Ephesus. It is bitter but not usually deadly.`],
  ['In the prophets',`Wormwood is the Old Testament's taste of judgment and of sin. "I will feed this people wormwood and give them poisoned water to drink" (Jeremiah 9:15; 23:15). "You who turn justice into wormwood" (Amos 5:7). Moses warned against "a root that produces poison and wormwood," a person who turns away to other gods (Deuteronomy 29:18). Lamentations 3:15, 19 uses it for the bitterness of exile.`],
  ['A falling star',`Stars falling from the sky are signs of judgment (Isaiah 34:4; Mark 13:25), and in Revelation stars can be angels or rulers (1:20; 9:1). Isaiah calls the fallen king of Babylon "morning star, son of the dawn" (Isaiah 14:12).`],
  ['Chernobyl',`The Ukrainian word <i>chornobyl</i> names mugwort (<i>Artemisia vulgaris</i>), a close relative of wormwood. After the 1986 nuclear disaster, which poisoned the water and land of a huge area, many people connected the two, and some Ukrainian Orthodox writers spoke of it. Most commentators treat the link as a striking coincidence, not a fulfillment.`]],
 views:{P:`Bitter judgment on Jerusalem or the land of Israel during the war of AD 66–70.`,H:`A ruler who devastated the Roman world; many 19th-century historicists named Attila the Hun.`,F:`A literal comet or meteor that poisons the water supply.`,I:`The bitterness that sin and false teaching bring into the world.`},
 links:[['Wormwood (Bible)','Wormwood (Bible)'],['Artemisia absinthium','Artemisia absinthium'],['Chernobyl disaster','Chernobyl disaster']],
 sources:['koester','beale']});

TP({id:'sea-of-glass', kind:'Symbols', title:'The Sea of Glass', ch:[4,15],
 lead:`"Something like a sea of glass, clear as crystal" before the throne (4:6). Later it is "mixed with fire," and those who won the victory over the beast stand beside it with harps and sing the song of Moses (15:2–3).`,
 sections:[
  ['Background',`Under God's feet at Sinai was "something like a pavement made of lapis lazuli, as clear as the sky itself" (Exodus 24:10). Over the living creatures in Ezekiel's vision was "an expanse, sparkling like ice" (Ezekiel 1:22). In 1 Enoch 14:9–10, the heavenly house is built of crystal with a floor of crystal. Solomon's temple had a great bronze basin called "the Sea" (1 Kings 7:23).`],
  ['The Red Sea',`In chapter 15, the victors stand beside a sea "mixed with fire" and sing "the song of God's servant Moses and the song of the Lamb" (15:3). The picture is Israel on the far shore of the Red Sea, singing after Pharaoh's army drowned (Exodus 15). The sea that once threatened God's people has become the floor they stand on.`],
  ['Glass in John’s world',`Glassblowing was invented in Syria and Palestine in the first century BC, and by John's day glass was common across the empire. Clear, colorless glass was harder to make and prized. "Glass clear as crystal" was a picture of perfect purity.`],
  {myth:{culture:'Jewish and Islamic tradition', title:'Floors that look like water', body:`The Talmud tells of four rabbis who entered the "garden" of heavenly vision. Rabbi Akiva warned them, "When you reach the stones of pure marble, do not say, ‘Water, water’" (Hagigah 14b). The Qur'an tells how the Queen of Sheba, entering Solomon's palace, thought its floor was a pool of water and lifted her skirts, but it was "a palace paved smooth with glass" (Qur'an 27:44). In all three traditions, a sea of glass is the threshold of a holy king's presence.`, link:['Hekhalot literature','Hekhalot literature'], link2:'shared picture'}}],
 views:{P:`God's throne room as the backdrop to his judgments on the first-century world.`,H:`The calm of God's rule over the troubled nations of history.`,F:`A literal feature of heaven, where tribulation martyrs will stand.`,I:`God's transcendence and holiness, and the victory of his people over chaos.`},
 links:[['Sea of glass','Sea of glass'],['Song of the Sea','Song of the Sea']],
 sources:['beale','koester']});

TP({id:'harvest', kind:'Symbols', title:'The Two Harvests', ch:[14],
 lead:`A grain harvest by "one like a son of man" with a sharp sickle (14:14–16), and a grape harvest thrown into "the great winepress of God's anger" (14:17–20), whose blood flows 1,600 stadia.`,
 sections:[
  ['Two harvests or one?',`Many readers see the grain harvest as the gathering of God's people, since Jesus used harvest for gathering believers (Matthew 13:30; Mark 4:29; John 4:35), and the reaper is "one like a son of man" (1:13). The grape harvest, cut by an angel from the altar, is judgment. Others read both as judgment, following Joel 3:13, which has both pictures in one verse: "Swing the sickle, for the harvest is ripe. Come, trample the grapes, for the winepress is full."`],
  ['The winepress',`Grapes were trampled by foot in a stone basin, and the juice ran out through a channel. Treading grapes was a common picture for judgment: "I have trodden the winepress alone... their blood spattered my garments" (Isaiah 63:1–6). Revelation 19:13–15 picks this up for the returning Christ.`],
  ['"Outside the city"',`The winepress was trodden "outside the city" (14:20). Hebrews says Jesus "suffered outside the city gate" (Hebrews 13:12). Some readers see a hint that the judgment falls where Jesus already suffered.`],
  ['1,600 stadia',`About 184 miles. 1,600 is 4 × 4 × 100, or 40 × 40, suggesting the whole world. Jerome noted that the land of Israel was about 160 Roman miles long, close to the same figure. "As high as horses' bridles" is a picture of overwhelming slaughter found also in 1 Enoch 100:3.`],
  ['"The grapes of wrath"',`Julia Ward Howe's "Battle Hymn of the Republic" (1861) begins, "He is trampling out the vintage where the grapes of wrath are stored," drawing on this chapter and Isaiah 63. John Steinbeck took the title of his 1939 novel from it.`]],
 views:{P:`The judgment of Jerusalem in AD 70, and the gathering of the church.`,H:`Great judgments in history, such as the Reformation and the wars of religion.`,F:`The final harvest at Christ's return: gathering of believers and judgment at Armageddon.`,I:`The end of history: the gathering of God's people and the judgment of evil.`},
 links:[['Grapes of wrath','Grapes of wrath'],['Battle Hymn of the Republic','Battle Hymn of the Republic']],
 sources:['bauckham','beale']});

/* ---------- topic pages: words and texts ---------- */
TP({id:'daniel', kind:'Words', title:'Revelation and Daniel', ch:[1,10,11,12,13,17,20],
 lead:`Revelation borrows from Daniel more than from almost any other book, and it presents itself as Daniel's sealed vision now opened. Daniel 7 in particular is behind chapters 1, 4–5, 13 and 17.`,
 sections:[
  {h:'The main borrowings', table:[['Daniel','Revelation','The picture'],['7:13','1:7, 13; 14:14','One like a son of man with the clouds'],['7:9','1:14','White hair like wool; throne like fire'],['7:3–7','13:1–2','Beasts from the sea: lion, bear, leopard, ten horns'],['7:8, 20','13:5','A mouth speaking proud words'],['7:10','20:12','Books opened at the judgment'],['7:24','17:12','Ten horns are ten kings'],['7:25; 12:7','12:14','"A time, times, and half a time"'],['7:21','13:7','War on the saints'],['7:22, 27','20:4','The saints receive the kingdom'],['10:5–6','1:13–15','A shining figure, eyes like fire, feet like bronze'],['12:1','12:7','Michael the great prince'],['12:4, 9','22:10','Sealed, then unsealed'],['12:7','10:5–6','An angel raises his hand and swears'],['2:28–29','1:1; 4:1','"What must happen"']]},
  ['Sealed and unsealed',`Daniel is told to "seal the book until the time of the end" (Daniel 12:4, 9). John is told the opposite: "Do not seal up the words of the prophecy of this book, because the time is near" (Revelation 22:10). Revelation presents itself as Daniel opened.`],
  ['How John changes Daniel',`Daniel sees four beasts; John sees one beast made of all four, in reverse order, as if Rome sums up every empire. Daniel's "son of man" comes to the Ancient of Days; in Revelation, the son of man has the Ancient of Days' white hair (1:14), so Jesus shares God's identity. Daniel's saints receive the kingdom; in Revelation they reign because the Lamb has made them a kingdom (1:6; 5:10).`],
  ['When was Daniel written?',`Traditionally, Daniel was written in the 500s BC by Daniel in Babylon. Many modern scholars date its visions to the 160s BC, during Antiochus IV's persecution. Either way, by John's time Daniel was read as a prophecy about the last empire and the coming kingdom, and Jewish writers such as 4 Ezra 12:11–12 openly reinterpreted Daniel's fourth beast as Rome.`]],
 links:[['Book of Daniel','Book of Daniel'],['Daniel 7','Daniel 7'],['Seventy weeks','Prophecy of Seventy Weeks']],
 sources:['beale','koester']});

TP({id:'alpha-omega', kind:'Words', title:'Alpha and Omega', ch:[1,21,22],
 lead:`The first and last letters of the Greek alphabet. God says "I am the Alpha and the Omega" (1:8; 21:6), and Jesus says the same of himself (22:13). It is a way of saying: before everything, after everything, and everything in between.`,
 sections:[
  {h:'Three titles, one meaning', table:[['Title','Spoken by','Verses'],['The Alpha and the Omega','God; then Jesus','1:8; 21:6; 22:13'],['The First and the Last','Jesus','1:17; 2:8; 22:13'],['The Beginning and the End','God; then Jesus','21:6; 22:13']],
   note:'By the last chapter, Jesus claims all three titles together (22:13).'},
  ['Background',`Isaiah 44:6: "I am the first and I am the last; apart from me there is no God" (also Isaiah 41:4; 48:12). Jewish teachers pointed out that the Hebrew word for truth, <i>emet</i>, uses the first, middle and last letters of the Hebrew alphabet, and called it "the seal of God."`],
  ['Why it matters',`Revelation gives God's own titles to Jesus, one of the New Testament's strongest statements that Jesus shares God's identity. The same God who "is, and who was, and who is to come" (1:8) is the Jesus who says "I am coming soon" (22:12–13).`],
  ['In Christian art',`From the 300s on, Christians painted and carved the letters A and Ω beside the cross or the Chi-Rho monogram, on tombs, coins and church walls. They are still used on Easter candles.`],
  {myth:{culture:'Greece', title:'"Zeus was, Zeus is, Zeus will be"', body:`The Greek traveler Pausanias records a chant of the priestesses at Dodona: "Zeus was, Zeus is, Zeus will be" (<i>Description of Greece</i> 10.12.10). Revelation's "who is, and who was, and who is to come" (1:4, 8) sounds similar, but notice the change: God is not "who will be" but "who is coming." He does not merely exist in the future; he arrives.`, link:['Dodona','Dodona'], link2:'a parallel John’s readers may have known'}},
  {fact:`A popular modern teaching says the untranslated Hebrew word <i>et</i> (aleph-tav, the first and last letters) in Genesis 1:1 is a hidden name of Jesus. Hebrew grammarians point out that <i>et</i> is an ordinary grammar marker used thousands of times. The real Alpha-and-Omega background is Isaiah.`}],
 links:[['Alpha and Omega','Alpha and Omega'],['Chi Rho','Chi Rho']],
 sources:['bauckham','aune']});

TP({id:'maranatha', kind:'Words', title:'"Come, Lord Jesus"', ch:[22],
 lead:`The book's last prayer, "Amen. Come, Lord Jesus!" (22:20), is the Greek form of an Aramaic prayer of the earliest church: <i>Marana tha</i>, "Our Lord, come!"`,
 sections:[
  ['The Aramaic',`The words can be divided two ways: <i>marana tha</i>, "Our Lord, come!" (a prayer), or <i>maran atha</i>, "Our Lord has come" (a confession). Revelation 22:20 and Didache 10:6 show that the church understood it as a prayer.`],
  ['The oldest Christian prayer?',`Paul leaves it untranslated in a letter to Greek-speaking Corinthians (1 Corinthians 16:22), so it must have come from the very first Aramaic-speaking believers in Jerusalem and been used in worship everywhere. That matters: Aramaic-speaking Jews, within a few years of the resurrection, were already praying to Jesus as "Lord" (<i>mar</i>).`],
  ['At the Lord’s Supper',`The Didache, a church manual from about John's time, ends its communion prayer: "Let grace come and let this world pass away. Hosanna to the God of David. If anyone is holy, let him come; if anyone is not, let him repent. Maranatha. Amen" (Didache 10:6). Revelation ends the same way: an invitation ("let anyone who is thirsty come," 22:17), a warning, and "Come, Lord Jesus."`],
  ['"Anathema Maranatha"',`The KJV prints 1 Corinthians 16:22 as "let him be Anathema Maranatha," and for centuries some readers took "Anathema Maranatha" as a single, extra-strong curse. In fact, "anathema" ends one sentence ("let him be cursed") and "Maranatha" is a separate prayer.`]],
 links:[['Maranatha','Maranatha'],['Didache','Didache']],
 sources:['aune','didache']});

TP({id:'hallelujah', kind:'Words', title:'Hallelujah', ch:[19],
 lead:`Hebrew for "Praise the LORD" (<i>hallelu</i>, "praise," and <i>Yah</i>, short for God's name). Revelation 19:1–6 has it four times, the only uses in the New Testament.`,
 sections:[
  {h:'The four hallelujahs', table:[['Verse','Who sings','Why'],['19:1','A great crowd in heaven','God has judged the great prostitute and avenged his servants'],['19:3','The crowd again','"The smoke from her goes up forever"'],['19:4','The 24 elders and four living creatures','"Amen. Hallelujah!" in worship at the throne'],['19:6','A huge crowd, like rushing waters and thunder','"The Lord our God the All-Powerful reigns," and the Lamb’s wedding has come']]},
  ['In the Psalms',`It opens and closes many psalms (Psalms 104–106, 111–113, 146–150). Psalms 113–118, called the Hallel, were sung at Passover; Jesus and his disciples sang them after the Last Supper (Mark 14:26).`],
  ['Praise at the fall of the wicked',`The rabbis noticed that the first "Hallelujah" in the book of Psalms comes at the end of Psalm 104, right after "May sinners vanish from the earth" (Psalm 104:35). The Talmud says David did not say Hallelujah until he saw the downfall of the wicked (Berakhot 9b–10a). Revelation's first Hallelujahs are also for the fall of Babylon. The praise is not gloating; it is relief that injustice is over.`],
  ['Jerusalem’s streets',`The book of Tobit, written before Revelation, imagines the new Jerusalem built of jewels and says "all her lanes will cry Hallelujah" (Tobit 13:17–18). Revelation's hallelujahs come right before the bride and the new city.`],
  ['In music',`Handel's "Hallelujah" chorus (1741) sets 19:6, 11:15 and 19:16: "For the Lord God omnipotent reigneth... King of Kings, and Lord of Lords."`]],
 links:[['Hallelujah','Hallelujah'],['Hallel','Hallel'],['Hallelujah (Handel)','Hallelujah (Handel)']],
 sources:['koester','aune']});

TP({id:'word-of-god', kind:'Words', title:'"The Word of God"', ch:[1,6,19,20],
 lead:`The rider on the white horse is named "the Word of God" (19:13), the same title the Gospel of John gives Jesus (John 1:1, 14). In Revelation, God's word is both the message believers die for and the weapon Christ wins with.`,
 sections:[
  ['A sword from the mouth',`Jesus's only weapon is a sword from his mouth (1:16; 2:16; 19:15, 21), from Isaiah 11:4, "With the breath of his lips he will slay the wicked," and Isaiah 49:2, "He made my mouth like a sharp sword." Hebrews says "the word of God is alive and active, sharper than any double-edged sword" (Hebrews 4:12). Revelation's final battle is won by speech.`],
  ['The warrior Word',`The closest parallel is in the Wisdom of Solomon, written before Revelation, describing the night of the Passover: "Your all-powerful word leaped from heaven, from the royal throne, into the midst of the land doomed to destruction, a stern warrior carrying the sharp sword of your authentic command" (Wisdom 18:15–16). Revelation 19 takes that picture and gives it a name.`],
  ['"The word of God and the testimony of Jesus"',`This pair runs through the book like a refrain: John writes it (1:2), is exiled for it (1:9), the martyrs die for it (6:9; 20:4), and the woman's children keep it (12:17). "Word of God" is what God has said; "testimony of Jesus" is the witness Jesus gave and his people continue.`],
  ['Words that come true',`"These words are trustworthy and true" (21:5; 22:6). The book ends by warning against adding to or taking away from its words (22:18–19), as Moses warned about the law (Deuteronomy 4:2).`]],
 views:{P:`Christ's word of judgment fulfilled against his enemies in the first century.`,H:`The power of the preached gospel through history.`,F:`Christ's literal return, when his spoken command destroys the armies at Armageddon.`,I:`The truth of God, which defeats every lie in every age.`},
 links:[['Logos (Christianity)','Logos (Christianity)'],['Book of Wisdom','Book of Wisdom']],
 sources:['bauckham','gorman']});

TP({id:'other-traditions', kind:'Words', title:'End-Times Stories from Other Traditions', ch:[6,12,13,19,20,21],
 lead:`Many cultures tell stories about how the world ends and begins again. Some shaped the imagery John used; others were written down much later; some look alike with no known connection. This page gathers them, marked by how likely a real link is.`,
 sections:[
  {h:'At a glance', table:[['Tradition','Story','Revelation parallel','Real link?'],['Babylon, Canaan','A god kills the sea dragon','12; 13; 20','Yes: the Old Testament already uses it'],['Greece','Python hunts pregnant Leto','12','Likely: told at Ephesus'],['Persia','Final savior; dragon chained, then freed','20','Possible, debated'],['Norse','Bound wolf; fire; new green world','20; 21','Unlikely: written down about 1200'],['Hindu','Kalki on a white horse','19:11','No known link'],['Islam','The Dajjal; Jesus returns; Gog and Magog','13; 19; 20','Later; shares biblical roots']]},
  ['The combat myth',`Across the ancient Near East a god defeats a sea dragon: Marduk splits Tiamat (<i>Enuma Elish</i>); Baal crushes Yam and Litan, "the mighty one with seven heads" (Ugarit, about 1300 BC). The Old Testament uses this picture for the true God (Psalm 74:13–14; Isaiah 27:1; 51:9). Revelation completes it.`],
  ['Leto and Python',`In the Greek story, the dragon Python hunts the pregnant Leto; she escapes and gives birth to Apollo, who later kills the dragon. Ephesus claimed Leto gave birth near the city (Tacitus, <i>Annals</i> 3.61). Many scholars think Revelation 12 deliberately retells it with Jesus as the true child.`],
  ['Persia',`Zoroastrian teaching expects a final savior (the Saoshyant), resurrection, a river of molten metal that purifies, and the world "made wonderful" (Frashokereti). The dragon Azi Dahaka is chained in a mountain until the end, breaks free, and is destroyed: almost the shape of Revelation 20. Dating the Persian texts is difficult, so scholars debate who influenced whom.`],
  ['Norse',`Fimbulwinter (war and hunger before the end), the wolf Fenrir bound until Ragnarök, fire, and a green world rising from the sea. These were written down by Christians around 1200, so borrowing may run either way.`],
  ['Hindu',`Kalki, the last avatar of Vishnu, rides a white horse with a blazing sword to end the dark age, a striking match to 19:11–15 with no known historical link.`],
  ['Islam',`The Dajjal (the false messiah, with "unbeliever" written on his forehead), the return of Jesus, and Gog and Magog bursting through a wall (Qur'an 18:94–99; 21:96), written down centuries after Revelation.`]],
 claude:{title:'Revelation answers the stories its readers knew',body:`A similar image does not mean John borrowed his faith. Often he takes the most famous story in his readers' world and turns it around: the dragon-slaying god is Jesus, not Apollo; the seven-headed monster is not a cosmic rival but a creature that gets captured; the "goddess Roma" on seven hills is a drunk prostitute. Revelation is as much counter-myth as myth.`, refs:'12:1–17; 13:1; 17:3–9'},
 links:[['Chaoskampf','Chaoskampf'],['Leto','Leto'],['Frashokereti','Frashokereti'],['Aži Dahāka','Aži Dahāka'],['Ragnarök','Ragnarök'],['Kalki','Kalki'],['Al-Masih ad-Dajjal','Al-Masih ad-Dajjal']],
 sources:['collins','aune']});

TP({id:'translations-guide', kind:'Words', title:'About the Translations', ch:[],
 lead:`The text page beside each chapter can show several translations. Only the one you pick is loaded. Here is what each one is and how they differ.`,
 sections:[
  {h:'The translations compared', table:[['Version','Year','Greek text','Style'],['Plain English','2026','SBLGNT','Meaning for meaning, 8th-grade level'],['KJV','1611 (1769 text)','Textus Receptus','Word for word, Elizabethan English'],['ASV','1901','Westcott-Hort and others','Strictly word for word'],['YLT','1898','Textus Receptus','Extremely literal; keeps Greek tenses'],['WEB','2000s','Majority Text','Modern word for word'],['Greek (SBLGNT)','2010','Critical text','The original language']]},
  ['Plain English',`A fresh rendering made for this site from the Greek (SBLGNT), aiming for about an 8th-grade reading level. It is the only version with notes and "today's words" woven into the text.`],
  ['KJV (King James Version)',`1611, from the Textus Receptus; this is the standard 1769 text. Words the translators added appear in italics, as in printed KJVs. Public domain in the US.`],
  ['WEB (World English Bible)',`A modern public-domain update of the ASV, from the Majority Text.`],
  ['ASV (American Standard Version)',`1901, an American edition of the Revised Version, a careful word-for-word translation. Public domain.`],
  ['YLT (Young’s Literal Translation)',`1898, Robert Young's very literal rendering, which keeps Greek word order and tenses. Public domain.`],
  ['Greek (SBLGNT)',`The SBL Greek New Testament, © 2010 Society of Biblical Literature and Logos Bible Software, used under its free license.`],
  ['Greek word by word',`Each Greek word with its basic meaning and dictionary form, from STEPBible's Translators Amalgamated Greek New Testament (Tyndale House, Cambridge), CC BY 4.0. Words that appear only in the Textus Receptus or Byzantine text (and so in the KJV) are shown faded.`],
  ['Why the Greek texts differ',`Revelation survives in fewer manuscripts than any other New Testament book, and the KJV's Greek rested on only one incomplete manuscript, with the last six verses translated back from Latin by Erasmus. See the page on how the text came down to us.`],
  ['NIV, ESV and others',`These are copyrighted and cannot be shown in full for a whole book, so each chapter and verse links to Bible Gateway, which opens in a new tab.`]],
 links:[['Bible translations into English','Bible translations into English'],['Textus Receptus','Textus Receptus']],
 sources:['metzger']});

TP({id:'three-angels', kind:'Symbols', title:'The Three Angels of Chapter 14', ch:[14],
 lead:`Three angels fly through the sky with three messages: the eternal good news, the fall of Babylon, and a warning against the beast's mark (14:6–11). Together they are the book's last call before the harvest.`,
 sections:[
  {h:'The three messages', table:[['Angel','Message','Echoes'],['First (14:6–7)','"Fear God and give him glory... worship the one who made heaven and earth"','The fourth commandment (Exodus 20:11); Psalm 96'],['Second (14:8)','"Fallen, fallen is Babylon the Great"','Isaiah 21:9; chapter 18'],['Third (14:9–11)','Anyone who worships the beast "will drink the wine of God’s anger"','Jeremiah 25:15; chapter 16']]},
  ['The "eternal gospel"',`This is the only time Revelation uses the noun "gospel" (<i>euangelion</i>). It is proclaimed "to every nation, tribe, language, and people" (14:6), and its content is a call to worship the Creator. "Fear God and give him glory" is the language of repentance: in 11:13, the survivors of the earthquake "were terrified and gave glory to the God of heaven." It is a last invitation, not only a threat.`],
  ['"The Eternal Gospel" in history',`In the 1200s, the followers of Joachim of Fiore taught that a new age of the Spirit was dawning, and one Franciscan published an "Introduction to the Eternal Gospel" (1254) claiming Joachim's writings would replace the New Testament. The church condemned it.`],
  ['The Adventist reading',`Seventh-day Adventists see their own movement in these three messages, read in a historicist way: the first angel's "the hour of his judgment has come" fulfilled in the Millerite preaching of the 1840s, the second in the call to leave fallen churches, and the third as a warning linked to the Sabbath commandment. Most other traditions read them as a summary of the choice the whole book puts before every reader.`]],
 views:{P:`The gospel preached to the Roman world before Jerusalem's or Rome's fall.`,H:`Specific movements in church history, such as the Reformation or the Adventist movement.`,F:`Literal angels preaching worldwide during the tribulation.`,I:`The church's message in every age: worship God, Babylon will fall, do not take the beast's mark.`},
 links:[['Three Angels’ Messages','Three Angels’ Messages'],['Joachim of Fiore','Joachim of Fiore']],
 sources:['koester','beale']});

/* ---------- notes woven into the Plain English text ----------
   N(verse, anchor phrase, type, {t:title, p:preview, b:body, r:refs, l:[[label, wikiTitle]], s:[SRC keys], w:WORDS key, top:topic id})
   With w, the title, Greek and body come from the translation-watch entry of that name. */
const NOTE_TYPES = {
  word:   {label:'Translation & Greek',  color:'#b46f26'},
  history:{label:'History & culture',    color:'#7a5230'},
  echo:   {label:'Scripture connection', color:'#2f7a55'},
  symbol: {label:'Symbol',               color:'#983220'},
  views:  {label:'Interpretations',      color:'#4d5d73'},
  israel: {label:'Church & Israel',      color:'#6b7a1f'},
  myth:   {label:'Other traditions',     color:'#a3466b'},
  spec:   {label:'Claude’s theory', color:'#234d8a'}
};
const NOTES = [];
const N = (v, a, type, o) => NOTES.push(Object.assign({v, a, type}, o));

/* ---- chapter 1 ---- */
N('1:1','unveiling','word',{w:'title', p:'Apokalypsis means pulling the cover off. One unveiling, singular, and it is of Jesus.', top:'apocalyptic'});
N('1:1','soon','word',{w:'soon', p:'"Soon" or "quickly"? Every view has to explain this word.', top:'soon'});
N('1:1','through signs','word',{w:'signs', p:'"Signified": the book tells you on line one that it speaks in pictures.'});
N('1:3','reads this prophecy out loud','history',{t:'A book meant to be heard', p:'One person read it aloud to the whole church. Most listeners could not read.', b:`Ancient letters were read aloud in the assembly (Colossians 4:16; 1 Thessalonians 5:27). The blessing is for "the one who reads" (singular) and "those who hear" (plural). Revelation's repeated patterns of sevens, threes and echoes help a listening audience follow it. It is the first of seven "blessed" sayings in the book.`, r:'Colossians 4:16; 1 Thessalonians 5:27; 14:13; 16:15; 19:9; 20:6; 22:7; 22:14', top:'sevens', s:['koester']});
N('1:4','who is, who was, and who is coming','echo',{t:'God’s name, stretched across time', p:'A Greek expansion of "I AM WHO I AM" from Exodus 3:14.', b:`John breaks Greek grammar here: after "from" he writes the name in the nominative case, as if the name cannot be changed. The phrase unfolds Exodus 3:14 ("I AM"), which Jewish interpreters already read as "the one who was, is, and will be." Notice that John says "is coming," not "will be." God's future is an arrival.`, r:'Exodus 3:14; 4:8; 11:17; 16:5', s:['bauckham','aune']});
N('1:4','seven Spirits','symbol',{t:'The seven Spirits', p:'Probably the Holy Spirit in full, with seven as completeness.', b:`The greeting comes from the Father, the seven Spirits, and Jesus Christ, which looks like an early picture of the Trinity. The seven Spirits are later called seven torches (4:5) and the Lamb's seven eyes (5:6), from Zechariah 4:2, 10. Some read them as seven chief angels instead (compare 8:2). Isaiah 11:2 lists the Spirit's gifts (seven in the Greek Old Testament).`, r:'4:5; 5:6; Zechariah 4:2–10; Isaiah 11:2', top:'sevens', s:['bauckham']});
N('1:5','the ruler of the kings of the earth','echo',{t:'Psalm 89', p:'Three titles of Jesus from one psalm about David’s king.', b:`"Faithful witness," "firstborn," and "highest of the kings of the earth" all come from Psalm 89:27, 37. In a world where Caesar claimed to rule the kings of the earth, the opening greeting names a different ruler.`, r:'Psalm 89:27; Psalm 89:37', top:'imperial-cult'});
N('1:6','a kingdom and priests','israel',{t:'Israel’s calling, now given to the church', p:'"A kingdom of priests" was God’s word to Israel at Mount Sinai.', b:`Exodus 19:6 calls Israel "a kingdom of priests and a holy nation." Revelation applies the phrase to everyone Jesus freed by his blood, "from every tribe and language" (5:9–10). Some see the church taking up Israel's role; others see Gentiles joining Israel's calling, not replacing it (Romans 11:17). Peter does the same with this verse (1 Peter 2:9).`, r:'Exodus 19:6; 5:10; 20:6; 1 Peter 2:9; Romans 11:17', top:'church-israel'});
N('1:7','He is coming with the clouds','views',{t:'Which coming?', p:'A worldwide return, or Christ’s judgment on Jerusalem in AD 70?', b:`The verse joins Daniel 7:13 (the son of man coming on clouds) with Zechariah 12:10 (they will look on the one they pierced). Futurists read the visible return of Christ to the whole world. Preterists note that in the Old Testament God "rides on a cloud" to judge a nation (Isaiah 19:1) and read the judgment of Jerusalem. Jesus used the same verses at his trial (Matthew 26:64).`, r:'Daniel 7:13; Zechariah 12:10; Isaiah 19:1; Matthew 24:30; Matthew 26:64', top:'second-coming', s:['gregg']});
N('1:7','All the tribes of the earth','word',{w:'land', p:'Gē means both "earth" and "land." Which one changes the whole verse.'});
N('1:8','the All-Powerful','word',{t:'Pantokratōr', greek:'παντοκράτωρ (pantokratōr)', p:'"Almighty": the Greek Old Testament’s word for "LORD of armies."', b:`<i>Pantokratōr</i> means "ruler of all." The Septuagint uses it for the Hebrew "LORD of hosts" (armies). Outside 2 Corinthians 6:18, it appears in the New Testament only in Revelation (nine times). Roman emperors were sometimes praised as rulers of the world. Revelation reserves the word for God.`, r:'2 Corinthians 6:18; 4:8; 11:17; 19:6', top:'throne'});
N('1:9','Patmos','history',{t:'The island of Patmos', p:'A rocky island off Asia Minor, used by Rome for exile.', b:`Patmos is about 13 square miles. Banishment to an island was a known Roman punishment. Early writers (Irenaeus, Eusebius) say John was sent there under Domitian. "The suffering... and the patient endurance" he shares with the readers are what the whole book asks of them.`, l:[['Patmos','Patmos']], top:'patmos', s:['koester']});
N('1:10',"the Lord's day",'word',{w:'lordsday', p:'Sunday, the day of the resurrection, not "the Day of the Lord."'});
N('1:13','someone like a son of man','echo',{t:'Daniel’s son of man', p:'From Daniel 7:13, Jesus’s favorite name for himself.', b:`In Daniel 7 "one like a son of man" comes with the clouds to the Ancient of Days and receives an everlasting kingdom. John then describes him with features Daniel gives to God himself (white hair, 7:9) and to the angel of Daniel 10:5–6 (gold belt, fiery eyes, bronze legs). The robe and sash are the clothes of a priest (Exodus 28:4).`, r:'Daniel 7:9–14; Daniel 10:5–6; Exodus 28:4; Mark 14:62', top:'son-of-man'});
N('1:14','white like wool','spec',{t:'The Ancient of Days walks among the lamps', p:'Jesus is given God’s own portrait, then put to work as the temple priest.', b:`Daniel 7:9 gives white wool hair to the Ancient of Days, God. John's figure also wears a priest's robe and walks among lampstands, the priest's daily job of trimming the temple lamps (Exodus 27:20–21; Leviticus 24:1–4). My reading: the vision says both "he is God" and "he tends the churches like a priest tends lamps," trimming, refilling, and, if needed, removing one (2:5). The priestly-lamp reading is held by several scholars (e.g. Beale); the link to the threat in 2:5 is my emphasis.`, r:'Daniel 7:9; Exodus 27:20–21; Leviticus 24:1–4; 2:5', s:['beale']});
N('1:16','A sharp two-edged sword came out of his mouth','symbol',{t:'A sword from the mouth', p:'His weapon is his word.', b:`Isaiah 49:2: "He made my mouth like a sharp sword." Isaiah 11:4: "with the breath of his lips he will slay the wicked." Hebrews 4:12: God's word is "sharper than any two-edged sword." Revelation's last battle is won by this sword alone (19:15, 21).`, r:'Isaiah 49:2; Isaiah 11:4; Hebrews 4:12; 19:15; 19:21', top:'word-of-god'});
N('1:17','the First and the Last','echo',{t:'God’s title, spoken by Jesus', p:'In Isaiah, "the first and the last" means "there is no other God."', b:`Isaiah 44:6: "I am the first and I am the last; apart from me there is no God." The Lord God calls himself "the Alpha and the Omega" in 1:8, and Jesus says "I am the First and the Last" here and in 22:13. Revelation gives Jesus the titles of God alone.`, r:'Isaiah 44:6; Isaiah 48:12; 1:8; 22:13', top:'alpha-omega', s:['bauckham']});
N('1:18','the keys of death and of Hades','myth',{t:'Keys of the underworld', p:'Greek religion gave these keys to Hecate or Aeacus. Jesus holds them.', b:`In Greek and Roman belief the keeper of the underworld's keys was a god such as Hecate or Aeacus, and Hades was the god of the dead. Jesus, who was dead, now holds the keys. It is a bold claim in a city like Ephesus, where Hecate was worshiped. Compare Jesus's words in Matthew 16:18–19.`, r:'Matthew 16:18–19; 20:13–14', l:[['Hecate','Hecate'],['Hades','Hades']], s:['aune']});
N('1:19','what is happening now, and what will happen after this','views',{t:'An outline of the book?', p:'Many futurists see three parts here: past, present, future.', b:`Futurists often read: "what you have seen" = chapter 1; "what is now" = chapters 2–3; "what will happen after this" = 4–22, still future. Others read it as two parts ("what you have seen, both what is and what is to come"), or as a phrase meaning "everything," since the visions mix past, present and future throughout.`, top:'structure', s:['gregg','beale']});
N('1:20','angels of the seven churches','word',{w:'angels', p:'Angelos means "messenger": an angel, or a human leader?', top:'angels'});

/* ---- chapter 2 ---- */
N('2:1','Ephesus','history',{t:'Ephesus', p:'The greatest city of Asia, home of the temple of Artemis.', b:`A port of perhaps 200,000 people. Paul worked there over two years (Acts 19) and warned its elders about false teachers (Acts 20:29–30). The letter praises them for testing false apostles. Tradition says John lived there late in life.`, l:[['Ephesus','Ephesus']], top:'ephesus', s:['hemer']});
N('2:4','you have left the love you had at first','views',{t:'What "first love"?', p:'Love for Jesus, love for each other, or both?', b:`The Greek just says "your first love." Readers debate whether it means love for Christ, love for fellow believers (which can grow cold in a church busy fighting error), or the early zeal of their conversion. The cure is to "do the things you did at first," which suggests actions, not only feelings.`, r:'Matthew 24:12; Jeremiah 2:2; 1 John 4:20'});
N('2:5','remove your lampstand','history',{t:'A moving city', p:'Ephesus’s harbor silted up. The city’s site has moved over the centuries.', b:`The river Cayster kept filling Ephesus's harbor with silt, and the city had to move more than once. Today the ruins stand miles from the sea. Ancient readers would also have known the temple lamps that a priest could take away. The threat is not loss of salvation for individuals but the end of a church's witness.`, top:'lampstands', s:['hemer']});
N('2:6','Nicolaitans','history',{t:'Who were the Nicolaitans?', p:'Probably Christians who said joining in idol feasts was fine.', b:`Irenaeus (about AD 180) linked them to Nicolaus, one of the seven deacons (Acts 6:5), though that may be guesswork. The letters connect them with "the teaching of Balaam" (2:14–15). <i>Nikolaos</i> means "conquers the people," and <i>Balaam</i> was explained in Hebrew as "swallows the people," so the two names may be a pair.`, r:'Acts 6:5; 2:14–15', top:'balaam', s:['aune','hemer']});
N('2:7','the tree of life','echo',{t:'Back to Eden', p:'The first promise of the book points to the last chapter.', b:`Genesis 3:22–24 closes the way to the tree of life. Revelation 22:2 shows it again, beside the river. The promises to the seven churches are all fulfilled in chapters 19–22. At Ephesus, where Artemis's temple stood in a sacred grove, the "paradise of God" is a pointed contrast.`, r:'Genesis 2:9; Genesis 3:22–24; 22:2; 22:14', top:'tree-of-life'});
N('2:9','synagogue of Satan','israel',{t:'"Those who say they are Jews and are not"', p:'A painful phrase. It was a local conflict, not a verdict on the Jewish people.', b:`Smyrna's Christians, many of them Jewish, were being denounced by members of the local synagogue, possibly to the Roman authorities (Jews were exempt from emperor worship, and Christians lost that cover when expelled). John, himself a Jew, says those slanderers are not living up to the name. Sadly, the phrase was later used to justify hatred of Jews, which the text does not support. Paul uses a similar idea in Romans 2:28–29.`, r:'Romans 2:28–29; 3:9; John 16:2', top:'synagogue-of-satan', s:['koester','blount']});
N('2:10','ten days','symbol',{t:'Ten days of testing', p:'A short, limited trial, as in Daniel 1.', b:`Daniel and his friends were tested for ten days (Daniel 1:12–15). Ten days is a short, measured time with an end. Historicists have read it as ten years of Diocletian's persecution (303–313), or ten Roman persecutions.`, r:'Daniel 1:12–15'});
N('2:10','the crown of life','history',{t:'The crown of Smyrna', p:'Smyrna’s ring of hilltop buildings was called its "crown."', b:`Ancient writers described the buildings around Mount Pagos as Smyrna's crown. The word here is <i>stephanos</i>, a victor's wreath, not a king's diadem. Smyrna's bishop Polycarp was later burned there (about AD 155).`, l:[['Polycarp','Polycarp']], top:'smyrna', s:['hemer']});
N('2:13',"Satan's throne",'word',{w:'seat', p:'KJV "seat" is thronos, the word used for God’s throne.', top:'pergamum'});
N('2:14','Balaam','echo',{t:'Balaam and Balak', p:'The prophet who could not curse Israel, so he taught them to sin.', b:`In Numbers 22–24 Balaam is hired to curse Israel but can only bless them. Numbers 31:16 says his advice later led Israel to sin with Moabite women and idols at Peor (Numbers 25). Balaam became a byword for selling out God's people for gain (2 Peter 2:15; Jude 11).`, r:'Numbers 22:5–6; Numbers 25:1–3; Numbers 31:16; 2 Peter 2:15; Jude 11', top:'balaam'});
N('2:17','hidden manna','echo',{t:'Hidden manna', p:'A jar of manna was kept in the ark, which went missing.', b:`Exodus 16:33–34: a jar of manna was kept before the LORD. Jewish tradition said Jeremiah hid the ark (2 Maccabees 2:4–8) and that the Messiah would bring the manna back (2 Baruch 29:8). Those who refuse idol feasts will get heaven's food instead. Compare John 6:31–35.`, r:'Exodus 16:33–34; John 6:31–35; Hebrews 9:4', top:'ark'});
N('2:17','a white stone','history',{t:'A white stone', p:'Jurors voted "not guilty" with white stones. Stones were also feast tickets.', b:`Several customs fit: a white pebble for acquittal in court; inscribed tokens that admitted guests to banquets; amulets carrying a secret name. All suit Pergamum, a city of courts and feasts. Some also connect the high priest's stones engraved with names (Exodus 28:9–12).`, r:'Exodus 28:9–12', top:'pergamum', s:['hemer']});
N('2:20','Jezebel','echo',{t:'Jezebel', p:'A nickname from the queen who led Israel into Baal worship.', b:`Queen Jezebel promoted the worship of Baal (1 Kings 16:31; 21:25) and opposed Elijah. The woman at Thyatira probably was a real prophet in the church whom John calls by this name, the way we might call someone "a Judas." Her teaching seems to have allowed members to join guild feasts honoring the gods.`, r:'1 Kings 16:31; 1 Kings 21:25; 2 Kings 9:22', top:'jezebel'});
N('2:24','the deep things of Satan','spec',{t:'"The deep things": a slogan turned around', p:'They likely said "the deep things of God." Jesus corrects the label.', b:`Paul writes that the Spirit searches "the deep things of God" (1 Corinthians 2:10). Many scholars suggest the Thyatira group claimed secret, deeper knowledge, perhaps arguing that a mature Christian could enter an idol's temple unharmed. My reading: Jesus quotes their slogan and swaps one word, the way the letters elsewhere turn local boasts around ("you say you are rich," 3:17).`, r:'1 Corinthians 2:10; 1 Corinthians 8:1–10; 3:17', s:['aune','koester']});
N('2:27','iron rod','echo',{t:'Psalm 2', p:'The promise of Psalm 2, given to the faithful.', b:`Psalm 2:8–9: "I will give you the nations as your inheritance... You will break them with a rod of iron; you will dash them to pieces like pottery." In Revelation the same words describe Jesus (12:5; 19:15) and his people. The Greek <i>poimanei</i> literally means "shepherd," so some translate "shepherd them with an iron rod."`, r:'Psalm 2:8–9; 12:5; 19:15'});
N('2:28','the morning star','symbol',{t:'The morning star', p:'Venus, the bright herald of dawn. Jesus says he is the star (22:16).', b:`Roman generals claimed Venus as their patron, and Roman coins linked the emperor with stars. Numbers 24:17 promises "a star will come out of Jacob." In 22:16 Jesus calls himself "the bright Morning Star." The promise is not a prize but Jesus himself.`, r:'Numbers 24:17; 22:16; 2 Peter 1:19'});

/* ---- chapter 3 ---- */
N('3:1','You have a reputation for being alive, but you are dead','history',{t:'Sardis', p:'A city living on its past glory, twice captured because no one was watching.', b:`Sardis's citadel was thought impossible to capture. Yet it fell to Cyrus in 547 BC and to Antiochus III in 214 BC when soldiers climbed the cliffs at night and found the walls unguarded. "Wake up!" and "I will come like a thief" hit home.`, l:[['Sardis','Sardis']], top:'sardis', s:['hemer','ramsay']});
N('3:3','I will come like a thief','echo',{t:'Like a thief', p:'Jesus’s own picture for a coming no one expects.', b:`Jesus: "If the owner of the house had known at what time the thief was coming, he would have kept watch" (Matthew 24:43). Paul: "the day of the Lord will come like a thief in the night" (1 Thessalonians 5:2). Revelation repeats it at Armageddon (16:15). Here it may mean a coming in judgment on one church, not only the final return.`, r:'Matthew 24:43; 1 Thessalonians 5:2; 2 Peter 3:10; 16:15'});
N('3:5','book of life','symbol',{t:'Never erased', p:'Cities kept rolls of citizens. Names could be struck off.', b:`Greek cities kept registers of citizens, and a convicted person's name could be erased. Moses asks God to "blot me out of your book" (Exodus 32:32–33). Jesus promises the opposite: "I will never erase." The Greek uses a strong double negative.`, r:'Exodus 32:32–33; Psalm 69:28; Daniel 12:1; Luke 10:20', top:'book-of-life'});
N('3:7','the key of David','echo',{t:'The key of David', p:'From Isaiah 22, where a steward receives the palace keys.', b:`Isaiah 22:22: "I will place on his shoulder the key to the house of David; what he opens no one can shut, and what he shuts no one can open." Eliakim became the king's chief steward. Jesus holds that authority over who enters the kingdom, just as the "synagogue of Satan" was trying to shut the door on the believers.`, r:'Isaiah 22:20–22; Matthew 16:19; 1:18'});
N('3:9','who say they are Jews and are not','israel',{t:'"They will bow down at your feet"', p:'A reversal of Isaiah, where the nations bow to Israel.', b:`Isaiah 60:14 says the oppressors' children "will bow down at your feet," and Isaiah 49:23 says the same. Here the promise is turned around: the local synagogue opponents will acknowledge the (largely Gentile) church. Church-and-Israel views read this differently: as a temporary local conflict (most), as the church inheriting Israel's promises (replacement views), or as Gentiles grafted into Israel (Romans 11).`, r:'Isaiah 60:14; Isaiah 49:23; Isaiah 43:4; Romans 11:17–24', top:'church-israel'});
N('3:10','keep you from the hour of testing','views',{t:'Kept "from" or kept "through"?', p:'The key verse for a pre-tribulation rapture, and a famous debate.', b:`The Greek is <i>tērēsō ek</i>, "I will keep out of." Pre-tribulation readers say this means removal before the tribulation. Others note that John 17:15 uses the same words, "keep them from the evil one," where Jesus explicitly says he is not asking that they be taken out of the world. So it can mean protection within. Preterists read it as a promise to the Philadelphia church about a coming crisis in their own time.`, r:'John 17:15; 7:3; 9:4', top:'rapture', s:['gregg','walvoord','ladd']});
N('3:12','a pillar in the temple','history',{t:'Pillars in an earthquake city', p:'Philadelphia had been shaken by earthquakes. Pillars were often left standing.', b:`After the great earthquake of AD 17 Philadelphians feared aftershocks and many lived outside the walls. In ruined cities the pillars are often what stands. Leading citizens were honored with inscribed pillars in temples. Jesus promises a permanent place, with a new name written on it.`, top:'philadelphia', s:['hemer']});
N('3:14','the Amen','echo',{t:'"The Amen"', p:'From Isaiah 65:16, "the God of Amen."', b:`Isaiah 65:16 literally speaks of "the God of Amen," usually translated "the God of truth." The same passage promises "new heavens and a new earth" (65:17). "The ruler (or beginning) of God's creation" echoes Colossians 1:15–18, also written to the Lycus Valley.`, r:'Isaiah 65:16–17; Colossians 1:15–18; 2 Corinthians 1:20'});
N('3:16','lukewarm','word',{w:'lukewarm', p:'Not "better cold than lukewarm." Hot and cold water were both useful.', top:'laodicea'});
N('3:18','salve to put on your eyes','history',{t:'Laodicea’s gold, wool and eye salve', p:'Three things Laodicea was proud of: banks, black wool, and a medical school.', b:`Laodicea was a banking city that refused Roman aid after the earthquake of AD 60 (Tacitus, <i>Annals</i> 14.27). It was famous for glossy black wool and had a medical school associated with a "Phrygian powder" used for eyes. Jesus offers better gold, white clothes, and real sight.`, top:'laodicea', s:['hemer','ramsay']});
N('3:20','I am standing at the door and knocking','views',{t:'A door to the heart, or to the church?', p:'Spoken to a church, it is an invitation to a meal.', b:`This is often used to invite one person to faith, and that is a fair application. In context Jesus speaks to a whole church that has shut him out. The image echoes Song of Songs 5:2 ("my beloved is knocking"), and "eat with" points to the Lord's Supper and the wedding supper (19:9). Some futurists read it of the last church age.`, r:'Song of Songs 5:2; Luke 12:36–37; 19:9'});

/* ---- chapter 4 ---- */
N('4:1','a door standing open in heaven','views',{t:'"Come up here": the rapture?', p:'Some see the church raptured here. The words are spoken to John.', b:`Pre-tribulation readers note that the word "church" is not used again until 22:16 and see 4:1 as a picture of the church caught up before the tribulation. Others point out that the call is to John alone, who is "in the Spirit" (4:2), and that the same words are spoken to the two witnesses in 11:12.`, r:'11:12; 22:16; 1 Thessalonians 4:16–17', top:'rapture', s:['walvoord','gregg']});
N('4:3','A rainbow','echo',{t:'The rainbow around the throne', p:'Ezekiel saw it around the throne, and it recalls God’s promise after the flood.', b:`Ezekiel 1:28: "Like the appearance of a rainbow in the clouds on a rainy day, so was the radiance around him." Genesis 9:13–16: the bow is a sign of God's promise never again to destroy the earth by flood. Judgment is about to come from this throne, but mercy surrounds it.`, r:'Ezekiel 1:28; Genesis 9:13–16'});
N('4:4','twenty-four elders','symbol',{t:'Who are the elders?', p:'Twelve tribes plus twelve apostles? Angels? Priestly leaders?', b:`Popular readings: the people of God of both covenants (12 tribes + 12 apostles, matching the city's gates and foundations in 21:12–14); the 24 divisions of priests in 1 Chronicles 24; or a council of angels. Their white clothes and crowns are promised to overcomers (3:5; 2:10).`, r:'1 Chronicles 24:4–19; 21:12–14; 3:5; 2:10', top:'elders'});
N('4:6','four living creatures','word',{w:'beasts4', p:'KJV "four beasts," but the Greek means "living ones."', top:'living-creatures'});
N('4:7','The first living creature was like a lion','history',{t:'Lion, ox, human, eagle', p:'The strongest of the wild animals, tame animals, birds, and all creatures.', b:`A Jewish saying put it this way: the mightiest among birds is the eagle, among tame animals the ox, among wild animals the lion, and over them all is the human (<i>Midrash Rabbah</i> on Exodus 15:1). The creatures represent all creation worshiping God. Irenaeus (about AD 180) matched them to the four Gospels, the start of a long Christian art tradition.`, top:'living-creatures', s:['irenaeus','aune']});
N('4:8','Holy, holy, holy','echo',{t:'Isaiah’s throne vision', p:'The six-winged seraphim sang this in Isaiah 6.', b:`Isaiah 6:2–3: seraphim with six wings call to each other, "Holy, holy, holy is the LORD of hosts." John combines Isaiah's seraphim with Ezekiel's four-faced creatures (Ezekiel 1:5–10; 10:14). This song became the "Sanctus" in Christian worship.`, r:'Isaiah 6:1–3; Ezekiel 1:5–10; Ezekiel 10:14', top:'worship'});
N('4:11','You are worthy, our Lord and God','history',{t:'Domitian’s title', p:'Domitian liked to be called "our lord and god." Here the title goes to the Creator.', b:`The Roman historian Suetonius says Domitian had letters issued in the name of "our lord and god" (<i>dominus et deus noster</i>, <i>Domitian</i> 13). Crowds in the arena hailed emperors with "Worthy!" (Latin <i>dignus</i>, Greek <i>axios</i>). The elders lay their crowns down, as client kings did before the emperor.`, top:'imperial-cult', s:['aune','koester']});

/* ---- chapter 5 ---- */
N('5:1','a scroll with writing on both sides','history',{t:'A sealed document', p:'Roman wills were sealed by seven witnesses and opened only at the right time.', b:`Roman law required a will to be sealed by seven witnesses. Legal deeds were often written inside and summarized outside. Ezekiel's scroll had writing "on the front and back" (Ezekiel 2:9–10). Daniel was told to seal his words "until the time of the end" (Daniel 12:4).`, r:'Ezekiel 2:9–10; Daniel 12:4; Jeremiah 32:10–14', top:'scroll-seals', s:['aune']});
N('5:5','the Lion from the tribe of Judah','spec',{t:'John hears "Lion" and sees a Lamb', p:'The book’s key move: power redefined as sacrifice.', b:`The elder announces a Lion (Genesis 49:9) and the Root of David (Isaiah 11:1, 10), Israel's warrior-messiah. John turns and sees a slaughtered Lamb. Bauckham calls this the key to the book: the Messiah wins by dying. I'd add that John repeats this hear-then-see pattern in 7:4–9 (he hears 144,000 from Israel's tribes and sees a crowd no one could count), so in both places what he hears is Israel's promise, and what he sees is how that promise is fulfilled.`, r:'Genesis 49:9; Isaiah 11:1; Isaiah 11:10; 7:4; 7:9', top:'lamb', s:['bauckham','climax']});
N('5:6','a Lamb standing','word',{w:'lamb', p:'Arnion, "little lamb," "slaughtered" like a sacrifice, yet standing.', top:'lamb'});
N('5:6','seven horns and seven eyes','symbol',{t:'Seven horns, seven eyes', p:'Complete power and complete knowledge.', b:`Horns stand for power and kingship (Daniel 7:24; Psalm 18:2). The seven eyes are "the seven Spirits of God sent out into all the earth," from Zechariah 4:10: "the eyes of the LORD that range throughout the earth." The Lamb is weak-looking and all-powerful at once.`, r:'Zechariah 4:10; Daniel 7:24; Psalm 18:2', top:'sevens'});
N('5:8','gold bowls full of incense, which are the prayers','echo',{t:'Prayers as incense', p:'Psalm 141:2: "May my prayer be set before you like incense."', b:`Prayer rising like incense comes from Psalm 141:2. These bowls return in 8:3–5, where the prayers are mixed with fire and thrown to the earth, and the trumpets begin. The world's judgment is God's answer to his people's prayers.`, r:'Psalm 141:2; 8:3–5; 6:10', top:'worship'});
N('5:9','every tribe, language, people, and nation','israel',{t:'A fourfold people', p:'Seven times the book lists all humanity in four parts.', b:`The fourfold formula (in varying order) appears at 5:9; 7:9; 10:11; 11:9; 13:7; 14:6; 17:15: seven times four. It may echo Genesis 10, where the nations are listed "by their clans, languages, lands, and nations" (10:5, 20, 31). The Lamb's people undo Babel.`, r:'Genesis 10:5; Genesis 11:9; 7:9; 14:6', top:'sevens', s:['climax']});
N('5:10','they will rule on the earth','word',{t:'"Will rule" or "rule"?', greek:'βασιλεύσουσιν (future) vs βασιλεύουσιν (present)', p:'Manuscripts differ. One points to a future kingdom, the other to the present.', b:`Some major manuscripts have the future, "they will reign" (Sinaiticus); others the present, "they reign" (Alexandrinus). The KJV says "we shall reign," following a late reading with "us." Premillennialists favor the future (pointing to 20:4–6); amillennialists note the present fits 1:6.`, r:'1:6; 20:4–6', top:'textual-history', s:['metzger']});
N('5:11','ten thousand times ten thousand','echo',{t:'Daniel’s throne room', p:'Daniel 7:10: "Ten thousand times ten thousand stood before him."', b:`The Greek <i>myriades myriadōn</i> is the largest number the language could easily say. It is taken directly from Daniel 7:10, where it surrounds the Ancient of Days at the judgment. A picture of a number beyond counting, not a census.`, r:'Daniel 7:10', top:'daniel'});

/* ---- chapter 6 ---- */
N('6:2','a white horse','views',{t:'Who is the white rider?', p:'Christ, the gospel, a false Christ, or a conquering empire?', b:`<b>Christ or the gospel</b> (Irenaeus, many historicists), because Christ rides a white horse in 19:11. <b>A false Christ</b> (many futurists), because Jesus warned that deceivers come first (Matthew 24:4–5). <b>Conquest itself</b>, the first of four disasters. The bow suggests the Parthians, the mounted archers Rome feared.`, r:'19:11; Matthew 24:4–5; Zechariah 1:8', top:'four-horsemen', s:['gregg','koester']});
N('6:6','A quart of wheat for a full day','word',{w:'penny', p:'Not cheap: a full day’s pay for one person’s bread.'});
N('6:6',"don't harm the olive oil and the wine",'history',{t:'Domitian’s vine order', p:'In AD 92 Domitian ordered vineyards cut back, then backed down.', b:`Suetonius (<i>Domitian</i> 7, 14) says Domitian, during a grain shortage, ordered half the vineyards in the provinces destroyed, but cancelled the order after protests, possibly from Asia. Whether or not John had this in mind, the picture is of a famine where basic grain is scarce while luxury goods continue.`, s:['aune','koester']});
N('6:8','a pale green horse','word',{w:'pale', p:'Chlōros: the gray-green color of a corpse.'});
N('6:8','sword, famine, disease, and the wild animals','echo',{t:'Ezekiel’s four judgments', p:'Ezekiel 14:21: "my four dreadful judgments: sword, famine, wild beasts and plague."', b:`The fourth rider's list is borrowed from Ezekiel 14:21, and follows the covenant curses of Leviticus 26:21–26. The horsemen are not random disasters; they are the old covenant warnings coming to pass.`, r:'Ezekiel 14:21; Leviticus 26:21–26; Jeremiah 15:2–3'});
N('6:9','under the altar the souls','echo',{t:'Under the altar', p:'Sacrificial blood was poured at the base of the altar.', b:`In the temple, the blood of a sacrifice was poured out at the base of the altar (Leviticus 4:7). The martyrs are pictured as sacrifices. Paul calls his coming death being "poured out like a drink offering" (2 Timothy 4:6).`, r:'Leviticus 4:7; 2 Timothy 4:6; Philippians 2:17', top:'martyrs'});
N('6:10','how long','echo',{t:'"How long, O Lord?"', p:'The cry of the psalms of lament.', b:`"How long?" is the prayer of Psalm 13:1–2; 79:5–10; 94:3 and Zechariah 1:12. Psalm 79:10 asks God to avenge "the outpoured blood of your servants." The rest of the book is the answer to this question (see 10:6, "no more delay").`, r:'Psalm 13:1–2; Psalm 79:5–10; Psalm 94:3; Zechariah 1:12; 10:6', top:'martyrs'});
N('6:12','the whole moon turned red like blood','echo',{t:'Joel’s signs', p:'Joel 2:31: "The sun will be turned to darkness and the moon to blood."', b:`The cosmic signs come from Joel 2:31 and Isaiah 13:10; 34:4 (the sky rolled up like a scroll). In Isaiah these signs announce the fall of Babylon and Edom, real historical judgments, described in world-ending language. Futurists expect literal events; preterists and idealists read prophetic "collapse of the world order" language. Some today connect "blood moons" (lunar eclipses) to these verses.`, r:'Joel 2:31; Isaiah 13:10; Isaiah 34:4; Matthew 24:29; Acts 2:20', top:'day-of-the-lord', l:[['Blood moon prophecy','Blood moon prophecy']]});
N('6:16','Fall on us','echo',{t:'"Fall on us!"', p:'Hosea 10:8, and Jesus’s words on the way to the cross.', b:`Hosea 10:8: "They will say to the mountains, 'Cover us!' and to the hills, 'Fall on us!'" Jesus quotes it to the women of Jerusalem in Luke 23:30, warning of the city's coming destruction. Preterists see that link as support for a first-century focus.`, r:'Hosea 10:8; Luke 23:30; Isaiah 2:19', top:'wrath'});
N('6:16','the anger of the Lamb','spec',{t:'The anger of a lamb', p:'A deliberately strange phrase. Lambs are not angry.', b:`No ancient reader would expect anger from a lamb. My reading: the phrase holds together two things the book will not separate. The judge is the one who was slaughtered for the people now hiding. His anger is the anger of rejected love, not of a tyrant. This fits 14:10, where the torment happens "in front of the Lamb."`, r:'14:10; 5:6; 17:14', top:'wrath'});

/* ---- chapter 7 ---- */
N('7:1','four corners of the earth','history',{t:'"Four corners": a flat earth?', p:'A figure of speech for the whole world, still used today.', b:`Isaiah 11:12 speaks of "the four corners of the earth" too. Ancient writers used it as we use "the four corners of the globe." The four winds are agents of judgment (Jeremiah 49:36; Zechariah 6:5).`, r:'Isaiah 11:12; Jeremiah 49:36; Zechariah 6:5; Daniel 7:2'});
N('7:3','a seal on the foreheads','echo',{t:'The mark of protection', p:'Ezekiel 9: a mark on those who grieve over sin protected them.', b:`In Ezekiel 9:4–6 a man in linen marks the foreheads of the faithful in Jerusalem before the city's judgment. The Hebrew mark is the letter <i>tav</i>, which in old script looked like an X or a cross. The beast's mark in chapter 13 is a counterfeit of this seal.`, r:'Ezekiel 9:4–6; Exodus 12:13; 13:16; 14:1', top:'seal-of-god'});
N('7:4','144,000','views',{t:'Who are the 144,000?', p:'Jewish believers, the whole church, or a special group?', b:`<b>Ethnic Israel</b>: Jewish believers in the end times (many futurists). <b>The whole people of God</b>, pictured as Israel's army (many amillennialists), since the crowd John sees next is the same group. <b>Jewish Christians of the first century</b> (some preterists). <b>A literal number</b> of an elite group (Jehovah's Witnesses).`, top:'144000', s:['gregg','bauckham']});
