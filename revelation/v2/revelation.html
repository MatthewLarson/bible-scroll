const DEEP = {
1:[
 {h:'The risen Jesus, piece by piece', table:[['What John sees','Source','What it says about him'],['"One like a son of man" (1:13)','Daniel 7:13','The human figure given everlasting rule'],['A long robe and a gold sash (1:13)','Exodus 28:4; Daniel 10:5','A priest, standing among the lampstands as the priest tended the temple lamps'],['Hair white as wool and snow (1:14)','Daniel 7:9','In Daniel this is God himself, the Ancient of Days'],['Eyes like flames of fire (1:14)','Daniel 10:6','He sees everything (2:18, 23)'],['Feet like glowing bronze (1:15)','Daniel 10:6; Ezekiel 1:7','Strength that cannot be shaken'],['A voice like rushing water (1:15)','Ezekiel 43:2','The sound of God’s own glory'],['A sharp two-edged sword from his mouth (1:16)','Isaiah 11:4; 49:2','He judges and wins by his word (19:15)'],['A face like the sun (1:16)','Judges 5:31; Matthew 17:2','The glory seen at the Transfiguration'],['Seven stars in his right hand (1:16, 20)','—','The churches’ angels are in his grip']],
  note:'John takes features that Daniel gives to God and to the son of man and puts them on one figure. Without saying "Jesus is God," the picture says it.'},
 ['"From the One who is"',`In 1:4 John writes <i>apo ho ōn</i>, "from He-who-is," keeping God's name in the form used for the subject of a sentence even though Greek grammar requires another form after "from." It looks like a schoolboy's mistake, but John's Greek is careful elsewhere. Most scholars think he refused to change God's name, which comes from Exodus 3:14 in the Greek Old Testament: "I am <i>ho ōn</i>, the One who is." The phrase "who is, who was and who is to come" adds a twist: we expect "who will be," but God is the one who <i>comes</i>.`],
 {h:'The road the letters traveled', table:[['Leg','Rough distance','Notes'],['Patmos to Ephesus','About 60 miles by sea','Ephesus, the province\u2019s leading city and port, comes first'],['Ephesus to Smyrna','About 35 miles north','Along the coast road'],['Smyrna to Pergamum','About 65 miles north','The old royal capital'],['Pergamum to Thyatira','About 40 miles southeast','The road turns inland'],['Thyatira to Sardis','About 35 miles south','Along the Hermus valley'],['Sardis to Philadelphia','About 30 miles southeast','On the imperial post road'],['Philadelphia to Laodicea','About 45 miles southeast','The circuit ends in the Lycus valley']],
  note:'The seven cities are listed in the order a messenger would reach them on a loop of Roman roads, a point first made by William Ramsay (1904). Distances are approximate.'}],
3:[
 {h:'Three cities and their echoes', table:[['City','What it was known for','How the letter uses it'],['Sardis','Old royal capital of Lydia and King Croesus; a "safe" hilltop fortress yet taken by surprise twice, because no one was watching the walls (by Cyrus about 547 BC and Antiochus III in 214 BC)','"Wake up!" and "I will come like a thief" (3:2–3); "a few who have not soiled their clothes" (3:4)'],['Philadelphia','Shaken by the great earthquake of AD 17 and by aftershocks for years; renamed "Neocaesarea" for Tiberius’s help and later "Flavia"','"I will make the winner a pillar... and he will never go out again" and "I will write on him... my own new name" (3:12)'],['Laodicea','Banking, a glossy black wool, and a medical school linked to an eye salve; rebuilt with its own money, refusing Rome\u2019s help, after the AD 60 earthquake (Tacitus, <i>Annals</i> 14.27)','"I am rich and need nothing"; "buy from me gold... white clothes... and salve for your eyes" (3:17–18)']]},
 ['Hot, cold and lukewarm',`Laodicea had no good water of its own and piped it in through a stone aqueduct; it arrived tepid and full of minerals, and the pipes are still crusted with deposits. Six miles away, Hierapolis had hot springs used for healing; ten miles away, Colossae had cold, fresh water. Many scholars (following M. J. S. Rudwick and E. M. B. Green, 1958) argue that "hot" and "cold" are both good, like Hierapolis's healing water and Colossae's refreshing water. Laodicea's problem was not that it was half-hearted rather than hostile; it was that it did no one any good. The traditional reading ("I would rather you were openly against me than half-committed") is still common.`],
 ['"I stand at the door and knock"',`Often used to invite unbelievers to faith, 3:20 is first spoken to a church that has left Jesus outside. The picture is of a shared meal, echoing the lover knocking in Song of Songs 5:2. William Holman Hunt's painting <i>The Light of the World</i> (1851–53, Keble College, Oxford; a later version is in St Paul's Cathedral, London) shows Jesus knocking at an overgrown door with no handle on the outside: it can only be opened from within.`]],
4:[
 {h:'What fills the throne room', table:[['What John sees','Source in the Old Testament'],['A throne, and one seated on it (4:2)','1 Kings 22:19; Isaiah 6:1; Ezekiel 1:26'],['Jasper and carnelian, a rainbow like emerald (4:3)','Ezekiel 1:28 (the rainbow around the throne); Genesis 9:13–16'],['Twenty-four elders on thrones (4:4)','The 24 divisions of priests (1 Chronicles 24:1–19); the 12 tribes and 12 apostles (21:12–14)'],['Lightning and thunder (4:5)','Mount Sinai (Exodus 19:16)'],['Seven lamps of fire (4:5)','The temple lampstand; Zechariah 4:2, 10'],['A sea of glass like crystal (4:6)','The pavement "like sapphire" under God’s feet (Exodus 24:10); Solomon’s bronze "sea" (1 Kings 7:23)'],['Four living creatures full of eyes (4:6–8)','Ezekiel 1:5–10 and 10:12; Isaiah 6:2–3 (six wings, "Holy, holy, holy")']]},
 ['A throne room that answers Rome',`Rome's emperors held court surrounded by advisers and received the crowns of client kings. In AD 63 King Tiridates of Armenia laid his crown at the foot of Nero's statue (Tacitus, <i>Annals</i> 15.29), and in 66 he knelt in Rome to receive it back from Nero himself (Suetonius, <i>Nero</i> 13). Domitian liked to be called "our Lord and God" (<i>dominus et deus noster</i>, Suetonius, <i>Domitian</i> 13.2). Against that background, the elders casting their crowns before God and singing "You are worthy, our Lord and God" (4:10–11) is a political statement: these titles belong to one throne only.`]],
5:[
 {h:'The widening circles of praise', table:[['Verses','Who sings','To whom','What they say'],['5:8–10','The four creatures and 24 elders, with harps and incense','The Lamb','A new song: "You are worthy... because you were slaughtered"'],['5:11–12','Angels, "myriads of myriads" (Daniel 7:10)','The Lamb','A sevenfold praise: power, wealth, wisdom, strength, honor, glory and blessing'],['5:13','Every creature in heaven, on earth, under the earth and in the sea','God and the Lamb together','A fourfold praise: blessing, honor, glory and power "forever and ever"'],['5:14','The four creatures, then the elders','—','"Amen," and they fall down and worship']],
  note:'Four is the number of the world (four winds, four corners), seven the number of completeness. The praise starts at the throne and spreads until it fills all creation.'},
 ['The sealed scroll',`The scroll is "written on the inside and on the back" (5:1), like the scroll Ezekiel was given, full of "lament and mourning and woe" (Ezekiel 2:9–10). Sealed documents in the Roman world included wills and contracts, and one form of Roman will was sealed by seven witnesses (Gaius, <i>Institutes</i> 2.119). Daniel was told to "seal the book until the time of the end" (Daniel 12:4). Many readers see the scroll as God's plan for history, which only the Lamb can put into effect; others as the deed to the world, a last will, or the Old Testament itself, unlocked by Christ.`],
 ['A lamb with horns',`A lamb with seven horns sounds strange, but horns meant power (Daniel 7:7–8; 8:3). In 1 Enoch's "Animal Apocalypse," written about 160 BC, God's people are a flock of sheep; lambs among them grow horns, and one grows a great horn and fights for the flock (1 Enoch 90:9–12). John's Lamb has that power, complete (seven horns), but he has it "as though slaughtered."`]],
6:[
 {h:'The six seals', table:[['Seal','What appears','Source','Common readings'],['1 (6:1–2)','White horse; rider with a bow and crown','Zechariah 1:8; 6:1–3','Conquest; Parthian invaders; Christ and the gospel; a false christ'],['2 (6:3–4)','Red horse; rider with a large sword','Zechariah 6:2','War and civil war'],['3 (6:5–6)','Black horse; rider with scales','Ezekiel 4:16','Famine and inflation'],['4 (6:7–8)','Pale green horse; Death, with Hades following','Ezekiel 14:21','Death by sword, famine, disease and wild animals, over a fourth of the earth'],['5 (6:9–11)','Souls under the altar: "How long?"','Leviticus 4:7; Psalm 79:5, 10','Martyrs waiting for justice'],['6 (6:12–17)','Earthquake, black sun, falling stars','Isaiah 34:4; Joel 2:31; Hosea 10:8','The day of the Lord; the collapse of a world order']],
  note:'Jesus’s list of "birth pains" in Matthew 24:6–8 runs in nearly the same order: wars, nations at war, famines, earthquakes, then persecution (24:9) and signs in the sky (24:29).'},
 ['A day’s wages for a quart of wheat',`A <i>choinix</i> (about a quart) of wheat was one man's daily ration; a denarius was a day's wage. That price is roughly ten times normal: a worker could feed himself but not his family. Barley, the poor man's grain, buys three times as much. "Do not harm the oil and the wine" may point to a real event: in AD 92 Domitian ordered half the vineyards in the provinces cut down to grow more grain, and then let the order drop (Suetonius, <i>Domitian</i> 7.2 and 14.2); later writers say cities in Asia sent envoys to protest. Whatever the background, the luxury crops survive while bread runs short.`],
 ['The archer on the white horse',`The only rider with a bow was a fearful image to Romans. The Parthians, Rome's enemies beyond the Euphrates, were famous mounted archers and they destroyed a Roman army at Carrhae in 53 BC and forced another to surrender in AD 62. A conquering bowman from the east was the empire's nightmare, which is why many read the first seal as invasion rather than as Christ.`]],
7:[
 {h:'The tribes in 7:5–8', table:[['Revelation 7 order','Notes'],['Judah','First, not Reuben the firstborn: the tribe of the Messiah (5:5)'],['Reuben, Gad, Asher, Naphtali','Four sons of Leah, Zilpah and Bilhah, mixed together'],['Manasseh','Joseph’s son, listed although Joseph also appears'],['Simeon, Levi, Issachar, Zebulun','Four sons of Leah; Levi, the priestly tribe with no land, is counted'],['Joseph, Benjamin','Rachel’s sons come last'],['Missing: Dan and Ephraim','Both linked with idols (Judges 18; 1 Kings 12:29–30; Hosea 4:17)']],
  note:'There are about 20 different tribe lists in the Old Testament, and none matches this one. Irenaeus (about AD 180) thought Dan was left out because the Antichrist would come from it (<i>Against Heresies</i> 5.30.2), reading Jeremiah 8:16.'},
 ['Palm branches and shelter',`The great crowd holds palm branches (7:9), the sign of the Feast of Tabernacles (Leviticus 23:40), when Israel lived in shelters to remember the wilderness. God "will shelter them" (7:15, literally "will pitch his tent over them"). Zechariah says that one day the nations will come up to Jerusalem to keep this feast (Zechariah 14:16). Crowds also waved palms when Jesus entered Jerusalem (John 12:13).`],
 ['Every tear wiped away',`7:16–17 combines three promises: "They will not hunger or thirst, nor will the desert heat or the sun beat down on them" (Isaiah 49:10); God "will wipe away the tears from all faces" (Isaiah 25:8); and the Lamb will be their shepherd (Ezekiel 34:23; Psalm 23). The Lamb becomes the shepherd: the one who was led to slaughter now leads the flock.`]],
8:[
 {h:'The first four trumpets and Egypt’s plagues', table:[['Trumpet','What happens','Exodus parallel'],['1 (8:7)','Hail and fire mixed with blood; a third of the land and trees burned','The seventh plague, hail with fire (Exodus 9:23–25)'],['2 (8:8–9)','A burning mountain thrown into the sea; a third of the sea becomes blood','The first plague, the Nile turned to blood (Exodus 7:20–21)'],['3 (8:10–11)','A star named Wormwood falls; a third of the rivers turn bitter','Bitter water at Marah (Exodus 15:23); Jeremiah 9:15'],['4 (8:12)','A third of the sun, moon and stars darkened','The ninth plague, darkness (Exodus 10:21–23)']],
  note:'A burning mountain falling into the sea reminded some first-century readers of Vesuvius, which buried Pompeii in AD 79; the Sibylline Oracles (book 4) treat that eruption as divine judgment.'},
 ['Silence, then trumpets',`"Silence in heaven for about half an hour" (8:1) echoes the prophets: "Be silent before the Sovereign LORD, for the day of the LORD is near" (Zephaniah 1:7; also Habakkuk 2:20; Zechariah 2:13). In Israel, silver trumpets called the people to gather, to march, to battle and to festivals (Numbers 10:1–10), and at Jericho seven priests blew seven trumpets before the walls fell (Joshua 6). Trumpets in Revelation are both warning and battle signal.`],
 ['Wormwood and Chernobyl',`Wormwood (<i>apsinthos</i>) is a bitter plant, used by the prophets for the bitterness of judgment (Jeremiah 9:15; Lamentations 3:15). After the 1986 nuclear disaster, many noted that "Chornobyl" is the Ukrainian name of a related plant, mugwort. It is a striking coincidence, though the two plants are different species and Revelation is describing a star, not a reactor.`]],
9:[
 {h:'Locusts from Joel', table:[['Revelation 9','Joel'],['Locusts like horses ready for battle (9:7)','"They look like horses; they charge like cavalry" (Joel 2:4)'],['Teeth like lions’ teeth (9:8)','"It has the teeth of a lion" (Joel 1:6)'],['Wings sound like many chariots (9:9)','"With a noise like that of chariots" (Joel 2:5)'],['The sun and air darkened by smoke (9:2)','"The sun and moon are darkened" (Joel 2:10)'],['A king over them (9:11)','"Locusts have no king" (Proverbs 30:27)']],
  note:'A locust swarm can cover hundreds of square miles and eat its own weight in plants every day. In the ancient world it meant famine.'},
 ['Two hundred million and the Euphrates',`The Euphrates was the eastern edge of the Roman Empire; beyond it lay Parthia. The number of riders is "twice ten thousand times ten thousand" (9:16), a number meant to overwhelm, larger than every army of the ancient world put together. In 1970 Hal Lindsey linked it to a Chinese claim of a 200-million-strong militia, and others have linked it to demonic forces or to the countless dead of history's wars. Its horses have lions' heads and tails like snakes, more like monsters than cavalry.`],
 ['"They did not repent"',`The chapter ends with a list of what people refused to give up: worshiping demons and idols "that cannot see or hear or walk" (Psalm 115:4–7), murder, magic, sexual sin and theft (9:20–21). The word for magic is <i>pharmakeia</i>, the root of our "pharmacy," which meant the use of drugs and potions in sorcery and spells.`]],
10:[
 {h:'The mighty angel', table:[['Feature','Where else it appears'],['Wrapped in a cloud (10:1)','Jesus comes "with the clouds" (1:7); God led Israel in a cloud (Exodus 13:21)'],['A rainbow over his head (10:1)','The rainbow around God’s throne (4:3)'],['Face like the sun (10:1)','The risen Jesus (1:16)'],['Legs like pillars of fire (10:1)','The pillar of fire in the wilderness (Exodus 13:21)'],['One foot on the sea, one on the land (10:2)','His message is for the whole world'],['A voice like a lion’s roar (10:3)','"The lion has roared... the Sovereign LORD has spoken" (Amos 3:8)'],['Raises his hand to heaven and swears (10:5–6)','The angel in Daniel 12:7 who swears "it will be for a time, times and half a time"']],
  note:'Because he looks so much like Jesus in chapter 1, some interpreters (especially in the Reformed tradition) think the angel is Christ himself. Most think he is a great angel who carries Christ’s glory.'},
 ['"No more delay," not "no more time"',`The KJV has the angel swear "that there should be time no longer" (10:6), which became a popular saying about the end of time itself. The Greek <i>chronos ouketi estai</i> means "there will be no more delay," as nearly all modern translations say. It answers the martyrs' cry "How long?" (6:10).`],
 ['Seven thunders, and a scroll to eat',`The seven thunders are the only thing in the book John is told not to write down (10:4). Psalm 29 calls thunder "the voice of the LORD" seven times. Then John eats a little scroll, as Ezekiel did (Ezekiel 2:8–3:3; also Jeremiah 15:16): sweet in his mouth, bitter in his stomach (10:9–10). God's message is good news and also a hard word to carry.`]],
11:[
 {h:'Three and a half, five ways', table:[['Phrase','Where','Who or what'],['42 months','11:2; 13:5','The nations trample the holy city; the beast has authority'],['1,260 days','11:3; 12:6','The two witnesses prophesy; the woman is kept in the wilderness'],['"A time, times and half a time"','12:14','The woman is kept safe (from Daniel 7:25; 12:7)'],['3½ days','11:9, 11','The witnesses’ bodies lie in the street'],['3½ years of drought','Luke 4:25; James 5:17','The drought in Elijah’s day, which the witnesses’ power recalls (11:6)']],
  note:'Half of seven: a broken, limited period. The same span is both the time of trampling and the time of protected witness.'},
 {h:'Who are the two witnesses?', table:[['Proposal','Why','Held by'],['Moses and Elijah','They turn water to blood and shut the sky (Exodus 7; 1 Kings 17:1); both appear at the Transfiguration','Many futurists'],['Enoch and Elijah','The two who never died (Genesis 5:24; 2 Kings 2:11)','Tertullian, Hippolytus and much of the early church'],['Peter and Paul','Killed in Rome under Nero','Some preterists'],['The witnessing church','They are called "two lampstands" (11:4), and lampstands are churches (1:20); the law needs two witnesses (Deuteronomy 19:15)','Many idealists and scholars'],['The Law and the Prophets','The Old Testament testifies to Christ','Some historicists']]},
 ['Measuring the temple',`John is told to measure the temple and the altar but leave out the outer court (11:1–2). Ezekiel watched an angel measure a future temple (Ezekiel 40–42), and Zechariah saw a man measuring Jerusalem (Zechariah 2:1–5). Measuring marks something as God's and protected. Futurists see a rebuilt temple in Jerusalem; preterists the temple before AD 70; many others the church, which Paul calls God's temple (1 Corinthians 3:16).`]],
12:[
 {h:'The cast', table:[['Figure','Description','Main identifications'],['The woman','Dressed in the sun, moon under her feet, crown of 12 stars (12:1)','Israel (Genesis 37:9); Mary; the people of God from which Messiah comes; the church'],['The male child','Will rule the nations with an iron rod; snatched up to God (12:5)','The Messiah (Psalm 2:9); Jesus’s birth and ascension'],['The dragon','Red, seven heads, ten horns, sweeps a third of the stars (12:3–4)','"That ancient serpent, called the devil and Satan" (12:9)'],['Michael','Leads the angels against the dragon (12:7)','Israel’s guardian angel (Daniel 10:13, 21; 12:1)'],['The woman’s other children','"Those who keep God’s commands and hold to the testimony about Jesus" (12:17)','Believers']]},
 ['A baby god among seven stars',`In AD 83 Domitian's infant son died, and the emperor declared him a god. Coins struck for his wife Domitia show the child as a baby god seated on a globe, reaching up to seven stars. For John's readers, Rome had its own story of a divine child and a mother honored as "mother of the divine Caesar." Revelation 12 tells the real one.`],
 ['Exodus again',`The woman is given "the two wings of the great eagle" to fly into the wilderness (12:14), quoting God's words at Sinai: "I carried you on eagles' wings" (Exodus 19:4). She is fed there (12:6), as Israel was fed with manna. The earth opens its mouth and swallows the flood (12:16), as it swallowed Pharaoh's army (Exodus 15:12) and Korah's rebels (Numbers 16:32).`]],
13:[
 {h:'Daniel’s four beasts in one', table:[['Daniel 7','Revelation 13:1–2'],['1. A lion with eagle’s wings (Babylon)','"A mouth like a lion"'],['2. A bear (Media and Persia)','"Feet like a bear"'],['3. A leopard with four heads (Greece)','"Like a leopard"'],['4. A terrible beast with ten horns (usually Rome)','Ten horns, seven heads']],
  note:'Daniel’s four beasts have seven heads in all (1 + 1 + 4 + 1). John’s beast has all seven, and he lists the animals in reverse order, looking back from his own day: every empire before rolled into one.'},
 ['The image that speaks',`The land beast makes an image of the sea beast "speak" (13:15). Ancient temples were known for statues that seemed to move or speak. The satirist Lucian describes Alexander of Abonoteichus, a false prophet in Asia Minor around AD 150, whose snake-god Glycon had a linen head that "spoke" through a hidden tube (<i>Alexander the False Prophet</i> 26). Calling fire down from heaven (13:13) imitates Elijah (1 Kings 18:38). False prophecy works by copying true signs.`],
 ['"Who is like the beast?"',`The world's question (13:4) copies Israel's song at the sea: "Who among the gods is like you, LORD?" (Exodus 15:11). It is also a play on the name Michael, which means "Who is like God?" In chapter 12 Michael wins; in chapter 13 the world asks the wrong question.`]],
14:[
 {h:'Three angels, two harvests', table:[['Verses','What happens','Meaning'],['14:6–7','First angel: "eternal good news" for every nation: fear God, worship the Creator','A last call to repent'],['14:8','Second angel: "Fallen is Babylon the Great"','From Isaiah 21:9; told ahead of chapter 18'],['14:9–11','Third angel: those who take the mark drink God’s wine','The cost of worshiping the beast'],['14:12–13','"Blessed are the dead who die in the Lord"','The second of seven blessings'],['14:14–16','One like a son of man reaps the grain with a sickle','Usually the gathering of God’s people'],['14:17–20','An angel gathers grapes into the winepress of God’s anger','Judgment; from Joel 3:13 and Isaiah 63:1–6']]},
 ['Blood to the horses’ bridles',`The winepress is trodden "outside the city," and blood flows "as high as a horse's bridle for 1,600 stadia" (14:20), about 180 miles. 1 Enoch describes a final judgment in which "the horse will walk up to its chest in the blood of sinners" (1 Enoch 100:3), and later rabbinic tradition used similar words for Bar Kokhba's last stand at Betar in AD 135. 1,600 is 40 × 40, or 4 × 4 × 100: the four corners of the earth, squared and multiplied. Jesus too suffered "outside the city gate" (Hebrews 13:12).`],
 ['First fruits',`The 144,000 are "first fruits to God and the Lamb" (14:4). In Israel the first sheaf of the harvest was given to God as a promise that the rest would follow (Leviticus 23:10). If the 144,000 are first fruits, a larger harvest is still coming, which is exactly what 14:14–16 shows.`]],
15:[
 {h:'What the song of Moses and the Lamb quotes', table:[['Line in 15:3–4','Source'],['"Great and wonderful are your works"','Psalm 111:2; Psalm 139:14'],['"Lord God, the All-Powerful"','Amos 4:13 (in the Greek Old Testament)'],['"Just and true are your ways"','Deuteronomy 32:4 (the other song of Moses)'],['"King of the nations... who will not fear you?"','Jeremiah 10:7'],['"All nations will come and worship before you"','Psalm 86:9'],['"Your righteous acts have been revealed"','Psalm 98:2']],
  note:'Not one line comes from the song Moses sang at the Red Sea (Exodus 15). That song celebrated enemies drowned; this one celebrates the nations coming to worship (Richard Bauckham, <i>The Climax of Prophecy</i>).'},
 ['A sea mixed with fire',`The victors stand beside "a sea of glass mixed with fire" (15:2), the sea before the throne (4:6), now like the Red Sea with Pharaoh's army behind it. Like Israel on the far shore, they sing. Then the temple fills with smoke "from the glory of God" and no one can enter (15:8), as when the cloud filled the tabernacle and Moses could not go in (Exodus 40:34–35) and when Isaiah saw the temple fill with smoke (Isaiah 6:4).`]],
16:[
 {h:'Bowls, trumpets and plagues side by side', table:[['Target','Trumpet','Bowl','Egypt'],['Land','Hail and fire; a third burned (8:7)','Painful sores (16:2)','Boils (Exodus 9:10)'],['Sea','A third becomes blood (8:8)','All becomes blood; everything dies (16:3)','Nile to blood (7:20)'],['Rivers and springs','A third turned bitter (8:10)','Turned to blood (16:4)','Nile to blood (7:20)'],['Sun','A third darkened (8:12)','Scorches people with fire (16:8)','—'],['Throne of the beast / the abyss','Locusts from the abyss; darkness (9:1–2)','Darkness on the beast’s kingdom (16:10)','Darkness (10:22)'],['Euphrates','Four angels released (9:14)','Dried up for the kings from the east (16:12)','—'],['The end','"The kingdom of the world has become the kingdom of our Lord" (11:15)','"It is done!" (16:17)','—']],
  note:'The trumpets hit a third; the bowls hit everything. The pattern is the main evidence for reading the two series as the same judgments told twice, the second time in full.'},
 ['How Babylon fell the first time',`The Greek historian Herodotus says Cyrus captured Babylon in 539 BC by diverting the Euphrates and marching his army in along the dry riverbed (<i>Histories</i> 1.191). The prophets had said God would dry up Babylon's waters (Isaiah 44:27; Jeremiah 50:38; 51:36). When the sixth bowl dries the Euphrates for "the kings from the east" (16:12), it replays the night Babylon fell, and points to Rome's own fear of the Parthians beyond that river.`],
 ['Hail as heavy as a talent',`The last plague is hailstones "about a talent" each (16:21), roughly 60 to 100 pounds. It echoes the seventh Egyptian plague (Exodus 9:24) and the hailstones God threw down on the Canaanite kings (Joshua 10:11). The people's response is the same as Pharaoh's: they curse God (16:9, 11, 21).`]],
17:[
 {h:'Counting the seven kings (17:10)', table:[['Start with','Count','"One is" (the sixth)','"Not yet come" (the seventh)','The eighth'],['Julius Caesar','Every ruler','Nero (54–68)','Galba, who reigned 7 months','A Nero-like figure'],['Augustus','Every ruler','Galba (68–69)','Otho, 3 months','Vitellius or Vespasian'],['Augustus','Skip the three short reigns of 68–69','Vespasian (69–79)','Titus, 2 years','Domitian, whom the poet Juvenal called "a bald Nero" (<i>Satires</i> 4.38)'],['—','Seven world empires: Egypt, Assyria, Babylon, Persia, Greece, Rome, and one to come','Rome','A future empire','The final beast'],['—','Seven as a symbol of completeness','The present evil power','Its brief final form','Evil’s last return']],
  note:'Each way of counting supports a different date for the book. The angel’s warning, "This calls for a mind with wisdom" (17:9), suggests the first readers were meant to work it out.'},
 ['The city on seven hills',`Rome was famous as the city of seven hills: the poets Virgil (<i>Georgics</i> 2.535), Horace (<i>Secular Hymn</i> 7) and Martial all called it that, and a yearly festival, the Septimontium, celebrated them. Many first-century readers would have taken "seven mountains on which the woman sits" (17:9) as Rome. Those who identify Babylon with Jerusalem note that Jerusalem too was described as set among hills, but "seven hills" was Rome's nickname.`],
 ['The beast turns on the woman',`In 17:16 the beast and its ten horns hate the prostitute, strip her, eat her flesh and burn her. Evil destroys itself: the power that carried the city in the end devours it. Ezekiel pictured Jerusalem's lovers turning on her in just this way (Ezekiel 23:25–29). Preterists see the Roman armies burning Jerusalem, or Rome burning in AD 64 or 69; others see any system that consumes those who rely on it.`]],
19:[
 {h:'The names of the rider', table:[['Name','Verse','Echo'],['Faithful and True','19:11','Jesus in the letter to Laodicea (3:14)'],['A name no one knows but he himself','19:12','The winners’ secret new name (2:17)'],['The Word of God','19:13','"In the beginning was the Word" (John 1:1, 14)'],['King of kings and Lord of lords','19:16; 17:14','God’s title in Deuteronomy 10:17; Daniel 4:37 (Greek); 1 Timothy 6:15']]},
 {h:'Two suppers', table:[['','The wedding supper of the Lamb (19:7–9)','The great supper of God (19:17–18)'],['Guests','Those invited, "blessed"','The birds of the air'],['Food','A feast with the bridegroom','The flesh of kings, generals and armies'],['Source','Isaiah 25:6–8; Matthew 22:1–14','Ezekiel 39:17–20']],
  note:'Everyone is at a supper in chapter 19. The only question is which one.'},
 ['A robe dipped in blood before the battle',`The rider's robe is already "dipped in blood" (19:13) before any fighting is described. The picture comes from Isaiah 63:1–3, where God's garments are stained from treading the winepress. But in Revelation the Lamb's victory was won by his own blood (5:9; 12:11), and many scholars, such as G. B. Caird and Richard Bauckham, think this is his own blood, not his enemies'. His only weapon is the sword from his mouth (19:15, 21).`],
 ['Hallelujah',`"Hallelujah" is Hebrew: <i>hallelu</i>, "praise," and <i>Yah</i>, short for God's name. It opens and closes many psalms, and Psalms 113–118, the "Hallel," were sung at Passover. Jesus and his disciples sang a hymn after the Last Supper (Mark 14:26), probably these psalms. Handel's "Hallelujah" chorus in <i>Messiah</i> (first performed in Dublin, 1742) sets words from 19:6, 11:15 and 19:16.`]],
20:[
 {h:'Gog and Magog, from Ezekiel to Revelation', table:[['','Ezekiel 38–39','Revelation 19–20'],['Who','Gog, a ruler "of the land of Magog" (38:2)','"Gog and Magog," both names for the nations (20:8)'],['From where','"The far north" (38:15)','"The four corners of the earth" (20:8)'],['When','After Israel is restored and living in safety (38:8)','After the thousand years (20:7)'],['Their end','Fire and sulfur from heaven (38:22; 39:6)','Fire comes down from heaven (20:9)'],['Afterward','Birds feast on the fallen (39:17–20)','Birds feast on the fallen (19:17–21)']],
  note:'Revelation uses Ezekiel 38–39 twice: the bird feast in chapter 19 and the fire from heaven in chapter 20. Amillennial writers take that as a sign that 19:17–21 and 20:7–10 are the same final battle told twice; premillennial writers see two battles a thousand years apart.'},
 ['Bound, sealed, released',`An angel with a key and a great chain seizes the dragon, throws him into the abyss and seals it (20:1–3). The picture recalls the fallen angels bound "in darkness" until judgment (Jude 6; 2 Peter 2:4) and 1 Enoch, where the angel Raphael binds the rebel Azazel and throws him into a pit in the desert (1 Enoch 10:4–6). Jesus said he had bound "the strong man" so he could plunder his house (Matthew 12:29). Whether the binding is past or future is the core of the millennium debate.`]],
22:[
 {h:'How the book’s ending answers its beginning', table:[['Chapter 1','Chapter 22'],['"To show his servants what must soon take place" (1:1)','The same words exactly (22:6)'],['"Blessed is the one who... keeps what is written" (1:3)','"Blessed is the one who keeps the words of the prophecy" (22:7)'],['"I am the Alpha and the Omega," says the Lord God (1:8)','"I am the Alpha and the Omega," says Jesus (22:13)'],['"I, John" (1:9)','"I, John" (22:8)'],['"Write... and send it to the seven churches" (1:11)','"This testimony for the churches" (22:16)'],['"Look! He is coming with the clouds" (1:7)','"Yes, I am coming soon" (22:20)'],['"Grace to you and peace" (1:4)','"The grace of the Lord Jesus be with all" (22:21)']],
  note:'The book is framed like a letter, with a greeting and a farewell. The title God gives himself at the start, Jesus claims at the end.'},
 ['Do not add or take away',`22:18–19 warns against adding to or taking from "the words of this book." Moses gave the same warning for the law (Deuteronomy 4:2; 12:32). Ancient authors sometimes added such curses to protect their books from careless copyists; Irenaeus ended one of his works by asking copyists to check their copy carefully against the original (quoted by Eusebius, <i>Church History</i> 5.20.2). The warning is about this book, not the whole Bible, which did not yet exist as one volume.`],
 ['"Come, Lord Jesus"',`The book's last prayer (22:20) is the Greek form of an Aramaic prayer from the earliest church, <i>Maranatha</i>, "Our Lord, come!" Paul quotes it untranslated (1 Corinthians 16:22), and the Didache uses it in its prayers after the Lord's Supper (Didache 10.6). It may have been said at the meal. Revelation ends where Christian worship began: asking Jesus to come.`]]

/* ---------- Bible reference parser (shared by the page and the build script) ----------
   Finds "Isaiah 44:6", "Psalm 89:27, 37", "Ezekiel 2:8–3:3", "Daniel 7", "1 Kings 6:20" and bare "13:18".
   A bare chapter:verse is Revelation, unless it continues a list that began with another book in the same
   sentence part (Isaiah 13:10; 34:4), or follows a capitalized word that is not a book ("Barnabas 15:9").
   In a plain reference list (listMode), every bare item is Revelation.
   ctx is the text that precedes `text` in the page, so "<i>To the Magnesians</i> 9:1" is seen as following a title. */
const BIBLE_BOOKS = [
 ['Genesis'],['Exodus'],['Leviticus'],['Numbers'],['Deuteronomy'],['Joshua'],['Judges'],['Ruth'],
 ['1 Samuel'],['2 Samuel'],['1 Kings'],['2 Kings'],['1 Chronicles'],['2 Chronicles'],['Ezra'],['Nehemiah'],['Esther'],['Job'],
 ['Psalms','Psalm'],['Proverbs'],['Ecclesiastes'],['Song of Songs','Song of Solomon'],['Isaiah'],['Jeremiah'],['Lamentations'],['Ezekiel'],['Daniel'],
 ['Hosea'],['Joel'],['Amos'],['Obadiah'],['Jonah'],['Micah'],['Nahum'],['Habakkuk'],['Zephaniah'],['Haggai'],['Zechariah'],['Malachi'],
 ['Matthew'],['Mark'],['Luke'],['John'],['Acts'],['Romans'],['1 Corinthians'],['2 Corinthians'],['Galatians'],['Ephesians'],['Philippians'],['Colossians'],
 ['1 Thessalonians'],['2 Thessalonians'],['1 Timothy'],['2 Timothy'],['Titus'],['Philemon'],['Hebrews'],['James'],['1 Peter'],['2 Peter'],
 ['1 John'],['2 John'],['3 John'],['Jude'],['Revelation']
];
const BOOK_OF = {}; BIBLE_BOOKS.forEach(names => names.forEach(n => BOOK_OF[n] = names[0]));
const ONE_CH = new Set(['Obadiah','Philemon','2 John','3 John','Jude']);
const PLAIN_WORDS = new Set('See Compare In At And Also Then From To Or Both Note Like Unlike After Before With Until Since Only Verse Verses Chapter Revelation Rev But Yet So As'.split(' '));
const REV_VC = [20,29,22,11,14,17,17,13,21,11,19,17,18,20,8,21,18,24,21,15,27,21];
const _names = Object.keys(BOOK_OF).sort((a,b)=>b.length-a.length).map(n=>n.replace(/ /g,'\\s'));
const _cv = '(\\d{1,3})(?::(\\d{1,3}))?(?:[\\u2013-](\\d{1,3})(?::(\\d{1,3}))?)?';
const REF_RE = new RegExp(`(?:\\b(${_names.join('|')})\\s)?${_cv}(?!\\d|[.:]\\d|\\w)`, 'g');

/* -> [{start, end, book, c, v, c2, v2, label}] */
function findRefs(text, listMode, ctx=''){
  const out = []; let book = null, lastEnd = -1, m;
  REF_RE.lastIndex = 0;
  while((m = REF_RE.exec(text))){
    const [all, bname, c, v, x, y] = m; const start = m.index;
    if(bname){ book = BOOK_OF[bname.replace(/\s/g,' ')]; }
    else {
      // only digit groups with a colon count without a book name, or a ", 37" continuing a verse list
      const before = (ctx + text.slice(0, start)).slice(-30);   // ctx: text just before this node, e.g. an <i>title</i>
      const gap = lastEnd >= 0 ? text.slice(lastEnd, start) : null;
      const continues = gap !== null && /^\s*(?:[;,]|and|,\s*and)\s*$/.test(gap);
      if(!v){
        if(!(continues && /^\s*,\s*$/.test(gap) && out.length && out[out.length-1].v)) { continue; }
        const p = out[out.length-1];   // "Psalm 89:27, 37" -> verse 37 of the same chapter
        const r = {start, end:start+all.length, book:p.book, c:p.c2||p.c, v:+c, c2:null, v2:x?+x:null};
        r.label = `${r.book} ${r.c}:${r.v}${r.v2?'–'+r.v2:''}`; out.push(r); lastEnd = r.end; continue;
      }
      const w = (before.match(/([A-Z][a-z']+)\.?\s$/)||[])[1];
      if(w && !PLAIN_WORDS.has(w)) { lastEnd = -1; continue; }
      if(/[\d.]$/.test(before)) continue;
      book = (!listMode && continues && book) ? book : 'Revelation';
    }
    const r = {start, end:start+all.length, book, c:+c, v:v?+v:null, c2:null, v2:null};
    if(x){ if(y){ r.c2=+x; r.v2=+y; } else if(v) r.v2=+x; else r.c2=+x; }
    if(!r.v && ONE_CH.has(r.book)){ r.v=r.c; r.v2=r.c2; r.c=1; r.c2=null; }
    if(r.book==='Revelation' && (r.c<1 || r.c>22 || (r.v && r.v>REV_VC[r.c-1]))) { continue; }
    const tail = r.v ? `${r.c}:${r.v}` + (r.c2 ? `–${r.c2}:${r.v2}` : r.v2 ? `–${r.v2}` : '') : `${r.c}` + (r.c2?`–${r.c2}`:'');
    r.label = `${r.book} ${tail}`;
    out.push(r); lastEnd = r.end;
  }
  return out;
}
/* verse keys a reference covers, as "Book c:v", capped */
function refVerses(r, vcount, cap=30){
  const keys=[]; const c1=r.c, c2=r.c2||r.c;
  for(let c=c1;c<=c2;c++){
    const n = vcount(r.book,c); if(!n) break;
    const a = (c===c1 && r.v) ? r.v : 1;
    const b = (c===c2) ? (r.v2 || (r.c2 ? (r.v ? (r.v2||n) : n) : (r.v || n))) : n;
    for(let v=a; v<=Math.min(b,n); v++){ keys.push(`${r.book} ${c}:${v}`); if(keys.length>=cap) return keys; }
  }
  return keys;
}
if(typeof module!=='undefined') module.exports = {findRefs, refVerses, BIBLE_BOOKS, BOOK_OF, REV_VC};

s from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.","gk":"καὶ ἐξαλείψει πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ἔτι. τὰ πρῶτα ἀπῆλθαν."},"22:20":{"kjv":"He which testifieth these things saith, Surely I come quickly. Amen. Even so, come, Lord Jesus.","gk":"Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ἔρχου, κύριε Ἰησοῦ."}};
/* ---------- assemble the data ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const store = { get(k){ try{return localStorage.getItem(k)}catch(_){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(_){} } };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const bgURL = (q, ver='NIV') => `https://www.biblegateway.com/passage/?search=${encodeURIComponent(q)}&version=${ver}`;
const ext = (href, label, cls='') => `<a href="${href}" target="_blank" rel="noopener"${cls?` class="${cls}"`:''}>${label}</a>`;

/* Plain English text */
const PLAIN = []; const PV = {};
{ let cur = null;
  PLAIN_SRC.split('\n').forEach(line => {
    if(line.startsWith('## ')) { cur = {h:line.slice(3), vs:[]}; return; }
    const m = line.match(/^(\d+):(\d+) (.*)$/); if(!m) return;
    const c = +m[1]; const key = `${c}:${m[2]}`; PV[key] = m[3];
    PLAIN[c] = PLAIN[c] || [];
    if(!PLAIN[c].includes(cur)) PLAIN[c].push(cur);
    cur.vs.push(key);
  });
}

/* notes */
NOTES.forEach((n,i) => {
  const w = n.w ? WORDS[n.w] : null;
  n.id = i; n.title = n.t || w.title; n.body = n.b || w.body; n.greek = n.greek || (w && w.greek) || '';
  n.kind = w ? w.kind : null; n.c = +n.v.split(':')[0];
});
const NOTES_AT = {}; NOTES.forEach(n => (NOTES_AT[n.v] = NOTES_AT[n.v] || []).push(n));

/* topics: the translations guide becomes a front page, the rest are topic pages */
const ABOUT = TOPICS.find(t => t.id==='translations-guide');
const TLIST = TOPICS.filter(t => t !== ABOUT);
const KINDS = ['Ideas','People','Places','Symbols','Words'];
TLIST.sort((a,b) => KINDS.indexOf(a.kind)-KINDS.indexOf(b.kind) || a.title.localeCompare(b.title));
const TOP = {}; TLIST.forEach(t => TOP[t.id] = t);
const CH_TOPICS = {};
CHAPTERS.forEach(c => CH_TOPICS[c.n] = [...c.topics]);
TLIST.forEach(t => t.ch.forEach(n => CH_TOPICS[n] && !CH_TOPICS[n].includes(t.id) && CH_TOPICS[n].push(t.id)));
NOTES.forEach(n => n.top && !CH_TOPICS[n.c].includes(n.top) && CH_TOPICS[n.c].push(n.top));
TLIST.forEach(t => t.chs = Object.keys(CH_TOPICS).filter(n => CH_TOPICS[n].includes(t.id)).map(Number));

/* v1 study material attached to the chapter where each station begins */
const STATION_OF = {}; STATIONS.forEach(s => s.ch.forEach(n => { if(!STATION_OF[n]) STATION_OF[n] = s; }));
/* a station spans one or two chapters; EXTRA_PLACE says which chapter page shows each extra (default: the first) */
const placeOf = (st, kind, i) => { const p = (EXTRA_PLACE[st.id] || {})[kind]; const v = Array.isArray(p) ? p[i] : p; return v === undefined ? st.ch[0] : v; };

/* ---------- small builders ---------- */
const ICON = {
  lit:`<svg viewBox="0 0 22 12" aria-hidden="true"><path d="M2,6 L20,6" stroke="${C.ink}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  sym:`<svg viewBox="0 0 22 12" aria-hidden="true"><path d="M2,6 q4,-6 8,0 t8,0" fill="none" stroke="${C.ink}" stroke-width="2.2" stroke-linecap="round"/></svg>`
};
const STENCIL = `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="url(#spray)"/><path d="M8,13 L8,8 M5.6,9 L4.8,3.6 M7.4,8 L7.4,2.6 M9.2,8 L9.6,3 M10.8,9 L11.8,4.6 M5.4,11 L2.6,8.4" stroke="${C.parch}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const SCROLLI = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3,3 h9 a2,2 0 0 1 0,4 h-1 v6 h-8 a2,2 0 0 1 0,-4 h1 z" fill="none" stroke="${C.ink2}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const wordCard = k => { const w=WORDS[k]; const n=NOTES.find(x=>x.w===k);
  return `<div class="box word"><div class="tag"><span class="kindb k-${w.kind}">${KIND[w.kind]}</span><i>${w.ref}</i></div><h5>${w.title}</h5><p class="greek small">${w.greek}</p><p>${w.body}</p>${n?`<p class="small"><button class="pill" data-verse="${n.v}">See it in the text, ${n.v}</button></p>`:''}</div>`; };
const specCard = (s, label='Claude’s theory') => `<div class="box spec"><div class="tag">${label} <i>my own idea, not established scholarship</i></div><h5>${s.title}</h5><p>${s.body}</p>${s.refs?`<p class="small reflist">${s.refs}</p>`:''}</div>`;
const factCard = t => `<div class="box fact"><div class="tag">${SCROLLI}From history and scholarship</div><p>${t}</p></div>`;
const mythCard = m => `<div class="box myth"><div class="tag">${STENCIL}Other traditions · ${m.culture} <i>a parallel, not Scripture · ${m.link2}</i></div><h5>${m.title}</h5><p>${m.body}</p><p class="small">${ext(WIKI(m.link[1]), m.link[0]+' on Wikipedia')}</p></div>`;
const linksRow = (L, label='Read more') => L && L.length ? `<p class="links"><b>${label}</b>${L.map(([l,t])=>ext(WIKI(t),l)).join('')}</p>` : '';
const viewsList = v => `<ul class="views">${['P','H','F','I'].map(k=>`<li class="${k}">${lensGlyph(k)}<b>${LENS[k].name}</b><span>${v[k]}</span></li>`).join('')}</ul>`;
/* content blocks shared by chapter deep-dives and topic pages:
   [heading, html] or {h, html} for prose; {table:[[head...],[row...]...], note}; {art, caption}; {spec...}; {fact}; {myth} */
const tableHTML = (rows, note) => `<div class="tblwrap"><table class="tbl" style="--cols:${rows[0].length}"><thead><tr>${rows[0].map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` + (note ? `<p class="caption">${note}</p>` : '');
const BLOCK = /^\s*<(p|ul|ol|div|table|dl|blockquote)\b/;
function blockHTML(b){
  if(Array.isArray(b)) b = {h:b[0], html:b[1]};
  if(b.spec) return specCard(b);
  if(b.fact) return factCard(b.fact);
  if(b.myth) return mythCard(b.myth);
  if(b.art) return ART[b.art]() + (b.caption ? `<p class="caption">${b.caption}</p>` : '');
  return (b.h ? `<h3>${b.h}</h3>` : '') + (b.html ? (BLOCK.test(b.html) ? b.html : `<p>${b.html}</p>`) : '') + (b.table ? tableHTML(b.table, b.note) : '');
}
const factsBox = f => `<dl class="facts">${f.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const topicChips = ids => `<div class="tchips">${ids.filter(id=>TOP[id]).map(id=>`<button data-go="tp-${id}" style="--kc:var(--k-${TOP[id].kind})"><i></i>${TOP[id].title}</button>`).join('')}</div>`;
const noteLink = n => `<button class="linkish" data-note="${n.id}">${n.title}</button>`;
const typeSwatch = t => `<i style="--c:var(--n-${t})"></i>`;

/* ---------- pages ---------- */
const pages = [];
const page = (id, label, html, cls='') => pages.push({id, label, cls, html});

page('intro','Opening',`
  <div class="cart study">A study scroll</div>
  <h1>The Revelation</h1>
  <p class="hand muted" style="font-size:1.1rem;margin-top:4px">of Jesus Christ, shown to John on Patmos</p>
  ${ART.intro()}
  <p class="lede">Revelation is the last book of the Bible. A man named John wrote it while exiled on the island of Patmos, probably around AD 95 under the emperor Domitian. Some scholars date it earlier, in the late 60s under Nero, and that date matters a lot for the preterist view.</p>
  <p>It is three kinds of writing at once: a <b>letter</b> to seven churches (1:4), a <b>prophecy</b> (1:3), and an <b>apocalypse</b>, a Jewish style of writing that shows heaven's view of earth through symbols. It has 22 chapters and 404 verses. It echoes the Old Testament more than any other New Testament book, yet it never once says "as it is written."</p>
  <h3>How to read this scroll</h3>
  <p>Every chapter has two pages. On the left is a <b>commentary</b> page: a summary, the key verse, literal and symbolic readings, and the four main views. On the right is the <b>text</b> of the chapter itself. On a wide screen you see both at once; on a phone, swipe from one to the next.</p>
  <p>The top row jumps to any chapter. The second row lists <b>topic pages</b>: deep dives on people, places, symbols, words and ideas. When you open a chapter, that row narrows to the topics in that chapter.</p>
  <p>Any Bible reference, like Daniel 7:13 or 13:18, can be clicked to read the verse. References to Revelation can take you straight to the verse in the text.</p>
  <h3>The notes in the text</h3>
  <p class="small">Underlined words in the Plain English text open notes. Point at one for a short preview; click it for the full note with references and links. The color and line style tell you what kind of note it is. Other translations show the same notes as colored dots after the verse number.</p>
  <ul class="types">${Object.entries(NOTE_TYPES).map(([k,t])=>`<li><i style="background:color-mix(in srgb, ${t.color} 18%, transparent)"></i><span><span class="u t-${k}" style="text-decoration-color:${t.color}">${t.label}</span>: ${({word:'mistranslations, manuscript differences and Greek words worth knowing',history:'archaeology, Roman history and the world of the first readers',echo:'where John borrows from the Old Testament and the words of Jesus',symbol:'what an image means and where it comes from',views:'how the main schools of interpretation read the verse',israel:'notes on the church and the nation of Israel',myth:'parallels from other cultures and religions, with a note on whether there is a real link',spec:'my own ideas and new connections, clearly labeled and easy to hide'})[k]}.</span></li>`).join('')}</ul>
  <h3>Today's words</h3>
  <p class="small">Some phrases only made sense to people who lived in John's world. In the Plain English text these carry a small handwritten line underneath, like <span class="gl"><span class="gl-o">remove your lampstand from its place</span><span class="gl-m">shut your church down</span></span>. The line on top is the faithful translation. The line underneath is not a translation at all: it is a loose modern American way to get the same point across. You can hide these with the "Today's words" button in the header.</p>
`);

page('views','Four ways to read',`
  <div class="cart study">Before you begin</div>
  <h2>Four Ways to Read Revelation</h2>
  <p class="lede">Christians have read Revelation four main ways. Each takes the Bible seriously, and each has been held by careful, faithful people. Many readers mix them.</p>
  <ul class="views" style="gap:12px">
    <li class="P">${lensGlyph('P')}<b>Preterist</b><span>From Latin <i>praeter</i>, "past." Most of the book was fulfilled in the first centuries: the fall of Jerusalem in AD 70 and the conflict with pagan Rome. <i>Partial</i> preterists still expect a future return of Christ (chapters 19–22).</span></li>
    <li class="H">${lensGlyph('H')}<b>Historicist</b><span>The book is a coded map of church history from John's day to the end. The standard Protestant view from the Reformation to the 1800s (Luther, Isaac Newton, Matthew Henry).</span></li>
    <li class="F">${lensGlyph('F')}<b>Futurist</b><span>Chapters 4–22 describe events still to come: a tribulation, the Antichrist, Christ's return, and a 1,000-year reign. Most popular American teaching today is a form of this, often dispensational.</span></li>
    <li class="I">${lensGlyph('I')}<b>Idealist</b><span>A symbolic picture of the battle between God and evil in every age, not a timeline. Its roots go back to Augustine. Many modern scholars mix it with other readings.</span></li>
  </ul>
  <p class="small">Use <b>Lens</b> at the top to highlight one view across every chapter.</p>

/* ---------- Bible references become buttons ---------- */
const SKIP = 'a,button,textarea,select,.tbody,.greek,svg,h1,h2,.cart';
function linkify(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (n.parentElement.closest(SKIP) || !/\d/.test(n.nodeValue)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const list = !!node.parentElement.closest('.reflist');
    const prev = node.previousSibling, text = node.nodeValue, refs = findRefs(text, list, prev ? prev.textContent : ''); if(!refs.length) return;
    const frag = document.createDocumentFragment(); let at = 0;
    refs.forEach((r, i) => {
      /* a button is atomic, so a line could break between "(" and the reference: keep brackets with it */
      const lead = text.slice(at, r.start), open = (lead.match(/[(\[“"]$/) || [''])[0];
      const close = (text.slice(r.end, refs[i+1] ? refs[i+1].start : text.length).match(/^[)\]”".,;:]+/) || [''])[0];
      frag.append(lead.slice(0, lead.length - open.length));
      const b = document.createElement('button'); b.className = 'ref' + (r.book==='Revelation'?' rv':'');
      b.dataset.ref = JSON.stringify([r.book,r.c,r.v,r.c2,r.v2]); b.textContent = text.slice(r.start, r.end);
      if(open || close){ const w = document.createElement('span'); w.className = 'nobr'; w.append(open, b, close); frag.append(w); }
      else frag.append(b);
      at = r.end + close.length;
    });
    frag.append(text.slice(at)); node.replaceWith(frag);
  });
}
els.forEach(el => linkify(el));

/* our fonts draw a straight " as a closing quote, so every displayed " becomes “ or ” by what comes before it */
function smartQuotes(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('textarea,script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  /* the characters around a quote are looked up within its block: a new paragraph, cell or chip starts fresh */
  const inline = e => e.classList.contains('ref') || /^(I|B|EM|STRONG|A|SUP|SUB|SMALL)$/.test(e.tagName)
    || (e.tagName === 'SPAN' && (!!e.closest('.gl') || getComputedStyle(e).display.startsWith('inline')));
  const blockOf = n => { let e = n.parentElement; while(e && e !== root && inline(e)) e = e.parentElement; return e; };
  const ns = []; for(let n; (n = walker.nextNode()); ) ns.push({n, v:n.nodeValue, b:blockOf(n)});
  ns.forEach((t, k) => {
    if(!t.v.includes('"')) return;
    const before = k && ns[k-1].b === t.b ? ns[k-1].v : '', after = ns[k+1] && ns[k+1].b === t.b ? ns[k+1].v : '';
    /* opening after a space or bracket, or when a word follows something that is not a letter or closing mark (a verse number: 3"To) */
    t.n.nodeValue = t.v.replace(/"/g, (q, i) => {
      const p = i ? t.v[i-1] : (before.slice(-1) || ' '), x = t.v[i+1] || after[0] || '';
      return /[\s(\[{—–\-\/]/.test(p) || (/[\p{L}\d]/u.test(x) && !/[\p{L}.,!?;:…’'”)\]]/u.test(p)) ? '\u201c' : '\u201d'; });
  });
}
els.forEach(el => smartQuotes(el));

  if(TEXTS[id]) return Promise.resolve(TEXTS[id]);
  return loading[id] = loading[id] || fetch(`text/${id}.json`).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>TEXTS[id]=d);
}
const GLOSS_AT = {}; GLOSSES.forEach(g => (GLOSS_AT[g.v] = GLOSS_AT[g.v] || []).push(g));
/* Plain English verse with note highlights and "today's words" glosses. Both are spans over the verse text;
   a span fully inside another nests in it, and one that partly overlaps an earlier span is dropped. */
function plainVerse(key){
  const t = PV[key], span = (x, k) => { const s = t.indexOf(x.a); return s < 0 ? null : {x, k, s, e:s+x.a.length, kids:[]}; };
  const spans = [...(NOTES_AT[key]||[]).map(n=>span(n,'n')), ...(GLOSS_AT[key]||[]).map(g=>span(g,'g'))].filter(Boolean)
    .sort((a,b) => a.s-b.s || b.e-a.e || (a.k==='g' ? -1 : 1));
  const root = {s:0, e:t.length, kids:[]}, stack = [root];
  spans.forEach(sp => {
    while(sp.s >= stack[stack.length-1].e) stack.pop();
    const top = stack[stack.length-1], prev = top.kids[top.kids.length-1];
    if(sp.e > top.e || (prev && sp.s < prev.e)) return;
    top.kids.push(sp); stack.push(sp);
  });
  /* a gloss box is atomic, so a note's underline can't reach into it; the phrase inside repeats the underline (nt-in) */
  const render = (node, note) => { let out = '', at = node.s;
    node.kids.forEach((c, i) => {
      out += esc(t.slice(at, c.s)); at = c.e;
      const html = wrap(c, render(c, c.k==='n' ? c.x : note), note);
      /* keep punctuation right after a gloss on its line: a gloss box is atomic, so the line could break before it */
      const p = c.k==='g' ? (t.slice(c.e, node.kids[i+1] ? node.kids[i+1].s : node.e).match(/^[.,;:!?"'”’)]+/) || [''])[0] : '';
      out += p ? `<span class="glp">${html}${esc(p)}</span>` : html; at += p.length; });
    return out + esc(t.slice(at, node.e)); };
  const wrap = (c, inner, note) => c.k==='n'
    ? `<span class="nt t-${c.x.type}" role="button" tabindex="0" data-note="${c.x.id}">${inner}</span>`
    : `<span class="gl"><span class="gl-o${note ? ' nt-in t-'+note.type : ''}">${inner}</span><span class="gl-m">${esc(c.x.m)}</span></span>`;
  return render(root);
}
const markers = key => (NOTES_AT[key]||[]).map(n=>`<button class="nm t-${n.type}" data-note="${n.id}" aria-label="${esc(NOTE_TYPES[n.type].label+': '+n.title)}"></button>`).join('');
function verseHTML(ver, key){
  const v = +key.split(':')[1], num = `<span class="vn${v===1?' cv':''}">${v===1?key.split(':')[0]:v}</span>`;
  if(ver==='plain') return `<span class="v" id="v${key.replace(':','-')}">${num}${plainVerse(key)} </span>`;
  const d = TEXTS[ver].verses[key];
  if(ver==='greekwords') return `<span class="v" id="v${key.replace(':','-')}">${num}${markers(key)}${(d||[]).map(([g,gl,lem,str,tr])=>`<span class="gw${tr?' tr':''}" data-gw="${esc(lem+'|'+str+'|'+(tr?'1':''))}"><b>${esc(g)}</b><small>${esc(gl)}</small></span>`).join('')} </span>`;
  const txt = esc(d||'').replace(/\[([^\]]+)\]/g,'<i>$1</i>');
  return `<span class="v" id="v${key.replace(':','-')}">${num}${markers(key)}${txt} </span>`;
}
const TNOTE = {
  kjv:'Words in <i>italics</i> were added by the KJV translators to make the English read smoothly, as in printed KJV Bibles.',
  sblgnt:'SBLGNT © 2010 Society of Biblical Literature and Logos Bible Software. Used under its free license.',
  greekwords:'Greek words and meanings from STEPBible’s TAGNT, Tyndale House, Cambridge, CC BY 4.0. Point at a word for its dictionary form and Strong’s number. Faded words are found only in the Textus Receptus or Byzantine manuscripts, which the KJV follows.',
  plain:'Plain English rendering written for this page from the SBLGNT Greek.'
};
/* One-line glosses: each may run on under the words after its phrase. A gloss that would pass the right edge of the
   column slides left to end at the edge, if that keeps it clear of the gloss before it. Otherwise, where a gloss would
   reach the next gloss or the edge, its phrase box is widened to the gloss's width, which reflows the line; repeat until
   nothing collides. A gloss wider than the whole column wraps. */
function fitGlosses(){
  if(document.body.classList.contains('nogloss')) return;
  const gs = [...document.querySelectorAll('.tbody .gl')], GAP = 8;
  gs.forEach(g => { g.style.minWidth = ''; g.lastChild.style.transform = ''; g.lastChild.classList.remove('wrap'); });
  for(let pass = 0, changed = true; changed && pass < 8; pass++){
    changed = false;
    const m = gs.map(g => { const b = g.getBoundingClientRect(), col = g.parentElement.closest('p').getBoundingClientRect();
      return {g, l:b.left, w:b.width, y:g.lastChild.getBoundingClientRect().top, need:g.lastChild.scrollWidth, L:col.left, R:col.right}; });
    let prevEnd = -Infinity, prevY = null;
    m.forEach((x, i) => {
      if(prevY === null || Math.abs(x.y - prevY) >= 6) prevEnd = -Infinity;
      prevY = x.y;
      let start = x.l, end = x.l + Math.max(x.w, x.need);
      const nx = m[i+1], hitsNext = nx && Math.abs(nx.y - x.y) < 6 && end + GAP > nx.l;
      if(!hitsNext && end > x.R + 1 && x.R - x.need >= prevEnd + GAP && x.need <= x.R - x.L){
        const dx = x.R - end; x.g.lastChild.style.transform = `translateX(${dx}px)`; start += dx; end += dx;
      } else if(x.need > x.w + 1 && (hitsNext || end > x.R + 1)){
        if(x.need > x.R - x.L) x.g.lastChild.classList.add('wrap'); else x.g.style.minWidth = x.need + 'px';
        changed = true;
      }
      prevEnd = end;
    });
    if(changed) gs.forEach(g => g.lastChild.style.transform = '');
  }
}
function renderText(ver){
  const V = VERSIONS.find(x=>x.id===ver);
  document.querySelectorAll('.tbody').forEach(tb => {
    const c = +tb.dataset.ch;
    tb.className = 'tbody' + (ver==='sblgnt'?' greekt':'') + (ver==='greekwords'?' words':'');
    tb.innerHTML = PLAIN[c].map(sec => `<h4>${sec.h}</h4><p>${sec.vs.map(k=>verseHTML(ver,k)).join('')}</p>`).join('')
      + `<p class="textnote">${TNOTE[ver] || (TEXTS[ver].name+'. '+TEXTS[ver].license+'.')}</p>`;

const tsel = $('tsel');
tsel.innerHTML = VERSIONS.map(v=>`<option value="${v.id}">${v.short}</option>`).join('');
async function setVersion(ver){

function visibleVerse(){

/* ---------- layout: snap to spreads of two portrait pages on a landscape desktop ---------- */
const track = $('track');
let spread = false, pw = 600;
const current = {idx:0, ver:'plain'};
function layout(){
  const W = track.clientWidth, H = track.clientHeight;
  const two = Math.min(Math.floor(W/2), Math.floor(H*0.82));
  spread = W > H && two >= 420;
  pw = spread ? two : W;
  const side = spread ? Math.floor((W - 2*pw)/2) : 0;
  document.documentElement.style.setProperty('--pw', pw+'px');
  document.documentElement.style.setProperty('--side', side+'px');
  document.body.classList.toggle('spread', spread);
  track.scrollLeft = firstOf(current.idx) * pw;
  if(current.ver==='plain') fitGlosses();
  document.querySelectorAll('.tblwrap').forEach(tableEdge);
}
/* a table wider than its page scrolls sideways; fade its right edge until the reader reaches the end */
function tableEdge(w){ w.classList.toggle('more', w.scrollLeft + w.clientWidth < w.scrollWidth - 2); }
document.addEventListener('scroll', e => { if(e.target.classList && e.target.classList.contains('tblwrap')) tableEdge(e.target); }, true);
const firstOf = i => spread ? i - (i % 2) : i;
const step = () => spread ? 2 : 1;
function scrollToIdx(i, smooth=true){
  i = Math.max(0, Math.min(els.length-1, i));
  const far = Math.abs(firstOf(i) - firstOf(current.idx)) > 6;
  track.scrollTo({left: firstOf(i) * pw, behavior: (reduce || far || !smooth) ? 'auto' : 'smooth'});
}

/* back pill after a long jump */
const backBtn = $('back'); const backStack = [];
function remember(){ const i = firstOf(current.idx); backStack.push({i, tops:[els[i].scrollTop, els[i+1] ? els[i+1].scrollTop : 0]}); if(backStack.length>20) backStack.shift(); showBack(); }
function showBack(){ const b = backStack[backStack.length-1]; backBtn.hidden = !b; if(b) backBtn.textContent = '← Back to ' + shortLabel(b.i); }
backBtn.onclick = () => { const b = backStack.pop(); if(!b) return; scrollToIdx(b.i, false); els[b.i].scrollTop = b.tops[0]; if(els[b.i+1]) els[b.i+1].scrollTop = b.tops[1]; showBack(); };
const shortLabel = i => { const id = pages[i].id; return /^[ct]\d/.test(id) ? 'chapter '+id.slice(1) : pages[i].label; };

function go(id, push=true){
  const i = IDX[id]; if(i===undefined) return;
  if(push && Math.abs(firstOf(i) - firstOf(current.idx)) > 2) remember();
  scrollToIdx(i);
  return i;
}
function goVerse(key){
  const c = key.split(':')[0], i = IDX['t'+c];
  if(Math.abs(firstOf(i) - firstOf(current.idx)) > 0) remember();
  scrollToIdx(i);
  const p = els[i], v = $('v'+key.replace(':','-')); if(!v) return;
  p.scrollTo({top: Math.max(0, v.offsetTop - 110), behavior: reduce ? 'auto' : 'smooth'});
  v.classList.remove('flash'); void v.offsetWidth; v.classList.add('flash');
  setTimeout(() => v.classList.remove('flash'), 1800);
}

/* ---------- navigation rows ---------- */
const chapNav = $('chapNav'), topicNav = $('topicNav'), where = $('where');
chapNav.innerHTML = `<button data-go="intro" title="Opening">✦</button><button data-go="views" class="study">4 views</button><button data-go="keys" class="study">keys</button><button data-go="about" class="study">texts</button><span class="sep"></span>`
  + CHAPTERS.map(c=>`<button data-go="c${c.n}" data-ch="${c.n}" title="Revelation ${c.n}: ${esc(c.title)}">${c.n}</button>`).join('')
  + `<span class="sep"></span>` + [['beasts','beasts'],['israel','church & Israel'],['words','translation watch'],['ideas','Claude’s theories'],['mythos','other traditions'],['sources','sources'],['art','art & prompts'],['topics','all topics']].map(([id,l])=>`<button data-go="${id}" class="study">${l}</button>`).join('');
let topicFilter = null, allFor = null;
function renderTopicNav(){
  const ids = topicFilter ? CH_TOPICS[topicFilter] : TLIST.map(t=>t.id);
  const here = pages[current.idx] && pages[current.idx].id;
  topicNav.innerHTML = (topicFilter ? `<span class="lbl">Topics in chapter ${topicFilter}</span><button class="all" data-alltopics>show all ${TLIST.length}</button>` : `<span class="lbl">All ${TLIST.length} topics</span>`)
    + ids.filter(id=>TOP[id]).map(id=>`<button class="tchip${'tp-'+id===here?' on':''}" data-go="tp-${id}" style="--kc:var(--k-${TOP[id].kind})"><i></i>${TOP[id].title}</button>`).join('');

const chapterOf = i => { const m = pages[i] && pages[i].id.match(/^[ct](\d+)$/); return m ? +m[1] : null; };
function sync(){
  const i = Math.round(track.scrollLeft / pw), first = firstOf(i);
  if(first === firstOf(current.idx) && sync.done) return; sync.done = true;
  current.idx = first;
  const a = pages[first], b = spread ? pages[first+1] : null, ch = chapterOf(first);
  where.textContent = ch ? `Revelation ${ch}: ${CHAPTERS[ch-1].title}` : (b ? `${a.label} · ${b.label}` : a.label);

  const on = chapNav.querySelector('button.on'); if(on) chapNav.scrollTo({left: on.offsetLeft - chapNav.clientWidth/2 + on.clientWidth/2});
  if(ch && ch !== topicFilter && ch !== allFor){ topicFilter = ch; allFor = null; renderTopicNav(); }
  else topicNav.querySelectorAll('.tchip').forEach(x => x.classList.toggle('on', x.dataset.go === a.id || (b && x.dataset.go === b.id)));

let raf = 0; track.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(sync); }, {passive:true});
$('prev').onclick = () => scrollToIdx(current.idx - step());
$('next').onclick = () => scrollToIdx(current.idx + step());
document.addEventListener('keydown', e => {
  if(!$('modal').hidden){ if(e.key==='Escape') closeModal(); return; }
  if((e.key==='Enter' || e.key===' ') && e.target.matches('span[role="button"]')){ e.preventDefault(); e.target.click(); return; }
  if(e.target.closest('textarea,input,select')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); $('next').click(); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); $('prev').click(); }
});
/* a vertical wheel reads down a page; at the bottom (or top) it turns to the next (or previous) spread */
let wheelAcc = 0, wheelLock = 0;
track.addEventListener('wheel', e => {
  if(Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.ctrlKey) return;
  const p = e.target.closest('.page');
  if(p){ const canDown = p.scrollTop + p.clientHeight < p.scrollHeight - 2, canUp = p.scrollTop > 0;
    if((e.deltaY>0 && canDown) || (e.deltaY<0 && canUp)) { wheelAcc = 0; return; } }
  e.preventDefault();
  if(performance.now() < wheelLock) return;
  wheelAcc += e.deltaY * (e.deltaMode===1 ? 32 : 1);
  if(Math.abs(wheelAcc) > 60){ scrollToIdx(current.idx + Math.sign(wheelAcc)*step()); wheelAcc = 0; wheelLock = performance.now() + 650; }
}, {passive:false});

  if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault(); row.scrollLeft += e.deltaY * (e.deltaMode===1 ? 32 : 1);
}, {passive:false}));

/* ---------- tooltip ---------- */
const tip = $('tip');
function tipFor(el){
  if(el.dataset.note){ const n = NOTES[el.dataset.note], t = NOTE_TYPES[n.type];
    return {c:t.color, html:`<span class="tt"><i></i>${t.label}${n.kind?' · '+KIND[n.kind]:''}</span><b>${n.title}</b>${esc(n.p||'')}`}; }
  if(el.dataset.ref){ const r = parseRefData(el.dataset.ref), keys = verseKeys(r);
    const first = keys.length ? verseText(keys[0]) : null;
    if(first === undefined) loadRefDB().then(() => { if(tip.dataset.for === el.dataset.ref && !tip.hidden) showTip(el); });
    const txt = first ? `${esc(first.slice(0,180))}${first.length>180||keys.length>1?'…':''}` : (first===undefined ? 'Loading…' : 'Click to read on Bible Gateway');
    return {c:'var(--lapis)', html:`<b>${refLabel(r)}</b>${txt}`}; }
  if(el.dataset.gw){ const [lem,str,tr] = el.dataset.gw.split('|');
    return {c:'var(--ochre)', html:`<span class="gk">${esc(lem)}</span>${str?`<span class="small">Strong’s ${esc(str)}</span>`:''}${tr?'<br><span class="small">Only in the Textus Receptus or Byzantine text</span>':''}`}; }
}
function showTip(el){
  const d = tipFor(el); if(!d) return;
  tip.style.setProperty('--c', d.c); tip.innerHTML = d.html; smartQuotes(tip); tip.hidden = false; tip.dataset.for = el.dataset.ref || el.dataset.note || '';

  let x = Math.min(Math.max(8, r.left + r.width/2 - tw/2), innerWidth - tw - 8), y = r.top - th - 8;
  if(y < 8) y = r.bottom + 8;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
const hideTip = () => { tip.hidden = true; };
const TIPS = '[data-note],[data-ref],[data-gw]';
if(matchMedia('(hover:hover)').matches){
  document.addEventListener('pointerover', e => { const el = e.target.closest(TIPS); if(el && !el.closest('.modal')) showTip(el); });
  document.addEventListener('pointerout', e => { const el = e.target.closest(TIPS); if(el && !el.contains(e.relatedTarget)) hideTip(); });
}
document.addEventListener('focusin', e => { const el = e.target.closest(TIPS); if(el && !el.closest('.modal')) showTip(el); else hideTip(); });
track.addEventListener('scroll', hideTip, {passive:true, capture:true});

/* ---------- references: verse lookups ---------- */
let REFDB = null, refdbLoading = null;
const loadRefDB = () => REFDB ? Promise.resolve(REFDB) : (refdbLoading = refdbLoading || fetch('text/refs.json').then(r=>r.json()).then(d=>REFDB=d));
const parseRefData = s => { const [book,c,v,c2,v2] = JSON.parse(s); return {book,c,v,c2,v2}; };
const refLabel = r => `${r.book} ${r.c}${r.v?':'+r.v:''}${r.c2?'–'+r.c2+(r.v2?':'+r.v2:''):r.v2?'–'+r.v2:''}`;
const vcount = (book, c) => book==='Revelation' ? REV_VC[c-1] : (REFDB && REFDB.vc[book] ? REFDB.vc[book][c-1] : 0);
function verseKeys(r){
  if(r.book==='Revelation') return refVerses(r, vcount, 40);
  if(!REFDB) return r.v ? [`${r.book} ${r.c}:${r.v}`] : [];
  return refVerses(r, vcount, 40);
}
/* undefined = not loaded yet, null = not available */
function verseText(key){
  if(key.startsWith('Revelation ')) return PV[key.slice(11)] || null;
  if(!REFDB) return undefined;
  const e = REFDB.v[key]; return e ? e[0] : null;
}

/* ---------- modal ---------- */
const modal = $('modal'), mbody = $('mbody'), mtype = $('mtype'), mback = $('mback');
let mstack = [], lastFocus = null;
function openModal(view, push=false){
  if(modal.hidden){ lastFocus = document.activeElement; mstack = []; }
  else if(push && mstack.length) {}
  if(!push) mstack = [];
  mstack.push(view);
  renderModal();
}
function renderModal(){
  const view = mstack[mstack.length-1];
  const d = view.kind === 'note' ? noteView(view.id) : refView(view.r);
  modal.querySelector('.mbox').style.setProperty('--c', d.c);
  mtype.innerHTML = d.type; mbody.innerHTML = d.html; linkify(mbody); smartQuotes(mbody);
  mback.hidden = mstack.length < 2;
  modal.hidden = false; hideTip(); mbody.scrollTop = 0;
  $('mclose').focus({preventScroll:true});
  if(d.after) d.after();
}
function closeModal(){ modal.hidden = true; mstack = []; if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
$('mclose').onclick = closeModal;
mback.onclick = () => { mstack.pop(); renderModal(); };
modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
modal.addEventListener('keydown', e => {
  if(e.key !== 'Tab') return;
  const f = [...modal.querySelectorAll('button:not([hidden]),a[href]')].filter(x=>x.offsetParent);
  if(!f.length) return; const a = f[0], z = f[f.length-1];
  if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
  else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
});

function noteView(id){
  const n = NOTES[id], t = NOTE_TYPES[n.type];
  let h = `<h3 id="mtitle">${n.title}</h3>`;
  h += `<div class="quote">"${esc(n.a)}" <span class="small">(Revelation ${n.v}, Plain English)</span></div>`;
  if(n.greek) h += `<div class="gk">${n.greek}</div>`;
  if(n.type==='spec') h += `<p class="spec-note">This is my own idea, offered for you to test. It is not established scholarship.</p>`;
  h += `<p>${n.body}</p>`;
  if(n.r) h += `<p class="small reflist"><b style="font-family:var(--f-display);font-weight:400;letter-spacing:.05em">References</b> · ${n.r}</p>`;
  h += linksRow(n.l, 'Further reading');
  if(n.s && n.s.length) h += `<p class="small" style="margin-top:10px"><b style="font-family:var(--f-display);font-weight:400">Sources</b></p><ul class="srcs">${n.s.map(s=>`<li>${SRC[s]}</li>`).join('')}</ul>`;
  h += `<div class="acts"><button class="pill" data-verse="${n.v}">Go to ${n.v} in the text</button>${n.top&&TOP[n.top]?`<button class="pill" data-go="tp-${n.top}" style="border-color:var(--k-${TOP[n.top].kind})">Topic: ${TOP[n.top].title}</button>`:''}${n.w?`<button class="pill" data-go="words">Translation watch</button>`:''}${ext(bgURL('Revelation '+n.v,'NIV;ESV;KJV;NASB'),'Compare translations ↗','pill')}</div>`;
  return {c:t.color, type:`<i></i>${t.label}${n.kind?` <span class="kindb k-${n.kind}">${KIND[n.kind]}</span>`:''}`, html:h};
}
function refView(r){
  const label = refLabel(r), rev = r.book === 'Revelation';
  const keys = verseKeys(r);
  let h = `<h3 id="mtitle">${label}</h3>`, after = null;
  if(rev){
    h += keys.map(k=>`<p class="vrow"><span class="vn">${k.split(':')[1]}</span>${esc(PV[k.slice(11)]||'')}</p>`).join('');
    h += `<p class="small muted">Plain English. Notes on ${keys.length>1?'these verses':'this verse'}: ${keys.flatMap(k=>NOTES_AT[k.slice(11)]||[]).map(n=>noteLink(n)).join(', ') || 'none'}.</p>`;
    h += `<div class="acts"><button class="pill" data-verse="${r.c}:${r.v||1}">Go to ${r.c}:${r.v||1} in the text</button><button class="pill" data-go="c${r.c}">Chapter ${r.c} commentary</button>${ext(bgURL(label,'NIV'),'Read in the NIV on Bible Gateway ↗','pill')}</div>`;
  } else if(!REFDB){
    h += `<p class="muted">Loading the verse…</p>`;
    after = () => loadRefDB().then(() => { if(!modal.hidden && mstack[mstack.length-1].r === r) renderModal(); }, () => { mbody.querySelector('p.muted').textContent = 'The verse text could not be loaded. Use the Bible Gateway link below.'; });
    h += `<div class="acts">${ext(bgURL(label,'NIV'),'Read in the NIV on Bible Gateway ↗','pill')}</div>`;
  } else {
    const have = keys.filter(k=>REFDB.v[k]);
    if(have.length){
      h += `<div class="vlab">World English Bible</div>` + have.map(k=>`<p class="vrow"><span class="vn">${k.split(':')[1]}</span>${esc(REFDB.v[k][0])}</p>`).join('');
      h += `<div class="vlab">King James Version</div>` + have.map(k=>`<p class="vrow"><span class="vn">${k.split(':')[1]}</span>${esc(REFDB.v[k][1]).replace(/\[([^\]]+)\]/g,'<i>$1</i>')}</p>`).join('');
      if(keys.length >= 40) h += `<p class="small muted">The passage continues on Bible Gateway.</p>`;
    } else h += `<p class="muted">This passage is not stored on the page. Read it on Bible Gateway.</p>`;
    h += `<div class="acts">${ext(bgURL(label,'NIV'),'Read in the NIV ↗','pill')}${ext(bgURL(label,'NIV;ESV;KJV;NASB'),'Compare four translations ↗','pill')}</div>`;
  }
  return {c:rev?'var(--red)':'var(--lapis)', type:rev?'Scripture · Revelation':'Scripture', html:h, after};
}

/* ---------- clicks ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const note = t.closest('[data-note]'); if(note){ openModal({kind:'note', id:+note.dataset.note}, !modal.hidden); return; }
  const ref = t.closest('[data-ref]'); if(ref){ openModal({kind:'ref', r:parseRefData(ref.dataset.ref)}, !modal.hidden); return; }
  const vb = t.closest('[data-verse]'); if(vb){ if(!modal.hidden) closeModal(); goVerse(vb.dataset.verse); return; }
  const g = t.closest('[data-go]'); if(g){ if(!modal.hidden) closeModal(); go(g.dataset.go); return; }
  if(t.closest('[data-alltopics]')){ allFor = topicFilter; topicFilter = null; renderTopicNav(); return; }
  const nt = t.closest('[data-ntype]'); if(nt){ toggleType(nt.dataset.ntype); return; }
  const c = t.closest('[data-copy]'); if(c){ const ta = $(c.dataset.copy);
    const done = () => { c.textContent = 'Copied'; setTimeout(()=>c.textContent='Copy prompt',1600); };
    const fallback = () => { ta.focus(); ta.select(); c.textContent = 'Selected: press Ctrl/⌘+C'; };
    try{ navigator.clipboard.writeText(ta.value).then(done, fallback); }catch(_){ fallback(); } }
});
let whereTimer = 0;
function flashWhere(msg){ const old = where.textContent; where.textContent = msg; clearTimeout(whereTimer); whereTimer = setTimeout(()=>{ sync.done=false; sync(); }, 4000); }

/* ---------- note types, lenses, theories ---------- */
const hidden = new Set((store.get('rev-hide')||'').split(',').filter(k=>NOTE_TYPES[k]));
function applyTypes(){
  Object.keys(NOTE_TYPES).forEach(k => { if(k!=='spec') document.body.classList.toggle('hide-'+k, hidden.has(k)); });
  document.querySelectorAll('[data-ntype]').forEach(b => b.setAttribute('aria-pressed', String(!hidden.has(b.dataset.ntype))));
  store.set('rev-hide', [...hidden].join(','));
}
function toggleType(k){ if(k==='spec'){ setSpec(false); return; } hidden.has(k) ? hidden.delete(k) : hidden.add(k); applyTypes(); }
const lensBox = $('lenses');
lensBox.insertAdjacentHTML('beforeend', `<button class="chip" data-lens="" aria-pressed="true">All views</button>` + ['P','H','F','I'].map(k=>`<button class="chip" data-lens="${k}" aria-pressed="false">${lensGlyph(k,12)}${LENS[k].name}</button>`).join(''));
function setLens(k){
  if(k) document.body.dataset.lens = k; else delete document.body.dataset.lens;
  lensBox.querySelectorAll('[data-lens]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lens===k)));
  store.set('rev-lens', k);
}
lensBox.addEventListener('click', e => { const b = e.target.closest('[data-lens]'); if(b) setLens(b.dataset.lens); });
const specBtn = $('specToggle');
function setSpec(on){ document.body.classList.toggle('nospec', !on); specBtn.setAttribute('aria-pressed', String(on)); specBtn.textContent = on ? "Claude's theories shown" : "Claude's theories hidden"; store.set('rev-spec', on?'1':'0'); }
specBtn.onclick = () => setSpec(document.body.classList.contains('nospec'));
const glossBtn = $('glossToggle');
function setGloss(on){ document.body.classList.toggle('nogloss', !on); glossBtn.setAttribute('aria-pressed', String(on)); glossBtn.textContent = on ? "Today's words shown" : "Today's words hidden"; store.set('rev-gloss', on?'1':'0'); if(on) fitGlosses(); }
glossBtn.onclick = () => setGloss(document.body.classList.contains('nogloss'));

/* ---------- start ---------- */
setLens(store.get('rev-lens')||''); setSpec(store.get('rev-spec')!=='0'); setGloss(store.get('rev-gloss')!=='0');
renderText('plain'); applyTypes(); renderTopicNav();
layout(); addEventListener('resize', () => { hideTip(); layout(); });
document.fonts.ready.then(() => { if(current.ver==='plain') fitGlosses(); });
const hash = location.hash.slice(1);
if(hash && IDX[hash] !== undefined){ current.idx = IDX[hash]; layout(); }
sync();
const savedVer = store.get('rev-ver'); if(savedVer && savedVer !== 'plain' && VERSIONS.some(v=>v.id===savedVer)) setVersion(savedVer);

</script>
