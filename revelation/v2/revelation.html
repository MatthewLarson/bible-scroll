/* a topic page for the second death */
TP({id:'second-death', kind:'Words', title:'The Second Death', ch:[2,20,21],
 lead:`An odd, ominous phrase found only in Revelation (2:11; 20:6; 20:14; 21:8), defined as "the lake of fire."`,
 sections:[
  ['Where the phrase came from',`The Aramaic Targums, the synagogue paraphrases of Scripture, use "the second death" for final judgment: "Let Reuben live, and not die the second death" (Targum Onkelos on Deuteronomy 33:6). The Targum of Jeremiah 51:39, 57 uses it of Babylon's rulers, who "will not live in the world to come."`],
  ['First a comfort',`Its first use is a promise to the suffering church in Smyrna: "The one who wins the victory will not be harmed by the second death" (2:11). Rome can cause the first death, not the second (Matthew 10:28).`],
  ['Paired with the first resurrection',`"The second death has no power over" those who share in the first resurrection (20:6). Augustine: a first resurrection of the soul now and of the body later; a first death of the body and a second, final death. "Born once, die twice; born twice, die once."`],
  {h:'Three ways Christians have understood it', table:[['View','The second death is','Key texts','Held by'],['Eternal conscious punishment','Unending, conscious separation from God','14:11; 20:10; Matthew 25:46','Augustine, Aquinas, Calvin, most churches through history'],['Conditional immortality','Final destruction: the wicked cease to exist','Matthew 10:28; 2 Thessalonians 1:9; "death" taken at its word','John Stott (tentatively), Edward Fudge, Seventh-day Adventists'],['Hopeful universalism','A purifying fire that may finally restore everyone','21:24–25; 1 Corinthians 15:28; Colossians 1:20','Gregory of Nyssa, some modern writers']]},
  ['Death dies',`Death and Hades are themselves thrown into the lake (20:14), and then "there will be no more death" (21:4). Paul: "The last enemy to be destroyed is death" (1 Corinthians 15:26).`]],
 common:[`The second death is eternal conscious punishment, separation from God felt forever.`],
 uncommon:[`It is final destruction, the end of existence (conditional immortality).`,`It is a purifying fire that may in the end restore all (hopeful universalism), a minority view.`],
 links:[['Second death','Second death'],['Targum Onkelos','Targum Onkelos'],['Annihilationism','Annihilationism'],['Christian universalism','Christian universalism']],
 sources:['koester','aune','beale','augustine']});

/* notes for 21:8 and the city */
N('2:11','will not be harmed by the second death','symbol',{t:'The second death, first as a promise', p:'Said first to martyrs: Rome can cause the first death, not the second.', b:`The phrase "second death" was used in the Aramaic Targums for final exclusion from the world to come. Its first use in Revelation comforts a church facing prison and death (2:10). The first death is not the one to fear (Matthew 10:28). See chapter 21 for more.`, r:'20:6; 20:14; 21:8; Matthew 10:28', top:'second-death'});
N('21:8','the cowardly, the unfaithful','word',{t:'The list starts with believers who give up', greek:'δειλοῖς καὶ ἀπίστοις (deilois kai apistois)', p:'"Cowardly" and "faithless" come first, before murderers: a warning to the church.', b:`<i>Deiloi</i> means cowards, those who shrink back under pressure; <i>apistoi</i> means faithless or unfaithful. In a book written to persecuted churches, these are people who deny Jesus to save themselves, the opposite of Antipas, who "did not deny" (2:13), and of the martyrs who "did not love their lives" (12:11). The verse is the dark twin of 21:7, "the one who wins the victory will inherit all this." Jesus: "Whoever denies me before others, I will deny" (Matthew 10:33).`, r:'21:7; 2:13; 12:11; Matthew 10:32–33; Hebrews 10:38–39', top:'overcomer'});
N('21:8','will have their place','word',{t:'"Their part" means "their share"', greek:'τὸ μέρος αὐτῶν (to meros autōn)', p:'An inheritance word. Everyone receives a share; the verse asks which one.', b:`<i>Meros</i> means a portion or share, as in dividing an inheritance. Revelation uses it for those who have "a share in the first resurrection," over whom "the second death has no power" (20:6), and for a "share in the tree of life" (22:19). Verse 7 promises the faithful an inheritance; verse 8 names the other share.`, r:'20:6; 22:19; 21:7', top:'second-death'});
N('21:8','the lake that burns with fire and sulfur','views',{t:'Does this verse cancel forgiveness?', p:'No. It describes people who refuse the cure that is offered free in the verses on either side.', b:`Paul gives a similar list and then says, "And that is what some of you were. But you were washed" (1 Corinthians 6:9–11). Revelation's version of washing is "they washed their robes... in the blood of the Lamb" (7:14; 22:14). The free water of life is offered in 21:6, just before this verse, and again in 22:17. Even "Jezebel" was given time to repent (2:21). The people outside the city are not those who once sinned, but those who keep refusing to be washed (22:14–15). The chapter 21 page has a fuller discussion, including what "hell" does and doesn't mean in Revelation.`, r:'1 Corinthians 6:9–11; 7:14; 21:6; 22:14–15; 22:17; 2:21', top:'lake-of-fire'});
N('21:8','This is the second death','history',{t:'"The second death" in Jewish tradition', p:'The synagogue paraphrases used it for final exclusion from the world to come.', b:`The Aramaic Targums read in synagogues use "the second death" for final judgment after physical death. Targum Onkelos on Deuteronomy 33:6: "Let Reuben live, and not die the second death." The Targum of Jeremiah 51:39, 57 says Babylon's rulers "will die the second death and not live in the world to come." Revelation defines it: "the lake of fire is the second death" (20:14).`, r:'20:14; 20:6; 2:11', l:[['Second death','Second death'],['Targum','Targum']], top:'second-death', s:['aune','koester']});
N('21:2','coming down out of heaven from God','spec',{t:'Babel built up; Jerusalem comes down', p:'People tried to build a city up to heaven. God sends one down.', b:`At Babel people said, "Let us build ourselves a city, with a tower that reaches to the heavens, so that we may make a name for ourselves" (Genesis 11:4). The new Jerusalem is not built from below. It comes down "from God," and its citizens carry God's name, not their own (22:4). The fourfold list of "every tribe, language, people and nation" also undoes Babel's scattering. Others have noted the Babel contrast; I think it is the key to why the descent is mentioned twice (21:2, 10).`, r:'Genesis 11:4–9; 21:10; 22:4; 3:12; Hebrews 11:10', top:'new-jerusalem'});
N('21:10','a huge, high mountain','echo',{t:'Seen from a mountain', p:'Ezekiel saw his temple city from a very high mountain. John saw Babylon from a wilderness.', b:`"In visions of God he took me to the land of Israel and set me on a very high mountain, on whose south side were some buildings that looked like a city" (Ezekiel 40:2). Isaiah 2:2: the mountain of the LORD's house raised above the hills. John was carried "into a wilderness" to see Babylon (17:3); he is carried to a mountain to see the bride.`, r:'Ezekiel 40:2; Isaiah 2:2; 17:3', top:'new-jerusalem'});
N('21:11','like jasper','symbol',{t:'Shining like God himself', p:'The one on the throne "shone like jasper" (4:3).', b:`Jasper is the first stone named for God's appearance (4:3), the wall's material (21:18), and the first foundation (21:19). The city "shone with the glory of God": it reflects the one who lives in it. Ancient jasper may have meant a clear, bright stone rather than the opaque jasper of today.`, r:'4:3; 21:18; 21:19; Isaiah 60:1–2'});
N('21:13','three gates on the east','echo',{t:'Israel’s camp, and Ezekiel’s city', p:'Israel camped around the tabernacle three tribes to a side.', b:`Numbers 2 arranges the twelve tribes around the tabernacle, three on each side. Ezekiel's city has twelve gates named for the tribes, three on each side, and is named "The LORD is there" (Ezekiel 48:30–35). A Dead Sea Scrolls text, the "Description of the New Jerusalem," also imagines a measured city with twelve tribal gates.`, r:'Numbers 2:1–34; Ezekiel 48:30–35', l:[['New Jerusalem (Dead Sea Scrolls)','New Jerusalem Scroll']], top:'twelve-tribes'});
N('21:15','a gold measuring rod','echo',{t:'Measured means claimed', p:'In the prophets, measuring a place means God protects it.', b:`Ezekiel's guide measures the temple with a rod (Ezekiel 40:3). Zechariah sees a man measure Jerusalem, and God promises to be "a wall of fire around it" (Zechariah 2:1–5). John measured the temple in 11:1 and left the outer court to be trampled. Now everything is measured, and nothing is left outside the protection.`, r:'Ezekiel 40:3; Zechariah 2:1–5; 11:1–2', top:'temple'});
N('21:16','The city was laid out as a square','history',{t:'Square cities', p:'Herodotus described ancient Babylon as a perfect square with a river through it.', b:`Herodotus (<i>Histories</i> 1.178–180) said Babylon was a square, 120 stadia on each side, with a vast wall, a hundred bronze gates, and the Euphrates flowing through the middle. Ezekiel's city is a square too (Ezekiel 48:16). John's city is square in plan and a cube in height, like the Most Holy Place (1 Kings 6:20). See Claude's theory on the chapter page.`, r:'Ezekiel 48:16; 1 Kings 6:20; 22:1', top:'new-jerusalem'});
N('21:17','by human measurement, which the angel was using','views',{t:'A hint to read the numbers?', p:'144 cubits is a tiny wall for a city 1,400 miles high. Both numbers are built on twelve.', b:`144 = 12 × 12, and 12,000 = 12 × 1,000. As a building, a 216-foot wall around a 1,400-mile-high city makes little sense, so many readers see the numbers as meaning more than blueprints. Literal readers take both as real measures (the wall may be its thickness). "Human measurement, which the angel was using" may mean the angel's figures are given in our units so we can grasp them.`, r:'7:4; 21:12–14', top:'sevens'});
N('21:18','pure gold, as clear as glass','history',{t:'A city made of the Holy of Holies’ lining', p:'Solomon overlaid the Most Holy Place with pure gold.', b:`"He overlaid the inside with pure gold" (1 Kings 6:20–22). The whole city is made of what used to line God's private room. In the Roman world glass was a luxury, and perfectly clear glass was rare. Gold you can see through is not a real metal; it is a picture of perfect purity with nothing hidden.`, r:'1 Kings 6:20–22; 21:21', top:'temple'});
N('21:21','The twelve gates were twelve pearls','history',{t:'Pearl gates', p:'Pliny said pearls held "the highest rank among all valuables." A rabbinic legend has huge single gems as Jerusalem’s gates.', b:`Pliny the Elder (<i>Natural History</i> 9.106) ranked pearls above every other valuable. A later tradition in the Babylonian Talmud (<i>Bava Batra</i> 75a) says God will set gems 30 cubits across in Jerusalem's gates. Isaiah 54:12 promises "gates of sparkling jewels." Babylon's merchants lost their pearls (18:12, 16); here pearls are the way in.`, r:'Isaiah 54:12; 18:12; 18:16; Matthew 13:45–46', top:'gems'});
N('21:21','The main street of the city was pure gold','history',{t:'The main street', p:'Cities in Asia were built around one grand colonnaded street.', b:`Greek and Roman cities had a main street (<i>plateia</i>, the word used here), often paved in marble and lined with columns. Ephesus's Arcadian Way ran from the theater to the harbor. This city's one street is gold, and the river of life flows down its middle (22:1–2).`, r:'22:1–2', top:'new-jerusalem'});
N('21:25','Its gates will never be shut by day','history',{t:'Gates that never close', p:'Ancient cities shut their gates every night. This one has no night and no enemies.', b:`City gates were locked at night against raiders and opened by day for trade (Nehemiah 7:3; 13:19). Isaiah 60:11: "Your gates will always stand open, they will never be shut, day or night, so that people may bring you the wealth of the nations." With no night and no enemy, the wall marks belonging, not defense.`, r:'Isaiah 60:11; Nehemiah 7:3; 21:24; 21:26', top:'new-jerusalem'});
N('21:27','only those whose names are written in the Lamb\'s book of life','israel',{t:'Who gets in', p:'The entry list belongs to the Lamb, which is the answer to 21:8.', b:`"Nothing unclean will ever enter" quotes Isaiah 52:1, a promise to Zion. Entry is decided by one register, "the Lamb's book of life," the book of the one who was slaughtered to buy people "from every tribe, language, people, and nation" (5:9). Israel's promise is kept, and its gates are opened to the nations.`, r:'Isaiah 52:1; 5:9; 13:8; 3:5; 20:15', top:'book-of-life'});

c18.deep = [
 {h:'Babylon’s names in Revelation', html:`
  <p>Revelation uses "Babylon" by name six times (14:8; 16:19; 17:5; 18:2; 18:10; 18:21). It also gives her a cluster of other names and titles, each with its own source:</p>

 {art:'babylonmap', caption:'Drawn from real coordinates. Babylon lay on the Euphrates about 55 miles south of modern Baghdad, some 550 miles east of Jerusalem in a straight line, and much farther by the road the exiles walked around the desert. Rome is about 1,400 miles west of Jerusalem.'},
 {h:'The real Babylon', html:`
  <p>Babylon stood on the Euphrates in what is now Iraq, near the modern town of Hillah. In Hebrew it is <i>Bavel</i>, the same word as Babel in Genesis 11. Its own people called it <i>Bāb-ili</i>, "gate of the god." Genesis puns on it with <i>bālal</i>, "confuse" (Genesis 11:9).</p>
  <ul>
   <li><b>About 1750 BC</b>: King Hammurabi makes Babylon a great power and issues his famous law code.</li>
   <li><b>605–562 BC</b>: Nebuchadnezzar II rebuilds the city in glory: the blue-glazed Ishtar Gate, the great ziggurat Etemenanki (often linked to the Tower of Babel), and, by tradition, the Hanging Gardens.</li>
   <li><b>586 BC</b>: his army burns Jerusalem and Solomon's temple and takes the people into exile (2 Kings 25). Psalm 137: "By the rivers of Babylon we sat and wept."</li>
   <li><b>539 BC</b>: the city falls to Cyrus of Persia in a single night (Daniel 5), and the exiles may go home (Ezra 1).</li>
   <li><b>After 300 BC</b>: the Seleucid kings build a new capital nearby, and Babylon slowly empties. By John's day it was mostly ruins. The geographer Strabo, quoting a poet, said "the great city is a great desert" (<i>Geography</i> 16.1.5).</li>
   <li><b>Today</b>: Saddam Hussein rebuilt parts of the palace in the 1980s, stamping bricks with his name like Nebuchadnezzar. The ruins became a UNESCO World Heritage Site in 2019.</li>
  </ul>
  <p>So when Revelation was written, Babylon on the Euphrates was not a world power. John's readers would have heard the name the way we might hear "Waterloo" or "Pharaoh": a famous past standing for something present.</p>`},
 {h:'Place, symbol, or ideal?', html:`
  <p>All three, depending on the reader. The main identifications:</p>
  <div class="card"><h4>Rome</h4><p>The view of most scholars, ancient and modern. She sits on seven hills (17:9), rules "over the kings of the earth" (17:18), and grows rich by sea trade (18:17–19). After Rome destroyed the second temple in AD 70, Jewish and Christian writers called Rome "Babylon," because it had done what Babylon did (1 Peter 5:13; 4 Ezra 3:1–2, 28; 2 Baruch 11:1; Sibylline Oracles 5.143, 159).</p></div>
  <div class="card"><h4>Jerusalem</h4><p>Held by many preterists (e.g. Kenneth Gentry, David Chilton). "The great city" is "where their Lord was crucified" (11:8); "in her was found the blood of prophets" (18:24) echoes Jesus's words to Jerusalem (Matthew 23:35–37); and the prophets often called Jerusalem a prostitute (see below).</p></div>
  <div class="card"><h4>A rebuilt city on the Euphrates</h4><p>Some futurists expect a literal Babylon to rise again in Iraq, since Isaiah 13:19–20 and Jeremiah 50–51 say it will be destroyed and never inhabited again. Charles Dyer's <i>The Rise of Babylon</i> (1991) made this popular during Saddam's rebuilding.</p></div>
  <div class="card"><h4>Papal Rome</h4><p>The standard Protestant reading from the Reformation to the 1800s (see "Has the church been called Babylon?" below).</p></div>
  <div class="card"><h4>Other modern guesses</h4><p>Writers have named New York, the United States, Mecca, the European Union and the United Nations. None has a clear basis in the text, and each was shaped by its own era's headlines.</p></div>
  <div class="card"><h4>A system, in every age</h4><p>The idealist reading: Babylon is human society organized against God, around power, luxury and false worship. Augustine called it "the earthly city," which "loves itself even to the contempt of God" (<i>City of God</i> 14.28). Every age has a Babylon, and the church always lives in it.</p></div>
  <p class="small">These can overlap. Many readers think John meant Rome for his first readers, and that Rome stands for every power that acts like it.</p>`},
 {h:'Was Israel ever called Babylon?', html:`
  <p><b>Not in so many words.</b> No book of the Bible calls Jerusalem or Israel "Babylon." But the prophets came close, and in ways that matter for Revelation 17–18:</p>
  <ul>
   <li>Jerusalem is called <b>Sodom</b> (Isaiah 1:10; Ezekiel 16:46–49), and Revelation 11:8 calls "the great city" "Sodom and Egypt."</li>
   <li>Jerusalem is called a <b>prostitute</b>: "See how the faithful city has become a prostitute!" (Isaiah 1:21; also Jeremiah 3:1–3; Hosea 2; Ezekiel 16 and 23).</li>
   <li>Ezekiel 16 dresses unfaithful Jerusalem in fine linen, embroidered cloth, gold and jewels (16:10–13), and then her own lovers strip her and burn her houses (16:37–41). Revelation 17:16 has the beast and the ten horns do the same to the prostitute.</li>
  </ul>
  <p>Preterists who read Babylon as Jerusalem lean on these parallels. Others answer that Revelation borrows its words for Babylon mostly from the prophets' songs over Babylon and Tyre (Jeremiah 50–51; Isaiah 47; Ezekiel 26–27), not from the oracles against Jerusalem, and that Jerusalem in AD 70 did not "rule over the kings of the earth" (17:18).</p>
  <p class="small">In later Jewish writing, Rome was the one called "Babylon" and "Edom," never Jerusalem. A caution: reading Babylon as Jerusalem has been misused to justify hostility toward Jewish people. The careful preterists who hold it apply it to first-century temple leaders, not to Jews.</p>`},
 {h:'Has the church been called Babylon?', html:`
  <p><b>In the New Testament, the church is "in" Babylon, not Babylon itself.</b> 1 Peter 5:13: "She who is in Babylon, chosen together with you, sends you greetings." "She" is the church in Rome, greeting other churches from the capital.</p>
  <p><b>Later, yes, often, and usually by one group of Christians about another:</b></p>
  <ul>
   <li><b>Medieval reformers.</b> Followers of Joachim of Fiore and the Spiritual Franciscans (Peter John Olivi, about 1297) called the corrupt, worldly church "the carnal church" and "Babylon." Dante shows the harlot of Revelation 17 seated on the church's chariot (<i>Purgatory</i> 32).</li>
   <li><b>The Avignon papacy (1309–1377).</b> When the popes lived in France, Petrarch called papal Avignon "Babylon," and the period is still known as the "Babylonian captivity" of the papacy.</li>
   <li><b>The Reformation.</b> Martin Luther's <i>On the Babylonian Captivity of the Church</i> (1520) said the papacy held the sacraments captive. The Geneva Bible's notes (1560) and many Puritans identified the papacy with the beast and Babylon, and the Westminster Confession (1646) called the pope "that Antichrist." Catholic writers such as Robert Bellarmine answered that Babylon was pagan Rome.</li>
   <li><b>Revival movements.</b> In 1843 the Millerite preacher Charles Fitch preached "Come Out of Her, My People," applying 18:4 to the Protestant churches that rejected the Advent message. Seventh-day Adventists still read fallen Babylon (14:8) as apostate Christianity. Jehovah's Witnesses teach that "Babylon the Great" is the world empire of false religion, Christendom included.</li>
  </ul>
  <p class="small">A pattern worth noticing: almost every group that has called another church "Babylon" has later had the label thrown back at it. Revelation itself points the warning first at its own churches: "Come out of her, <i>my people</i>" (18:4).</p>`},
 {h:'What her symbols mean', html:`
  <ul class="decoder">
   <li><b>Prostitute</b><span>Selling yourself for gain: idolatry as unfaithfulness to God, and commerce that will trade with anyone for profit (Isaiah 23:17 of Tyre).</span></li>
   <li><b>Wine and the gold cup</b><span>"Babylon was a gold cup in the LORD's hand; she made the whole earth drunk" (Jeremiah 51:7). Her influence intoxicates: luxury dulls conscience.</span></li>
   <li><b>Purple and scarlet</b><span>The colors of wealth and rule. Tyrian purple dye was among the costliest goods in the ancient world; Roman law reserved certain purple garments for the emperor and senators.</span></li>
   <li><b>Jewels and pearls</b><span>The same stones that build the new Jerusalem (21:18–21). Babylon wears them; the bride is built from them.</span></li>
   <li><b>Many waters</b><span>Babylon's rivers and canals become "peoples, crowds, nations, and languages" (17:15): a power that sits on top of the nations.</span></li>
   <li><b>Seven hills, seven kings</b><span>Rome's geography, and its line of rulers (17:9–10).</span></li>
   <li><b>Queen, not widow</b><span>Self-sufficiency and the belief that loss can never come (18:7; Isaiah 47:8). Laodicea said the same: "I am rich... and need nothing" (3:17).</span></li>
   <li><b>The cargo list</b><span>Twenty-eight kinds of goods by Bauckham's count (18:12–13), most of them luxury imports to Rome: silk from China, ivory from Africa, citron wood for tables that cost a fortune, cinnamon from Asia. It ends with "slaves, that is, human lives."</span></li>
   <li><b>Magic spells</b><span><i>Pharmakeia</i> (18:23): her deception works like a spell on the nations.</span></li>
   <li><b>Smoke rising</b><span>Like Sodom's smoke (Genesis 19:28). Her judgment is final.</span></li>
   <li><b>The millstone</b><span>Thrown like Jeremiah's scroll-stone into the Euphrates (Jeremiah 51:63–64). Ordinary life ends: no music, no crafts, no lamplight, no weddings (18:22–23).</span></li>
  </ul>`},
 {spec:true, title:'Jeremiah told the exiles both to settle in Babylon and to flee it', body:`The same prophet gave Babylon's exiles two instructions. First: "Build houses and settle down... Seek the peace and prosperity of the city to which I have carried you into exile. Pray to the LORD for it, because if it prospers, you too will prosper" (Jeremiah 29:5–7). Later: "Come out of her, my people! Run for your lives!" (Jeremiah 51:45). Revelation quotes only the second (18:4). My reading: John's churches were meant to hold both, the way Daniel did. Daniel served Babylon's kings for decades and sought the city's good, yet would not eat the king's food or stop praying (Daniel 1:8; 6:10). Living in Babylon is not the sin. Taking part in "her sins" (18:4) is. This makes "Come out of her" a call to a different kind of life inside the city, ready to walk away when loyalty demands it, rather than a call to move somewhere else. Many commentators read 18:4 spiritually; setting it beside Jeremiah 29 and Daniel's example is my own emphasis.`, refs:'Jeremiah 29:5–7; Jeremiah 51:45; Daniel 1:8; Daniel 6:10; 18:4; 1 Peter 2:11–12'}

N('18:12','fine linen, purple, silk, and scarlet cloth','history',{t:'Rome’s luxury imports', p:'Silk came from China, purple dye was among the costliest goods in the empire.', b:`Silk reached Rome over the long trade routes from China, and the Roman writer Pliny complained that India, China and Arabia drained a hundred million sesterces a year from the empire for luxuries (<i>Natural History</i> 12.84). Tyrian purple was so costly that certain purple garments were reserved by law for the emperor and senators. "Fragrant wood" is citron wood, used for tables that cost as much as an estate.`, top:'babylon', s:['bauckham']});

const c2 = CHAPTERS[1];
c2.sum.push(`The Thyatira letter is full of sexual words: "sexual sin," "adultery," a bed, and a woman nicknamed Jezebel. Below the four views is a closer look at what those words mean, why the Bible so often describes false worship as prostitution, what was happening in Thyatira, and how different readers have understood her.`);
c2.deep = [
 {h:'Is Jezebel called a prostitute?', html:`
  <p>Not quite, and the difference matters. Revelation never calls her a <i>pornē</i>, "prostitute." That word is saved for Babylon in chapter 17. What the letter says is this:</p>
  <ul>
   <li>Her teaching leads Jesus's servants "to commit sexual sin" (<i>porneusai</i>, 2:20). This is a verb from the same family as <i>pornē</i>. Its root meaning is "to sell yourself," but by John's day it covered any sex outside marriage.</li>
   <li>She refuses to repent of her "sexual sin" (<i>porneia</i>, 2:21).</li>
   <li>Those who "commit adultery with her" (<i>moicheuontas</i>, 2:22) will suffer. Adultery is a different word. It means breaking a marriage.</li>
   <li>Her "children" will be struck dead (2:23).</li>
  </ul>
  <p>So the letter uses two pictures. Jezebel herself is pictured as sexually loose. The church members who follow her are pictured as cheating spouses. That second picture only works if they are already "married," and in the Bible God's people are married to God (Hosea 2:19–20; Ephesians 5:25–27; Revelation 19:7). Whatever else is going on, John is describing a betrayal of Jesus by people who belong to him.</p>`},
 {h:'Why the Bible links sex and idols', html:`
  <p>For readers who know the Old Testament, this language was familiar. The prophets described Israel's worship of other gods as prostitution and adultery again and again:</p>
  <ul>
   <li><b>The law.</b> Making deals with the Canaanites would lead Israel to "prostitute themselves to their gods" (Exodus 34:15–16).</li>
   <li><b>The prophets.</b> Hosea married an unfaithful wife as a living picture of Israel (Hosea 1–3). Jeremiah says Israel "played the prostitute with many lovers" (Jeremiah 3:1). Ezekiel 16 and 23 are long, painful poems about Jerusalem and Samaria as unfaithful wives.</li>
   <li><b>Baal of Peor.</b> In Numbers 25:1–2, Israel "began to commit sexual immorality with the women of Moab. They invited the people to the sacrifices of their gods, and the people ate." Sex and idol food together, exactly the pair in 2:14 and 2:20. Numbers 31:16 blames this on Balaam's advice, which is why the letter to Pergamum mentions Balaam.</li>
   <li><b>The real Jezebel.</b> When Jehu came to overthrow her family, he said, "How can there be peace, as long as the prostitution and sorceries of your mother Jezebel are so many?" (2 Kings 9:22). Nothing in 1 and 2 Kings says Queen Jezebel was literally a prostitute. Her "prostitution" was bringing Baal worship into Israel (1 Kings 16:31–33). The name "Jezebel" came with the prostitution label already attached, and the label meant idolatry.</li>
  </ul>
  <p>The logic is covenant logic. Israel's relationship with God was like a marriage: exclusive, loving and binding. Worshiping another god was not just a wrong opinion. It was cheating.</p>`},
 {art:'thyguild', caption:'A Thyatira guild banquet, as many scholars picture the problem: members recline on couches in a temple dining room, the meat comes from the god’s altar, and the evening is held in the god’s honor.'},
 {h:'What was happening in Thyatira?', html:`
  <p><b>A city of trade guilds.</b> Thyatira was a factory town. Inscriptions found there name more trade associations than in almost any other city in Asia Minor: wool workers, linen workers, garment makers, dyers, leather workers, tanners, potters, bakers, bronze smiths and slave dealers. Lydia, Paul's first convert in Europe, was "a dealer in purple cloth from the city of Thyatira" (Acts 16:14).</p>
  <p><b>Guilds met for meals, and the meals honored gods.</b> A guild was part trade union, part social club, part religious society. Each had a patron god, and members met for banquets, often in a temple dining room, eating meat from the god's sacrifices. Papyrus invitations from Egypt read like this: "Chaeremon invites you to dine at the couch of the lord Sarapis in the Sarapeum tomorrow." Thyatira's chief god was Apollo Tyrimnaios, a sun god, which may be why Jesus introduces himself here as "the Son of God, whose eyes are like flames of fire" (2:18).</p>
  <p><b>Staying out was costly.</b> A Christian dyer or bronze smith who refused the guild banquets could lose customers, partners and standing. Jezebel's teaching probably said, in effect, "You can go. Idols are nothing. God knows your heart." Paul had faced a similar question at Corinth (1 Corinthians 8–10), and the Jerusalem council had asked gentile believers to keep away from "food sacrificed to idols" and "sexual immorality" (Acts 15:29). Notice that Jesus ends the letter with "I will not put any other burden on you" (2:24), almost the council's own words: "to lay on you no greater burden than these necessary things" (Acts 15:28).</p>
  <p><b>Who was she?</b> Most scholars think she was a real woman, a respected prophet in the Thyatira church, whom John calls "Jezebel" the way we call a traitor "a Judas." She was clearly influential: she had "children," meaning followers, and had been given "time to repent." Two older guesses are worth knowing about:</p>
  <ul>
   <li><b>"Your wife Jezebel."</b> Some Greek manuscripts, including Codex Alexandrinus and many later ones, read "<i>your</i> wife Jezebel" (<i>tēn gunaika sou</i>). If the "angel" of the church is its leader, she would be the leader's wife. Most modern editions read "the woman," and the point is debated.</li>
   <li><b>A local oracle.</b> In 1893 Emil Schürer suggested she was linked to a shrine of the Sibyl Sambathe outside Thyatira. Few scholars accept this today, since the text places her inside the church ("you put up with").</li>
  </ul>`},
 {h:'Literal, figurative, or both?', html:`
  <p>Readers have taken the sexual language in four main ways:</p>
  <div class="card"><h4>Mainly figurative: idolatry</h4><p>"Sexual sin" is the prophets' word for unfaithfulness to God, and the real issue is the idol feasts. Revelation uses <i>porneia</i> this way for Babylon (14:8; 17:2; 18:3; 19:2), and "adultery" fits church members who are "married" to Christ. Held by many modern commentators (for example G. K. Beale and Craig Koester).</p></div>
  <div class="card"><h4>Literal: real sexual sin</h4><p>Some groups in the early church taught that the body did not matter, so what you did with it did not matter either. The church fathers Irenaeus and Clement of Alexandria connect the Nicolaitans with this kind of freedom. Revelation also uses these words literally elsewhere (9:21; 21:8; 22:15). Held by many traditional and futurist commentators (for example Robert Thomas and John Walvoord).</p></div>
  <div class="card"><h4>Both at once</h4><p>Guild banquets could end in drinking and hired company, and Paul at Corinth had to deal with both idol meals and Christians visiting prostitutes (1 Corinthians 6:15–16; 10:7–8). On this view Jezebel opened a door that led to both. This is probably the most common middle position.</p></div>
  <div class="card"><h4>Mostly name-calling</h4><p>Some scholars, such as Elisabeth Schüssler Fiorenza and Tina Pippin, note that ancient writers often attacked rival teachers, especially women, with sexual insults. They read Jezebel as a real prophet who disagreed with John about how much Christians could take part in city life, and they caution against assuming she was literally immoral. Others answer that John is quoting the Old Testament's own covenant language, not inventing an insult.</p></div>
  <p class="small">Something every view agrees on: the letter's first complaint is that the church "put up with" her (2:20). The warning is as much about a church that would not deal with a problem as about one woman.</p>`},
 {h:'How the four views read her', html:`
  <ul>
   <li><b>Preterist:</b> a first-century woman in a real church, and a real dispute over guild feasts. Fulfilled in John's day.</li>
   <li><b>Historicist:</b> the seven churches also picture seven ages of church history. Thyatira, praised for "service" but tolerating Jezebel, is the medieval church; Jezebel is often read as the papacy or the corruption of the church through power and wealth.</li>
   <li><b>Futurist:</b> many dispensationalists read the letters both as real churches and as a preview of church history (the Scofield Reference Bible did this). Some see Jezebel's "children" growing into the great prostitute of chapter 17, an unfaithful church at the end of the age.</li>
   <li><b>Idealist:</b> Jezebel stands for any voice inside the church that makes peace with the gods of the culture: money, status, sex, nation. Her teaching sounds spiritual ("the deep things") and practical ("everyone does it").</li>
  </ul>
  <p class="small">A modern use not found in the text: some charismatic and Pentecostal writers speak of a "Jezebel spirit," a controlling or manipulative influence. Revelation itself speaks of a person and a teaching, not a spirit.</p>`},
 {h:'Other traditions: was there "temple prostitution"?', html:`
  <p>Many older Bible commentaries say that pagan temples were full of "sacred prostitutes," and that Jezebel's sin was joining in. The idea comes mainly from the Greek historian Herodotus, who claimed every Babylonian woman once had to sleep with a stranger at the temple of Ishtar (<i>Histories</i> 1.199), and from Strabo, who said Corinth's Aphrodite temple once had a thousand prostitutes (<i>Geography</i> 8.6.20). Recent historians, notably Stephanie Budin, argue that these stories are mostly rumor and stereotype about foreigners, and that there is little solid evidence for sacred prostitution anywhere in the ancient world. So it is safer not to imagine temple prostitutes in Thyatira. The well-attested problem is the guild banquet.</p>`},
 {spec:true, title:'Jezebel is Babylon in miniature', body:`Queen Jezebel was a Phoenician princess, daughter of Ethbaal, "king of the Sidonians" (1 Kings 16:31); Josephus calls him king of Tyre. Tyre was the great trading city of the Old Testament, and Isaiah called it a prostitute: "she will return to her wages and commit sexual immorality with all the kingdoms of the world" (Isaiah 23:17). Revelation's Babylon is built largely from the songs against Tyre: "the kings of the earth committed sexual immorality with her, and the merchants of the earth grew rich" (Revelation 18:3), and the cargo list of 18:12–13 follows Ezekiel 27. My reading: the Thyatira letter is a small, local preview of chapters 17–18. A Tyrian queen's name, a trading city, merchants' guilds, "sexual sin" that is really commerce with the gods, and "sorceries" (2 Kings 9:22, compare "your sorcery deceived all the nations," Revelation 18:23). "Come out of her, my people" (18:4) is the world-sized version of "unless they turn away from what she does" (2:22). If that is right, Babylon is not only something out there. It can start in a church's own dining room.`, refs:'1 Kings 16:31; Isaiah 23:15–17; Ezekiel 27; 17:2; 18:3; 18:4; 18:23; 2 Kings 9:22'},
 {spec:true, title:'The couch becomes a sickbed, and the queen is thrown down', body:`The Greek of 2:22 says only "I am throwing her onto a bed" (<i>klinē</i>). Translators add "sickbed" because of the sickness that follows. But <i>klinē</i> was also the word for the dining couch where guests reclined at a banquet, including the "couch of the lord Sarapis." I think the irony is intended: the couch where she ate the idol feast and "committed sexual sin" becomes the bed where she lies sick. There may be a second echo. The original Jezebel's story ends when Jehu shouts "Throw her down!" and she is thrown from a window (2 Kings 9:33). Jesus also "throws" his Jezebel, but onto a bed, after giving her "time to repent." The first Jezebel got no second chance; this one did.`, refs:'2 Kings 9:30–37; 2:21–22'}
];
}

/* art: a guild banquet on couches */
ART.thyguild = function(){
  let s = blob(200,95,165,72,C.ochre,.1,1.5,.75);
  /* temple front */
  s += K('M70,110 L70,40 M95,110 L95,40 M120,110 L120,40 M145,110 L145,40', 2, C.ink2) + K('M58,40 L157,40 L108,18 Z', 1.8, C.ink2) + K('M55,112 L160,112', 2, C.ink2);
  s += T(108,34,'Apollo',9,'middle',C.ink2);
  /* altar with smoke */
  s += K('M180,120 L180,98 L204,98 L204,120 Z', 1.8, C.red) + K('M188,94 q-6,-10 2,-18 q8,-8 0,-18 M197,94 q6,-10 -2,-18', 1.3, C.ink2);
  /* three couches with reclining figures */
  [[230,135],[290,120],[345,138]].forEach(([x,y],i) => {
    s += K(`M${x-28},${y} L${x+28},${y} M${x-28},${y} L${x-28},${y+10} M${x+28},${y} L${x+28},${y+10} M${x+28},${y} L${x+30},${y-12}`, 2, C.ink2);
    s += `<circle cx="${x+15}" cy="${y-26}" r="5.5" fill="none" stroke="${C.ink}" stroke-width="1.6"/>`
      + K(`M${x+14},${y-20} L${x+8},${y-3} L${x-24},${y-3} M${x+12},${y-14} L${x+24},${y-9} M${x+11},${y-16} L${x-1},${y-19}`, 1.8, C.ink);
    s += `<circle cx="${x-3}" cy="${y-21}" r="3" fill="${i===1?C.red:C.ochre}" opacity=".85"/>`;
  });
  s += T(290,170,'members recline at the god’s table',9.5,'middle',C.ink2);
  return svg('A sketch of a guild banquet: a small temple of Apollo, an altar with smoke, and three diners reclining on couches holding cups.', s, '0 0 400 190');
};

TP({id:'porneia', kind:'Words', title:'"Sexual Sin" and "Prostitution"', ch:[2,9,14,17,18,19,21,22],
 lead:`The Greek word family <i>pornē</i> (prostitute), <i>porneia</i> (sexual immorality) and <i>porneuō</i> (to commit it) appears 19 times in Revelation, more than in any other New Testament book.`,
 sections:[
  ['What the words mean',`<i>Pornē</i> first meant a woman who sells herself (from <i>pernēmi</i>, "to sell"). By the first century <i>porneia</i> covered any sexual sin. In the Greek Old Testament the same words translate Hebrew <i>zanah</i>, which the prophets use for Israel's idolatry.`],
  ['Literal uses',`In the vice lists, the words mean real sexual sin: 9:21; 21:8; 22:15.`],
  ['Figurative uses',`For Babylon, the words mean seductive commerce and false worship: 14:8; 17:1–5; 18:3; 18:9; 19:2. "The kings of the earth committed sexual immorality with her" comes from Isaiah 23:17, about Tyre.`],
  ['In the letters',`Pergamum (2:14) and Thyatira (2:20–21) pair it with eating food sacrificed to idols, as in Numbers 25:1–2 and Acts 15:29. Scholars debate how literal it is there; the chapter 2 page lays out the views.`],
  ['The opposite',`The faithful are pictured as a bride (19:7–8; 21:2) and as those who "did not defile themselves" (14:4). The book moves from a prostitute city to a bride city.`]],
 common:[`In the letters it means mainly compromise with idolatry, with literal sin possibly included.`],
 uncommon:[`It is entirely literal: a libertine group that taught sexual freedom.`,`The sexual language is mostly stock polemic against a rival teacher.`],
 links:[['Porneia','Porneia'],['Jezebel','Jezebel'],['Sacred prostitution','Sacred prostitution']],
 sources:['beale','koester','aune','fiorenza','budin']});

  ['Prostitution language',`Revelation never calls her a prostitute; it says she teaches and commits "sexual sin," and her followers "commit adultery" with her. The Old Testament already linked the name to prostitution: "the prostitution and sorceries of your mother Jezebel" (2 Kings 9:22), meaning Baal worship. See the chapter 2 page for the four ways this has been read.`],
  ['"Your wife"?',`Some manuscripts, including Codex Alexandrinus, read "your wife Jezebel," which would make her the wife of the church's leader. Most modern editions read "the woman."`]);

/* notes in the Thyatira letter */
N('2:20','who calls herself a prophet','views',{t:'A woman prophet', p:'Women prophesied in the early church. The issue is her message, not that she is a woman.', b:`Women prophets were known and honored in the early church: Philip's four daughters (Acts 21:9), and Paul's instructions for women who pray and prophesy (1 Corinthians 11:5). Jesus does not fault her for prophesying. He faults what she teaches, and the church for "putting up with" it. "Calls herself" is the same complaint as 2:2, those "who call themselves apostles and are not."`, r:'Acts 21:9; 1 Corinthians 11:5; 2:2; Acts 2:17–18', top:'jezebel'});
N('2:20','into sexual sin','word',{t:'"Sexual sin" (porneia)', greek:'πορνεῦσαι (porneusai)', p:'From the word for prostitute. In the prophets it is the standard picture for idolatry.', b:`The verb comes from <i>pornē</i>, "prostitute." By John's day it covered any sexual sin, but in the Greek Old Testament the same word family translates Hebrew <i>zanah</i>, which the prophets use for Israel worshiping other gods (Jeremiah 3:1; Ezekiel 16; Hosea 1–3). Here it is paired with idol food, exactly as in the Baal of Peor story (Numbers 25:1–2) and the Jerusalem council's letter (Acts 15:29). Whether it is literal, figurative or both is debated; see the chapter 2 page.`, r:'Numbers 25:1–2; Acts 15:29; 2:14; Hosea 4:12', top:'porneia', s:['beale','aune']});
N('2:20','eating food sacrificed to idols','history',{t:'The guild banquet', p:'Thyatira’s trade guilds met for meals honoring their patron gods.', b:`Thyatira's inscriptions name a remarkable number of guilds: wool, linen, dyers, leather, tanners, potters, bakers, bronze smiths, slave dealers. Guild members met for banquets, often in temple dining rooms, eating meat from the sacrifices. A Christian who stayed away could lose business. Paul's long answer to the same problem is 1 Corinthians 8–10.`, r:'1 Corinthians 8:1–13; 1 Corinthians 10:14–22; Acts 16:14', l:[['Thyatira','Thyatira'],['Collegium (ancient Rome)','Collegium (ancient Rome)']], top:'jezebel', s:['hemer','harland']});
N('2:21','I gave her time','echo',{t:'Time to repent', p:'Even "Jezebel" gets a chance. The original queen did not.', b:`Jesus has already given her time, and the warning that follows is still conditional: "unless they turn away" (2:22). Peter: the Lord "is patient with you, not wanting anyone to perish" (2 Peter 3:9). Compare the plagues, where people "did not repent" (9:20–21; 16:9, 11).`, r:'2 Peter 3:9; Romans 2:4; 9:20–21; 16:9', top:'jezebel'});
N('2:22','a sickbed','word',{t:'"Bed" or "couch"?', greek:'κλίνην (klinēn)', p:'The Greek says only "bed." It was also the word for a banquet couch.', b:`<i>Klinē</i> means a bed or the couch diners reclined on. KJV has "bed"; NIV "bed of suffering"; many modern versions "sickbed," taking the sense from the sickness and death that follow. Some commentators hear a deliberate turn: the banquet couch of the idol feast becomes a bed of sickness. Ancient invitations spoke of dining "at the couch of the lord Sarapis."`, top:'jezebel', s:['aune','koester']});
N('2:22','commit adultery with her','symbol',{t:'Why "adultery"?', p:'Adultery assumes a marriage. Her followers already belong to Christ.', b:`Jezebel is charged with <i>porneia</i>, but her followers with <i>moicheia</i>, adultery: the betrayal of a spouse. In the prophets, God is Israel's husband (Hosea 2:19–20; Jeremiah 3:20), and in the New Testament Christ is the church's (2 Corinthians 11:2; Revelation 19:7). James uses the same picture: "You adulterous people! Don't you know that friendship with the world means hatred toward God?" (James 4:4).`, r:'Hosea 2:19–20; Jeremiah 3:20; 2 Corinthians 11:2; James 4:4; 19:7', top:'porneia'});
N('2:23','her children','symbol',{t:'Her children', p:'Her followers, the people she taught. Not literally her sons and daughters.', b:`In the Bible a teacher's disciples are often called children (1 John 2:1; 3 John 4; Galatians 4:19). "I will strike her children dead" is literally "I will kill her children with death"; in the Greek Old Testament "death" often means plague (compare 6:8). Some take it as a coming epidemic, others as spiritual death.`, r:'1 John 2:1; 3 John 4; 6:8; Ezekiel 33:27', top:'jezebel'});
N('2:24','I will not put any other burden on you','echo',{t:'The Jerusalem council’s words', p:'Echoes Acts 15:28, which also banned idol food and sexual immorality.', b:`The council's letter to gentile believers: "It seemed good to the Holy Spirit and to us to lay on you no greater burden than these necessary things: that you abstain from what has been sacrificed to idols, and from blood, and from what has been strangled, and from sexual immorality" (Acts 15:28–29). Jesus's word to the faithful in Thyatira sounds like the same agreement: keep those basics, and nothing more is required.`, r:'Acts 15:28–29; Acts 21:25', top:'jezebel'});

/* ---------- "Those who say they are ... and are not": claimed names versus real ones ---------- */
Object.assign(SRC, {
  frankfurter:'David Frankfurter, "Jews or Not? Reconstructing the ‘Other’ in Rev 2:9 and 3:9," <i>Harvard Theological Review</i> 94 (2001)',
  marshall:'John W. Marshall, <i>Parables of War: Reading John’s Jewish Apocalypse</i> (2001)',
  epictetus:'Epictetus, <i>Discourses</i>, recorded by Arrian (about AD 108)',
  suetonius:'Suetonius, <i>Lives of the Caesars</i> (about AD 121)',
  didache:'<i>The Didache</i> (late first century)',
  ignatius:'Ignatius of Antioch, letters to the Ephesians and Philadelphians (about AD 110)'
});

TP({id:'say-are-not', kind:'Words', title:'"Those Who Say They Are… and Are Not"', ch:[2,3],
 lead:`Four times in the seven letters, Jesus quotes a claim and then denies it: those "who call themselves apostles but are not" (2:2), "who say they are Jews and are not" (2:9; 3:9), and Jezebel, "who calls herself a prophet" (2:20). A fifth time he quotes a whole church: "You say, ‘I am rich’... but you don't realize that you are... poor" (3:17). This page asks what the pattern means, where it comes from, and why claims about who you are carried so much weight in John's world.`,
 sections:[
  ['The pattern in the Greek',`The wording is almost a formula. Ephesus: "those who say they are apostles and are not" (<i>tous legontas heautous apostolous kai ouk eisin</i>). Smyrna: "those who say they are Jews and are not" (<i>tōn legontōn Ioudaious einai heautous kai ouk eisin</i>). Philadelphia repeats it and adds "but are lying" (<i>alla pseudontai</i>). Thyatira: "who calls herself a prophet" (<i>hē legousa heautēn prophētin</i>). Laodicea: "you say, I am rich" (<i>legeis hoti plousios eimi</i>). Each time the word "say" (<i>legō</i>) stands against what Jesus, who "knows" (2:2, 9, 19; 3:8, 15), says is true. Three of the claims are titles of honor in God's people: apostle, Jew, prophet. The fourth is a title of honor in the city: rich.`],
  ['It is John’s way of talking',`The same "say... but" formula runs through 1 John, which comes from the same circle of churches in Asia: "If we say we have fellowship with him and walk in darkness, we lie" (1 John 1:6). "Whoever says ‘I know him’ but does not keep his commandments is a liar" (1 John 2:4). "If anyone says ‘I love God’ and hates his brother, he is a liar" (1 John 4:20). In John's Gospel, Jesus tells opponents who say "Abraham is our father" that if they were Abraham's children they would act like it, and calls the devil "a liar and the father of lies" (John 8:39–44), the same pairing as "synagogue of Satan... they are lying" (Revelation 3:9). In this way of thinking, a name is a claim that your life either backs up or exposes.`],
  ['Apostles and prophets: testing the travelers',`Early churches were visited by traveling teachers who claimed to be apostles ("sent ones") or prophets. Churches had to test them. Paul warns of "false apostles, deceitful workers, masquerading as apostles of Christ" (2 Corinthians 11:13), and 1 John says "test the spirits, because many false prophets have gone out" (1 John 4:1). A church manual from about the same time, the <i>Didache</i>, gives practical tests: a traveling apostle may stay one or two days, but "if he stays three days, he is a false prophet," and if he asks for money, he is a false prophet (<i>Didache</i> 11.5–6). "Not everyone who speaks in the Spirit is a prophet, but only if he has the ways of the Lord" (11.8). About fifteen years after Revelation, Ignatius of Antioch praised the Ephesians because some had come through "with evil teaching, whom you did not allow to sow among you" (<i>To the Ephesians</i> 9.1). Ephesus kept its reputation for testing.`],
  ['"Jew": an honored name and a legal status',`In the first century "Jew" (<i>Ioudaios</i>, from Judah) was more than a religion. It was a people, a way of life, and a legal category. Jews in the empire had long-standing rights: they could keep the Sabbath, send money to the temple, and were not required to sacrifice to the gods or the emperor. After AD 70 every Jew paid a special tax to Rome, the <i>fiscus Judaicus</i>, and the historian Suetonius says the emperor Domitian, in John's lifetime, prosecuted people "who lived as Jews without admitting it" or hid their origin (<i>Domitian</i> 12.2). So who counted as a Jew was decided in tax offices and courts, not only in synagogues. As followers of Jesus were pushed out of synagogues (John 9:22; 16:2), they lost that legal shelter and became visible to the authorities as members of an unlicensed new group. The "slander" (<i>blasphēmia</i>) at Smyrna may have been exactly that: telling officials, "These people are not Jews."`],
  ['Citizenship: a claim with life-and-death weight',`Claiming a status you did not have was a serious matter in the Roman world. Roman citizenship brought rights: a trial, an appeal to Caesar, freedom from flogging and crucifixion. So false claims were punished hard. Suetonius reports that the emperor Claudius had men who falsely claimed Roman citizenship beheaded (<i>Claudius</i> 25.3). In Acts, a Roman commander about to flog Paul is alarmed to learn he is a citizen; the commander bought his own citizenship, but Paul was "born a citizen" (Acts 22:25–29; compare Acts 16:37–38). The Stoic teacher Epictetus, who taught in Greece in John's day, even uses the same kind of phrase about Jewish identity: "Why do you act the part of a Jew when you are a Greek?... We are counterfeit, Jews in name but something else in fact" (<i>Discourses</i> 2.9.20–21). In that world, "they say they are... and are not" sounded like an accusation of fraud. Revelation answers with a better citizenship. Paul told the Roman colony of Philippi, "our citizenship is in heaven" (Philippians 3:20). Revelation ends with a city whose citizens are registered "in the Lamb's book of life" (21:27), and promises the faithful at Philadelphia that Jesus will write on them "the name of the city of my God" (3:12). The true citizen does not claim the name. He receives it.`],
  ['Who were "those who say they are Jews"?',`Scholars give four main answers. <b>(1) Members of the local synagogues</b> who opposed and reported the Christians. This is the most common view. John, himself a Jew, is saying that people who side with Rome against Israel's Messiah are not living up to the name, much as Paul says "a person is not a Jew who is one only outwardly" (Romans 2:28–29). <b>(2) Gentiles who were adopting Jewish identity</b>, perhaps to gain the legal protection, and who pressured Christians to do the same. David Frankfurter argues this, and Ignatius warned the Philadelphians a few years later: "If anyone expounds Judaism to you, do not listen. It is better to hear Christianity from a circumcised man than Judaism from an uncircumcised one" (<i>To the Philadelphians</i> 6.1). <b>(3) Jewish followers of Jesus</b> who insisted gentile believers become Jews first, like the group Paul fought in Galatians. <b>(4) A mainly spiritual statement</b> that the true people of God are those loyal to the Messiah, whatever their background. John Marshall and others stress that John never uses the word "Christian" and seems to think of himself and his churches as the faithful core of Israel. That makes this an argument inside a family about the family name, not an attack on Jews from outside.`],
  ['Is it symbolic?',`Partly. The people were real, and so was the conflict. But the pattern also sets up one of Revelation's biggest themes: the true and the counterfeit. Jesus introduces himself to Philadelphia as "the Holy One, the True One" (3:7) and to Laodicea as "the faithful and true witness" (3:14), just before exposing false claims. Later the book is full of fakes: a beast with a death-wound that "was healed" like the slain Lamb (13:3), a second beast with "two horns like a lamb" that "spoke like a dragon" (13:11), a "false prophet" (16:13), a mark that copies God's seal, and a prostitute city that copies the bride. The beast wears "names that insulted God" (13:1), the divine titles emperors claimed: "Lord," "Savior," "Son of God." The local fakes in the letters are small versions of the great imperial fake. And the people with "no lie in their mouths" (14:5) stand opposite the "liars" left outside the city (21:8; 22:15).`],
  ['Its misuse',`"Synagogue of Satan" has been taken out of context to justify hatred of Jews, from medieval sermons to modern hate groups that use it as a slogan. That use ignores that John was Jewish, that he names the twelve tribes on the gates of the New Jerusalem (21:12), and that his complaint is about specific local accusers in two cities. Most Christian traditions today explicitly reject reading these verses as a judgment on the Jewish people.`]],
 common:[`Real local opponents in the synagogues of Smyrna and Philadelphia, whose claim to the name John denies because they opposed the Messiah and his people.`,`False apostles and prophets were traveling teachers whom the churches were expected to test.`],
 uncommon:[`Gentile Judaizers claiming Jewish status (Frankfurter).`,`Jewish-Christian teachers requiring gentiles to become Jews.`,`Historicist: nominal Christians or a church claiming to be the true Israel without its faith.`,`Replacement reading: the church is now the only "true Jews." Many object that John's point is loyalty, not ethnic replacement.`],
 claude:{title:'Names you claim and names you are given', body:`My reading: the seven letters are a lesson in naming. People in them name themselves: apostles, Jews, a prophet, rich, alive (3:1, "you have a name that you are alive"; the Greek is literally "a name"). Jesus answers each self-given name by naming himself truly (each letter opens with one of his titles) and by promising names that only he can give: "a new name written on" a white stone "that no one knows except the one who receives it" (2:17), and "my God's name, the name of the city of my God... and my own new name" (3:12). In a world where a forged citizenship could cost your head, John's churches are told that the only identity that will stand on the last day is the one written by Jesus "in the book of life" (3:5). The beast tries the same thing on a world scale: it names itself with God's titles (13:1) and writes its own name on people (13:17). The question for every reader is not "What do I call myself?" but "Whose name is written on me?"`, refs:'2:17; 3:1; 3:5; 3:12; 13:1; 13:17; 14:1; 22:4'},
 links:[['Synagogue of Satan','Synagogue of Satan'],['Didache','Didache'],['Fiscus Judaicus','Fiscus Judaicus'],['Roman citizenship','Roman citizenship'],['Epictetus','Epictetus']],
 sources:['koester','aune','frankfurter','marshall','didache','ignatius','suetonius','epictetus','hemer']});

/* point the chapter pages at it */
CHAPTERS[1].sum.push(`Twice in this chapter Jesus quotes a claim and denies it: false "apostles" at Ephesus and those "who say they are Jews and are not" at Smyrna, plus Jezebel, "who calls herself a prophet." The topic page <button class="linkish" data-go="tp-say-are-not">"Those who say they are... and are not"</button> explains the pattern, who these people were, and why claims to a name, like Roman citizenship, carried legal weight.`);
CHAPTERS[2].sum.push(`Philadelphia hears the "say they are Jews and are not" charge a second time, now with "but are lying," and Laodicea is quoted against itself: "You say, ‘I am rich.’" See the topic page <button class="linkish" data-go="tp-say-are-not">"Those who say they are... and are not"</button>.`);

/* the existing Smyrna and Philadelphia notes now point here too */
NOTES.filter(n => (n.v==='2:9' && n.a==='synagogue of Satan') || (n.v==='2:20' && n.a==='who calls herself a prophet')).forEach(n => n.top = 'say-are-not');

N('2:2','those who call themselves apostles but are not','history',{t:'Testing traveling apostles', p:'Wandering teachers claimed to be apostles. Churches tested them, and Ephesus was good at it.', b:`"Apostle" means "one who is sent." Besides the Twelve and Paul, the early church used it for traveling missionaries, and some were frauds (2 Corinthians 11:13). The <i>Didache</i>, a church manual from about this time, says a true apostle stays a day or two; "if he stays three days, he is a false prophet," and if he asks for money, he is a false prophet (11.5–6). Ignatius later praised Ephesus for not letting false teachers "sow among you" (<i>To the Ephesians</i> 9.1). This is the first of the "say they are... and are not" claims in the letters.`, r:'2 Corinthians 11:13–15; 1 John 4:1; Acts 20:29–30', top:'say-are-not', s:['didache','ignatius']});
N('2:9','those who say they are Jews and are not','word',{t:'"Say they are Jews and are not"', greek:'τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν', p:'A claim to a name that was also a legal status, denied by a Jewish writer.', b:`Being a "Jew" in the empire meant legal rights, including freedom from emperor worship, and after AD 70 a special tax. Who counted was argued in courts as well as synagogues, the way false claims to Roman citizenship could be punished by death (Suetonius, <i>Claudius</i> 25.3). John, a Jew, denies these accusers the name because they side against Israel's Messiah, much as Paul says "a person is not a Jew who is one only outwardly" (Romans 2:28–29). Some scholars think they were gentiles claiming Jewish status. See the topic page for the views.`, r:'Romans 2:28–29; John 8:39–44; 3:9', top:'say-are-not', s:['koester','frankfurter']});
N('3:7','the True One','echo',{t:'"The True One"', p:'Jesus calls himself true just before exposing those who "are lying" (3:9).', b:`<i>Ho alēthinos</i>, "the true one, the genuine one," is set against the claimants in 3:9 who "say they are Jews and are not, but are lying." Real versus counterfeit is one of Revelation's main threads: compare "the faithful and true witness" (3:14) and the rider called "Faithful and True" (19:11).`, r:'3:9; 3:14; 19:11; 1 John 5:20; John 14:6', top:'say-are-not'});
N('3:9','but are lying','word',{t:'"But are lying"', greek:'ἀλλὰ ψεύδονται (alla pseudontai)', p:'Only Philadelphia’s version adds "lying," the word Revelation uses for false loyalty.', b:`In Revelation, lying is mostly about allegiance: false apostles are "liars" (2:2), the 144,000 have "no lie in their mouths" (14:5), and "all liars" are outside the city (21:8; 22:15). The pairing of Satan and lying echoes Jesus in John 8:44: the devil "is a liar and the father of lies." See the topic page for the whole pattern.`, r:'2:2; 14:5; 21:8; 22:15; John 8:44; 1 John 2:4', top:'say-are-not'});
N('3:17',"You say, 'I am rich",'symbol',{t:'A church that names itself', p:'The last of the "you say... but" claims, this time made by a whole church.', b:`Laodicea was proud of its wealth. After an earthquake in AD 60 it rebuilt without help from Rome (Tacitus, <i>Annals</i> 14.27). The church took on the city's self-image. Jesus answers the claim the way he answered the false apostles and false Jews: with what is really true, "poor, blind, and naked," and then with an offer of real gold, clothes and eye salve (3:18). Compare Babylon: "I sit as a queen" (18:7).`, r:'3:18; 18:7; Hosea 12:8; 1 Corinthians 4:8', top:'say-are-not'});
