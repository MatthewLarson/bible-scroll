 views:{P:`The vindication of the martyrs after AD 70, reigning with Christ now.`,H:`A revival of the true church in history.`,F:`The bodily resurrection of believers (or tribulation martyrs) at Christ's return.`,I:`New life in Christ and the reign of believers with Christ, in this life and after death.`},
 links:[['Resurrection of the dead','Resurrection of the dead'],['Millennialism','Millennialism']],
 sources:['ladd','beale','gregg','augustine']});

TP({id:'white-throne', kind:'Ideas', title:'The Great White Throne', ch:[20],
 lead:`The final judgment scene (20:11–15). Earth and sky flee from the face of the one on the throne, the books are opened, and the dead, "great and small," are judged "by what they had done."`,
 sections:[
  ['The scene',`"White" is the color of purity and victory throughout the book. "Earth and sky fled from his presence, and there was no place for them" (20:11) clears the stage: nothing stands between the judge and the judged. The sea, Death and Hades all give up their dead (20:13): no one is lost, and no one escapes.`],
  ['Books and the book',`"Books" record deeds; "the book of life" records names (20:12, 15). The picture comes from Daniel 7:10 ("the court was seated, and the books were opened"). Malachi speaks of "a scroll of remembrance" (Malachi 3:16), and a psalm asks God to record tears in his book (Psalm 56:8). Revelation holds both: deeds matter, and belonging to the Lamb matters most (13:8; 21:27).`],
  ['Judged by works?',`Many readers ask how judgment "by what they had done" fits salvation by grace. Paul says the same two things: God "will repay each person according to what they have done" (Romans 2:6), and "it is by grace you have been saved... not by works" (Ephesians 2:8–9). Jesus's parable of the sheep and goats judges by deeds of mercy (Matthew 25:31–46). Most traditions say deeds are the evidence of what a person has become, and the book of life is the ground of rescue.`],
  ['Who sits on the throne?',`John says "him who was seated on it" (20:11), normally God the Father. Elsewhere the New Testament says the Father "has entrusted all judgment to the Son" (John 5:22; 2 Corinthians 5:10). By 22:1 the throne is "the throne of God and of the Lamb."`],
  ['In art',`The last judgment has been painted and carved more than almost any other scene: over the doors of medieval churches (Autun, Conques), by Giotto in Padua (about 1305), and by Michelangelo on the altar wall of the Sistine Chapel (1536–41).`]],
 views:{P:`Partial preterists: a future final judgment. Full preterists: fulfilled in AD 70.`,H:`The final judgment at the end of history.`,F:`A judgment of the unbelieving dead after the millennium; believers were judged earlier.`,I:`The final judgment of all people at the end.`},
 links:[['Last Judgment','Last Judgment'],['The Last Judgment (Michelangelo)','The Last Judgment (Michelangelo)']],
 sources:['beale','keener']});

TP({id:'lake-of-fire', kind:'Ideas', title:'The Lake of Fire', ch:[14,19,20,21],
 lead:`The final destination of the beast, the false prophet, the devil, Death and Hades, and those not found in the book of life (19:20; 20:10, 14–15; 21:8). <button class="linkish" data-go="tp-second-death">The second death</button> discusses the views in more depth.`,
 sections:[
  {h:'The lake in Revelation', table:[['Verse','Who is thrown in'],['19:20','The beast and the false prophet, "alive"'],['20:10','The devil; "tormented day and night forever and ever"'],['20:14','Death and Hades; "this is the second death"'],['20:15','Anyone whose name was not found in the book of life'],['21:8','The cowardly, the unfaithful, murderers, liars and others']]},
  ['Views',`<b>Eternal conscious punishment</b>, the traditional view (14:11; 20:10). <b>Conditional immortality</b> or annihilation: the "second death" means final destruction (John Stott, Edward Fudge). <b>Christian universalism</b>: final restoration even of the lost, often citing the open gates and the kings bringing in their glory (21:24–25), a minority view from Origen to modern writers.`],
  ['Background',`Sodom's "burning sulfur" (Genesis 19:24); Isaiah's "the fire that will not be quenched" (Isaiah 66:24); Daniel's beast "thrown into the blazing fire" (Daniel 7:11). Gehenna, the valley of Hinnom outside Jerusalem where children had been sacrificed to Molech (2 Kings 23:10; Jeremiah 7:31–32), became Jesus's word for the place of final judgment (Matthew 5:22; Mark 9:43–48). 1 Enoch speaks of an abyss "full of fire" for the fallen angels (1 Enoch 90:24–26).`],
  {myth:{culture:'Egypt', title:'The lake of fire in the underworld', body:`The Egyptian <i>Book of the Dead</i> (spell 126) and tomb paintings show a lake of fire in the underworld, guarded by four baboons, which burns the wicked and refreshes the righteous. Greek myth had Pyriphlegethon, a river of fire in Hades. There is no evidence John borrowed from Egypt; fire as the picture of final judgment was common across the ancient world and already present in the Old Testament.`, link:['Lake of fire','Lake of fire'], link2:'a parallel, no known link'}}],
 common:[`Revelation gives a detailed map of hell.`],
 uncommon:[`Death and Hades themselves are thrown into the lake (20:14). The image is at least partly about the end of death itself.`],
 links:[['Lake of fire','Lake of fire'],['Second death','Second death'],['Annihilationism','Annihilationism'],['Gehenna','Gehenna']],
 sources:['koester','beale']});

TP({id:'book-of-life', kind:'Symbols', title:'The Book of Life', ch:[3,13,17,20,21,22],
 lead:`A register of God's people, like a city's list of citizens. "I will never erase that person's name from the book of life" (3:5). Only those "whose names are written in the Lamb's book of life" enter the city (21:27).`,
 sections:[
  {h:'The book in Revelation', table:[['Verse','What it says'],['3:5','The one who wins will never be erased from it'],['13:8','Those not written in it worship the beast; "the Lamb who was slaughtered since the foundation of the world"'],['17:8','Those not written in it "since the foundation of the world" are amazed at the beast'],['20:12','"Another book was opened, which is the book of life"'],['20:15','Anyone not found written in it is thrown into the lake'],['21:27','Only those written in it enter the city'],['22:19','(KJV "book of life"; Greek "tree of life")']]},
  ['Background',`Moses prayed, "Blot me out of the book you have written" (Exodus 32:32–33). A psalm asks that enemies "be blotted out of the book of life" (Psalm 69:28). Isaiah speaks of those "recorded among the living in Jerusalem" (Isaiah 4:3), Daniel of everyone "whose name is found written in the book" (Daniel 12:1), and Jesus told his disciples to rejoice "that your names are written in heaven" (Luke 10:20; also Philippians 4:3; Hebrews 12:23).`],
  ['Citizen rolls',`Greek cities kept registers of citizens, and a citizen condemned for a serious crime could have his name erased. Sardis's readers, in a city of proud old families, would have heard "I will never erase your name" (3:5) as a promise of citizenship that cannot be revoked.`],
  ['The Jewish New Year',`Jewish tradition says that on Rosh Hashanah three books are opened: one for the righteous, one for the wicked, and one for those in between (Talmud, Rosh Hashanah 16b). The traditional greeting for the season is "May you be inscribed in the book of life." Revelation's "books were opened" belongs to the same picture.`],
  ['"Since the world was made"',`13:8 and 17:8 say names were written "since the foundation of the world," a key text in debates about predestination. The Greek order of 13:8 can also mean "the Lamb slaughtered since the foundation of the world" (KJV). Calvinists stress God's choice before creation; Arminians stress that names can be "blotted out" (3:5; Exodus 32:33) and that the promise is to "the one who wins."`],
  ['A textual slip',`KJV 22:19 says "book of life" where nearly every Greek manuscript says "tree of life," because of Erasmus's back-translation from Latin in 1516.`]],
 links:[['Book of Life','Book of Life'],['Rosh Hashanah','Rosh Hashanah']],
 sources:['metzger','koester','hemer']});

TP({id:'new-creation', kind:'Ideas', title:'New Heaven and New Earth', ch:[21,22],
 lead:`"Then I saw a new heaven and a new earth, for the first heaven and the first earth had passed away, and the sea was no more" (21:1), quoting Isaiah 65:17 and 66:22. The Bible ends where it began: with heaven, earth, a garden, a river and a tree.`,
 sections:[
  {h:'Seven things that are gone', table:[['No more...','Verse','What it undoes'],['Sea','21:1','Chaos, the beast’s home, separation'],['Death','21:4','The "last enemy" (1 Corinthians 15:26)'],['Mourning','21:4','Grief for the dead'],['Crying','21:4','"God will wipe every tear from their eyes" (Isaiah 25:8)'],['Pain','21:4','Suffering of every kind'],['Curse','22:3','The curse of Genesis 3:17–19'],['Night','21:25; 22:5','Darkness and danger']]},
  ['Renewed or replaced?',`<i>Kainos</i>, "new," often means new in quality rather than brand new. Some read total replacement: "the heavens will disappear with a roar; the elements will be destroyed by fire" (2 Peter 3:10–12). But the oldest manuscripts of 2 Peter 3:10 end with "the earth and everything done in it will be laid bare" (found, exposed), not "burned up." Many read renewal: creation "will be liberated from its bondage to decay" (Romans 8:19–23). "I am making everything new" (21:5) says <i>everything</i> new, not new things.`],
  ['Genesis to Revelation', `The garden becomes a city, but the garden is still inside it: a river (Genesis 2:10; Revelation 22:1), the tree of life (Genesis 2:9; Revelation 22:2), gold and precious stones (Genesis 2:12; Revelation 21:18–21), God walking with people (Genesis 3:8; Revelation 21:3), and the curse removed (Genesis 3:17; Revelation 22:3).`],
  ['Heaven comes down',`In the end, people do not go up to heaven: the city comes down, and "God's home is now with people" (21:3). The story ends on a renewed earth. Writers such as N. T. Wright (<i>Surprised by Hope</i>, 2008) have made this point popular: the Christian hope is not escape from the world but its renewal.`]],
 common:[`The Christian hope is to leave the earth and live in heaven.`],
 uncommon:[`Revelation's final scene is God moving in with humanity on a renewed earth.`],
 views:{P:`The new covenant order that began after the old one ended in AD 70, to be completed at the end.`,H:`The eternal state after the end of history.`,F:`A literal new universe after the millennium.`,I:`The final renewal of all things, already tasted in the church.`},
 links:[['New Heaven and New Earth','New Heaven and New Earth'],['World to come','World to come']],
 sources:['bauckham','koester']});

TP({id:'worship', kind:'Ideas', title:'Worship and the Songs of Revelation', ch:[4,5,7,11,14,15,19],
 lead:`Revelation has more songs than any other New Testament book. Many church hymns ("Holy, Holy, Holy," "Crown Him with Many Crowns," Handel's "Hallelujah" chorus, "Worthy Is the Lamb") come from it.`,
 sections:[
  {h:'The songs', table:[['Verses','Singers','Theme'],['4:8','Four living creatures','"Holy, holy, holy"'],['4:11','24 elders','God is worthy as Creator'],['5:9–10','Creatures and elders','The new song: the Lamb is worthy because he was slaughtered'],['5:12–13','Angels; then every creature','"Worthy is the Lamb"'],['7:10–12','The great crowd; angels','"Salvation belongs to our God"'],['11:15–18','Loud voices; the elders','"The kingdom of the world has become the kingdom of our Lord"'],['12:10–12','A loud voice in heaven','The accuser is thrown down'],['15:3–4','The victors by the sea','The song of Moses and of the Lamb'],['16:5–7','The angel of the waters; the altar','"True and just are your judgments"'],['19:1–8','The crowd, elders, creatures','The four hallelujahs; the wedding of the Lamb']]},
  ['Songs explain the story',`Each song comes right before or after a judgment and tells the reader what it means. The book is like a Greek play in which the chorus explains the action.`],
  ['Worship as resistance',`In Asia, people were asked to honor the emperor as "lord and god." Pergamum even had a choir of "hymn singers of the god Augustus" who sang at imperial festivals. Revelation's songs give the emperors' titles only to God and the Lamb: "You are worthy, our Lord and God" (4:11). Choosing whom to worship is the book's central decision (13:4, 8; 14:7, 9).`],
  ['Incense and prayer',`The gold bowls of incense "are the prayers of God's people" (5:8). In 8:3–5 those prayers go up and fire comes down: prayer moves history.`]],
 claude:{title:'Silence is the answer to "How long?"',body:`The martyrs ask "How long?" (6:10). After the sixth seal, heaven falls silent for half an hour (8:1), then incense with "the prayers of all God's people" rises (8:3–4). In the temple, incense was offered while the people prayed outside (Luke 1:10), and later Jewish tradition says the angels' singing stopped so Israel's prayers could be heard. My reading: the silence is heaven pausing everything to listen to the martyrs, and the trumpets are the answer. The incense link is noted by Bauckham; the half-hour as a deliberate "listening" pause is my emphasis.`, refs:'6:10; 8:1–5; Luke 1:10; Psalm 141:2'},
 links:[['Holy, Holy, Holy (hymn)','Holy, Holy, Holy! Lord God Almighty'],['Hallelujah Chorus','Hallelujah (Handel)'],['Crown Him with Many Crowns','Crown Him with Many Crowns']],
 sources:['bauckham','climax','friesen']});

TP({id:'martyrs', kind:'Ideas', title:'Martyrs and Witnesses', ch:[2,6,11,12,17,20],
 lead:`The Greek <i>martys</i> means "witness," someone who testifies in court. By the time Revelation was written, it was starting to mean someone who witnessed to the point of death. Revelation is one of the places where that change can be seen happening.`,
 sections:[
  ['In Revelation',`Jesus is "the faithful witness" (1:5; 3:14). Antipas is "my faithful witness, who was killed" (2:13). Martyrs are under the altar (6:9), the two witnesses are killed (11:7), Babylon is "drunk with the blood of the witnesses to Jesus" (17:6), and the saints win "by the word of their testimony" and by not loving their lives (12:11). Those beheaded "because of their testimony" reign with Christ (20:4).`],
  ['Under the altar',`The souls of the martyrs are "under the altar" (6:9), where the blood of sacrifices was poured (Leviticus 4:7). Their deaths are pictured as offerings to God. They are told to "rest a little longer, until the number of their fellow servants... was complete" (6:11), a hard word that expects more suffering before the end.`],
  {h:'Martyrs connected to Revelation’s churches', table:[['Name','Place','Date','Notes'],['Antipas','Pergamum','Before about 95','Named in 2:13; tradition says roasted in a bronze bull'],['Ignatius of Antioch','Rome','About 110','Wrote on the way to letters to Ephesus, Smyrna and Philadelphia'],['Polycarp','Smyrna','About 155','Knew John; burned at age 86'],['Carpus, Papylus and Agathonice','Pergamum','About 161–169 or 250','Their trial record survives'],['Perpetua and Felicity','Carthage, North Africa','203','A young mother’s own prison diary survives']]},
  ['"The blood of Christians is seed"',`Tertullian, about AD 197, wrote to Roman officials: "The more you mow us down, the more we grow; the blood of Christians is seed" (<i>Apology</i> 50). That is very close to Revelation's logic: witnesses die and are vindicated, and their death converts where plagues could not (11:11–13).`],
  ['How many?',`Some scholars think Revelation expects widespread martyrdom; others note it names only one martyr (Antipas) and is warning about what faithfulness may cost. Roman persecution was mostly local and occasional until the empire-wide campaigns of Decius (250) and Diocletian (303–311).`]],
 views:{P:`The martyrs of Nero's persecution and the first century.`,H:`Martyrs throughout church history, including Protestants killed by the Inquisition.`,F:`Especially the believers martyred during the tribulation.`,I:`Faithful witnesses of every age, whose deaths are victories.`},
 links:[['Christian martyrs','Christian martyrs'],['Antipas of Pergamum','Antipas of Pergamum'],['Perpetua and Felicity','Perpetua and Felicity']],
 sources:['bauckham','blount']});

TP({id:'repentance', kind:'Ideas', title:'Repentance', ch:[2,3,9,16],
 lead:`<i>Metanoeō</i>, "turn around, change your mind." Revelation uses it twelve times: eight times to churches (chapters 2–3), four times of the world that does not repent (9:20–21; 16:9, 11).`,
 sections:[
  {h:'Every call to repent', table:[['Verse','Who','About what'],['2:5 (twice)','Ephesus','Lost first love: "repent and do the works you did at first"'],['2:16','Pergamum','Tolerating Balaam’s teaching'],['2:21 (twice)','Jezebel','Sexual sin; she "refuses to repent"'],['2:22','Her followers','"Unless they repent of her works"'],['3:3','Sardis','Remember, obey, repent'],['3:19','Laodicea','"Those I love I rebuke and discipline. So be earnest and repent"'],['9:20, 21','The world','Did not repent of idols, murders, magic, sexual sin, theft'],['16:9, 11','The world','Cursed God and did not repent']],
   note:'More calls to repent go to churches than to the world. The book’s first audience is the church.'},
  ['The idea',`In the Old Testament the word is <i>shuv</i>, "turn back," the word of every prophet: "Turn back, turn back from your evil ways! Why will you die, people of Israel?" (Ezekiel 33:11). The Greek word adds "change of mind." In Revelation repentance always involves a concrete change: "do the works you did at first" (2:5).`],
  ['The point of the plagues',`The trumpets strike only a third, and the narrator twice notes that people "still did not turn away" (9:20–21). The judgments are meant to bring people back. Even Jezebel was given "time to repent" (2:21).`],
  ['Does it work?',`Yes, once: after the two witnesses rise, the survivors "were terrified and gave glory to the God of heaven" (11:13), the very response the first angel calls for in 14:7. Richard Bauckham argues this is the book's turning point: witness converts where plagues could not. In the earthquake only a tenth of the city falls and 7,000 die, a reversal of Elijah's story where 7,000 were spared and the rest perished (1 Kings 19:18).`]],
 links:[['Repentance','Repentance'],['Metanoia','Metanoia (theology)']],
 sources:['bauckham','climax']});

TP({id:'soon', kind:'Ideas', title:'"Soon" and "Near"', ch:[1,2,3,22],
 lead:`The book begins and ends with urgency: "what must happen soon" (1:1; 22:6), "the time is near" (1:3; 22:10), "I am coming soon" (22:7, 12, 20). Two thousand years later, every reader has to decide what these words meant.`,
 sections:[
  {h:'The time words', table:[['Greek','Meaning','Verses'],['<i>en tachei</i>','"soon," "quickly," "without delay"','1:1; 22:6'],['<i>engys</i>','"near"','1:3; 22:10'],['<i>tachy</i>','"soon," "quickly"','2:16; 3:11; 22:7, 12, 20'],['<i>mellei</i>','"is about to"','1:19; 3:10; 17:8']]},
  ['The problem',`C. S. Lewis called Jesus's saying "this generation will certainly not pass away until all these things have happened" (Mark 13:30) "the most embarrassing verse in the Bible" (<i>The World's Last Night</i>, 1960), and he took it seriously rather than explaining it away. Revelation's "soon" raises the same question.`],
  ['Answers',`<b>Preterist:</b> soon meant soon; much happened in the first century. <b>Futurist:</b> "quickly once it begins," or soon by God's measure: "With the Lord a day is like a thousand years... The Lord is not slow in keeping his promise... he is patient with you" (2 Peter 3:8–9). <b>Idealist:</b> every generation stands near the end, because the decisive victory (the cross) is already won. Some point out that Daniel was told to seal his book because the end was far (Daniel 12:4, 9), while John is told not to seal his (22:10).`],
  ['How it shapes life',`Whatever "soon" means for dates, it means urgency for choices: "Blessed is the one who keeps the words of the prophecy" (22:7). The book's response to "I am coming soon" is not calculation but prayer: "Amen. Come, Lord Jesus" (22:20).`]],
 links:[['Imminence','Imminence'],['C. S. Lewis','C. S. Lewis']],
 sources:['gregg','koester']});

TP({id:'exodus-pattern', kind:'Ideas', title:'The New Exodus', ch:[1,8,9,11,12,15,16],
 lead:`Revelation retells the Exodus. God's people are freed from a new Pharaoh by the blood of a Lamb, carried through the wilderness on eagles' wings, and sing on the far shore of a sea.`,
 sections:[
  {h:'The parallels', table:[['Exodus','Revelation'],['The Passover lamb; blood on the doors (12)','The slaughtered Lamb; washed in his blood (5:6, 9; 7:14)'],['Pharaoh, the oppressor king','The beast'],['A kingdom of priests (19:6)','"A kingdom and priests" (1:6; 5:10)'],['Plagues: blood, frogs, sores, hail, locusts, darkness (7–10)','Trumpets and bowls: blood, frogs, sores, hail, locusts, darkness (8–9; 16)'],['"Let my people go"','"Come out of her, my people" (18:4)'],['Eagles’ wings; fed in the wilderness (19:4; 16)','The woman given eagle’s wings, fed in the wilderness (12:6, 14)'],['The song of Moses by the sea (15)','The song of Moses and the Lamb by the sea of glass (15:2–3)'],['Thunder, lightning, trumpet at Sinai (19:16)','Lightning, thunder before the throne (4:5)'],['The tabernacle filled with glory (40:34–35)','The temple filled with smoke and glory (15:8)'],['Manna in the wilderness (16)','Hidden manna (2:17)'],['The promised land','The new Jerusalem']]},
  ['What it means',`The point is not that history repeats but that God acts the same way: he hears the cry of the oppressed (Exodus 3:7; Revelation 6:10) and brings them out. For first-century Christians under Rome, the Exodus told them who they were: not subjects of the empire but a people on the way out of slavery.`],
  ['A hardened heart',`Pharaoh's heart was hardened through the plagues. Revelation notes four times that people "did not repent" (9:20–21; 16:9, 11). In both stories the plagues reveal hearts as much as they punish.`]],
 links:[['The Exodus','The Exodus'],['Plagues of Egypt','Plagues of Egypt']],
 sources:['bauckham','beale']});

TP({id:'imperial-cult', kind:'Ideas', title:'The Imperial Cult', ch:[2,3,13,17,18],
 lead:`The worship of Roman emperors, living or dead, alongside the goddess Roma. It was especially strong in the province of Asia, where all seven churches were, and it is the most likely background for the beast, its image and its mark.`,
 sections:[
  {h:'Emperor worship in the seven cities', table:[['City','Imperial temple or honor'],['Pergamum','First temple in Asia to Rome and Augustus (29 BC); a choir of "hymn singers of the god Augustus"'],['Smyrna','Temple to Tiberius, Livia and the Senate (won in AD 26)'],['Ephesus','Temple of the Flavian emperors (about AD 89–90), with a colossal statue'],['Sardis','Honors to Tiberius after the earthquake; a later imperial temple'],['Philadelphia','Renamed Neocaesarea and Flavia after emperors'],['Laodicea','Imperial festivals and games'],['Thyatira','Priests of the emperors attested in inscriptions']]},
  ['"Good news" about a god',`In 9 BC the cities of Asia changed their calendar so the year began on Augustus's birthday. An inscription from Priene, near Ephesus, says the birthday of "the god" was "the beginning of the good news (<i>euangelia</i>) for the world." Christians proclaimed a different "good news" about a different Son of God.`],
  ['Pressure on Christians',`Not worshiping meant skipping city festivals and trade-guild meals, which looked disloyal and could cost work. Pliny's letter to Trajan (about AD 112) describes Christians in nearby Bithynia brought to trial; those who refused to offer incense and wine to the emperor's image and curse Christ were executed (<i>Letters</i> 10.96). Pliny notes that "those who are really Christians cannot be forced" to do these things.`],
  ['In Revelation',`The land beast enforces worship of the sea beast and its image (13:12–15). The songs give "worthy," "Lord and God," and "Savior" to God alone, titles used of emperors. The question "Who is like the beast?" (13:4) parodies Israel's song, "Who is like you, LORD, among the gods?" (Exodus 15:11).`]],
 views:{P:`The direct background of chapters 13 and 17.`,H:`The model for later persecuting powers, especially the papacy.`,F:`A preview of a future world religion centered on the Antichrist.`,I:`The permanent temptation to treat political power as divine.`},
 links:[['Imperial cult of ancient Rome','Imperial cult of ancient Rome'],['Pliny the Younger on Christians','Pliny the Younger'],['Temple of the Sebastoi','Temple of the Sebastoi'],['Priene calendar inscription','Priene calendar inscription']],
 sources:['friesen','koester','hemer']});

TP({id:'overcomer', kind:'Ideas', title:'"The One Who Wins the Victory"', ch:[2,3,5,12,15,17,21],
 lead:`<i>Ho nikōn</i>, "the one who conquers," ends every letter (2:7, 11, 17, 26; 3:5, 12, 21). The same verb is used of the Lamb (5:5) and of the beast (11:7; 13:7). Revelation is about two kinds of winning.`,
 sections:[
  {h:'The seven promises and their fulfillment', table:[['Church','Promise','Fulfilled'],['Ephesus (2:7)','Eat from the tree of life','The tree in the city (22:2)'],['Smyrna (2:11)','Not harmed by the second death','"The second death has no power over them" (20:6)'],['Pergamum (2:17)','Hidden manna, white stone, new name','"His name will be on their foreheads" (22:4)'],['Thyatira (2:26–28)','Authority over nations; the morning star','Reign forever (22:5); Jesus the morning star (22:16)'],['Sardis (3:5)','White clothes; name kept in the book of life','Only those in the Lamb’s book enter (21:27)'],['Philadelphia (3:12)','A pillar in God’s temple; the city’s name','The new Jerusalem comes down (21:2, 10)'],['Laodicea (3:21)','Sit with Jesus on his throne','"They will reign forever and ever" (22:5)']],
   note:'The final summary: "The one who wins the victory will inherit all this" (21:7).'},
  ['How you win',`Not by force. "They defeated him by the blood of the Lamb and by the word of their testimony. They did not love their lives so much that they were afraid to die" (12:11). The beast "conquers" the saints by killing them (13:7), and in the same act they conquer the beast (15:2). The Lamb "has won the victory" (5:5) by being slaughtered.`],
  ['Victory in Roman eyes',`Nike, the winged goddess of victory, was everywhere in the Roman world: on coins, monuments and military standards. Emperors celebrated victories with parades and arches. Athletes who won at the games received wreaths (<i>stephanoi</i>), the word Revelation uses for "crowns" (2:10; 3:11). John takes the empire's favorite word and redefines it.`]],
 links:[['Nike (mythology)','Nike (mythology)'],['Victoria (mythology)','Victoria (mythology)']],
 sources:['bauckham','gorman']});

TP({id:'dating', kind:'Ideas', title:'When Was Revelation Written?', ch:[1,11,13,17],
 lead:`Two main dates: about AD 95 under Domitian, or the late 60s under Nero, before Jerusalem fell. The answer matters a great deal for the preterist view, which reads much of the book as a prophecy of AD 70.`,
 sections:[
  {h:'The evidence', table:[['Evidence','Points to'],['Irenaeus: the vision was seen "toward the end of Domitian’s reign"','About AD 95'],['Clement of Alexandria, Eusebius: John returned from exile after "the tyrant" died','About AD 96'],['Laodicea is rich and needs nothing, after its AD 60 earthquake','Later, when it had rebuilt'],['Smyrna’s church seems well established; Polycarp later implies it did not exist in Paul’s day','Later'],['The imperial cult in Asia is strong; Ephesus’s Flavian temple built about 89–90','80s–90s'],['"Babylon" as a name for Rome appears in Jewish writings only after AD 70','After 70'],['John measures a temple that seems to be standing (11:1–2)','Before 70'],['"Five kings have fallen, one is" (17:10), if counted from Augustus or Julius','Nero, Galba or Vespasian (60s–70s)'],['666 fits Nero Caesar','Possibly 60s, or later using Nero as a pattern'],['Some read Irenaeus’s "it was seen" as "he (John) was seen"','Ambiguous']]},
  ['The late date (about AD 95)',`Irenaeus (about AD 180), who knew Polycarp, who knew John, says the vision was seen "toward the end of Domitian's reign" (<i>Against Heresies</i> 5.30.3). The churches seem well established, and the imperial cult in Asia matches the 80s–90s. Most scholars hold this date.`],
  ['The early date (AD 64–70)',`John measures a temple that seems still standing (11:1–2). The seven kings could make the sixth king Nero or Galba. Preterists like Kenneth Gentry argue for this date, and it was common among scholars in the 1800s.`]],
 links:[['Book of Revelation: date','Book of Revelation'],['Domitian','Domitian'],['Nero','Nero']],
 sources:['gentry','koester','irenaeus','aune']});

TP({id:'textual-history', kind:'Words', title:'How the Text Came Down to Us', ch:[13,22],
 lead:`Revelation has fewer Greek manuscripts than any other New Testament book, about 310, and it was not read in Eastern church services. Its text has some famous puzzles.`,
 sections:[
  {h:'Important manuscripts', table:[['Manuscript','Date','Notes'],['Papyrus 98','Perhaps 100s','A few verses of chapter 1; possibly the oldest'],['Papyrus 47','200s','Large parts of 9:10–17:2'],['Papyrus 115','About 300','Fragments of 2–15; reads 616 in 13:18'],['Codex Sinaiticus','300s','The oldest complete Revelation'],['Codex Alexandrinus','400s','Usually considered the best witness for Revelation'],['Codex Ephraemi','400s','A palimpsest: the Bible was scraped off and overwritten, but can still be read'],['Andreas of Caesarea','500s','A Greek commentary whose text shaped most later copies'],['Minuscule 2814','1100s','Erasmus’s only manuscript, missing the last page']]},
  ['Erasmus and the last page',`When Erasmus printed the first Greek New Testament in 1516, he had one manuscript of Revelation (minuscule 2814), and it was missing the last page, 22:16–21. He translated those verses back into Greek from the Latin Vulgate. Several of his readings, such as "book of life" in 22:19, passed into the Textus Receptus and the KJV.`],
  ['Key variants',`666 or 616 (13:18). "Wash their robes" or "do his commandments" (22:14). "The kingdom" or "the kingdoms" (11:15). "I stood" or "he stood" on the sand (12:18 or 13:1). "Them" or "us" (5:10). "Your wife Jezebel" or "the woman Jezebel" (2:20).`],
  ['Which text do Bibles use?',`The KJV and NKJV follow the Textus Receptus. Most modern Bibles (ESV, NIV, NASB, CSB, NLT) follow the critical text (Nestle-Aland, UBS). The SBLGNT shown on this site is a critical text. The World English Bible follows the Majority Text, the reading of most manuscripts.`]],
 links:[['Textus Receptus','Textus Receptus'],['Novum Instrumentum omne','Novum Instrumentum omne'],['Minuscule 2814','Minuscule 2814'],['Codex Alexandrinus','Codex Alexandrinus']],
 sources:['metzger']});

/* ---------- topic pages: people and beings ---------- */
TP({id:'john', kind:'People', title:'John, the Writer', ch:[1,22],
 lead:`The writer calls himself John four times (1:1, 4, 9; 22:8): "your brother and partner in suffering," a prophet exiled on Patmos. He never calls himself an apostle, and he never explains which John he is, which suggests his readers knew him well.`,
 sections:[
  {h:'Who did early Christians think he was?', table:[['Writer','Date','Said'],['Justin Martyr','about 150','"John, one of the apostles of Christ" (<i>Dialogue with Trypho</i> 81.4)'],['Irenaeus','about 180','John the disciple of the Lord, seen near the end of Domitian’s reign'],['Gaius of Rome','about 200','Reportedly said it was written by the heretic Cerinthus'],['Dionysius of Alexandria','about 250','A holy man named John, but not the apostle; the Greek is too different'],['Eusebius','about 325','Perhaps John the Elder; listed the book as "disputed"']]},
  ['Which John?',`<b>John the apostle</b>, son of Zebedee, was the view of Justin and Irenaeus and of most of the church through history. <b>John the Elder</b>, a different leader in Asia mentioned by Papias (quoted in Eusebius, <i>Church History</i> 3.39.4), was proposed by Dionysius. <b>Another prophet named John</b>, otherwise unknown, is the view of many modern scholars. All agree he was a Jewish Christian prophet with deep knowledge of the Old Testament and close ties to the churches of Asia.`],
  ['His Greek',`Dionysius noticed that Revelation's Greek is rough and very different from the Gospel of John, though the two share key words like "Lamb," "Word," "witness" and "living water." Revelation's grammar sometimes breaks the normal rules, for example "from the one who is" in 1:4, where the Greek keeps God's name in the subject form even after "from." Many scholars think this is deliberate, showing respect for the divine name (compare Exodus 3:14), or the Greek of a man who thought in Hebrew or Aramaic.`],
  ['A disputed book',`Because of its authorship and its use by groups predicting the end, Revelation was slow to be accepted in the Eastern churches. Some Greek lists of Scripture leave it out, and it is still not read in the Orthodox Sunday lectionary. In the West it was accepted early. At the Reformation, Luther wrote in 1522 that his "spirit cannot accommodate itself to this book," though he softened this later; Zwingli doubted it, and Calvin wrote commentaries on every New Testament book except Revelation (and 2 and 3 John).`],
  ['A prophet',`John calls his book "prophecy" seven times and is told "you must prophesy again" (10:11). He stands in line with Ezekiel and Daniel, receiving visions, eating a scroll, and being told what to write.`]],
 links:[['John of Patmos','John of Patmos'],['John the Apostle','John the Apostle'],['John the Presbyter','John the Presbyter'],['Dionysius of Alexandria','Dionysius of Alexandria'],['Development of the New Testament canon','Development of the New Testament canon']],
 sources:['koester','aune','irenaeus']});

TP({id:'son-of-man', kind:'People', title:'"One Like a Son of Man"', ch:[1,14],
 lead:`John's first vision of Jesus (1:13–16) and the harvester on the cloud (14:14) both use Daniel's phrase "one like a son of man" (Daniel 7:13). Every detail of the first vision comes from the Old Testament, and most of them reappear in the letters to the churches.`,
 sections:[
  {h:'The portrait and where it comes from', table:[['Feature','Old Testament source','Used again in'],['Long robe and gold sash (1:13)','The high priest (Exodus 28:4); the angel of Daniel 10:5','—'],['Hair white as wool and snow (1:14)','The Ancient of Days (Daniel 7:9)','—'],['Eyes like flames of fire (1:14)','Daniel 10:6','Thyatira (2:18); the rider (19:12)'],['Feet like polished bronze (1:15)','Daniel 10:6; Ezekiel 1:7','Thyatira (2:18)'],['Voice like rushing waters (1:15)','God’s voice (Ezekiel 43:2)','—'],['Seven stars in his right hand (1:16)','—','Ephesus (2:1); Sardis (3:1)'],['Sharp two-edged sword from his mouth (1:16)','Isaiah 11:4; 49:2','Pergamum (2:12, 16); the rider (19:15)'],['Face like the sun (1:16)','Judges 5:31; the Transfiguration (Matthew 17:2)','—'],['First and Last, died and alive (1:17–18)','Isaiah 44:6','Smyrna (2:8)'],['Keys of death and Hades (1:18)','Isaiah 22:22','Philadelphia, key of David (3:7)']]},
  ['God’s features on a human figure',`In Daniel 7, the "one like a son of man" comes to the Ancient of Days, whose hair is white like wool. In Revelation 1, the son of man himself has the white hair. John fuses the two figures: Jesus shares God's identity. This is one of the earliest and boldest statements of Jesus's divinity in the New Testament, made by picture rather than by argument.`],
  ['Jesus’s favorite title',`"Son of Man" is the title Jesus used for himself most often in the Gospels, about eighty times. Before the high priest he said, "You will see the Son of Man sitting at the right hand of the Mighty One and coming on the clouds of heaven" (Mark 14:62). In Jewish writings of the time, especially the part of 1 Enoch called the Similitudes (chapters 37–71), the Son of Man was a heavenly judge hidden before creation. 4 Ezra 13 pictures "something like a man" rising from the sea and flying with the clouds.`],
  ['The harvester',`In 14:14 "one like a son of man" sits on a white cloud with a gold crown and a sharp sickle, reaping the earth. Most readers take him as Christ gathering his people; a few, noting that an angel gives him orders (14:15), think he is an angel.`]],
 views:{P:`The risen Christ present with his churches and coming in judgment on his enemies soon.`,H:`Christ ruling his church through all history.`,F:`Christ in glory, as he will appear at his return.`,I:`Christ as he really is, always present among his churches.`},
 links:[['Son of man','Son of man (Christianity)'],['Ancient of Days','Ancient of Days'],['Book of Enoch','Book of Enoch']],
 sources:['bauckham','beale']});

TP({id:'lamb', kind:'People', title:'The Lamb', ch:[5,6,7,12,13,14,17,19,21,22],
 lead:`<i>Arnion</i>, "lamb," is Revelation's main name for Jesus: 29 uses, 28 of them for Christ. The other one is the land beast, which has horns "like a lamb" (13:11). The whole book can be read as the story of how a slaughtered lamb rules the world.`,
 sections:[
  ['Lion and Lamb',`An elder announces "the Lion of the tribe of Judah, the Root of David" (5:5, from Genesis 49:9 and Isaiah 11:1, 10), and John turns and sees a Lamb "that looked as if it had been slaughtered" (5:6). John hears one thing and sees another, and the second explains the first. The book redefines power: the Messiah wins by dying.`],
  ['Which lamb?',`The Passover lamb (Exodus 12), whose blood marked the doors and freed Israel from Egypt; Revelation's plagues and song of Moses keep this in view. The lamb led to slaughter (Isaiah 53:7). "The Lamb of God who takes away the sin of the world" (John 1:29, though John's Gospel uses a different Greek word, <i>amnos</i>).`],
  ['A lamb with horns',`The Lamb has "seven horns and seven eyes" (5:6): all power and all sight, from Zechariah's "seven eyes of the LORD that range throughout the earth" (Zechariah 4:10). A horned, fighting lamb was not new: in 1 Enoch's "Animal Apocalypse" the Jewish people are sheep, and a ram with a great horn leads them in battle (1 Enoch 90:9–12). John keeps the battle but changes the weapon: this lamb has been slaughtered.`],
  {h:'The Lamb and the beast', table:[['The Lamb','The beast'],['"As if slaughtered" (5:6)','A head "as if slaughtered," healed (13:3)'],['Seven horns, seven eyes (5:6)','Ten horns, seven heads (13:1)'],['Receives authority from God (5:7)','Receives authority from the dragon (13:2)'],['Worshiped by every creature (5:13)','Worshiped by those not in the book of life (13:8)'],['Followers sealed with his name (14:1)','Followers marked with its name (13:17)'],['Wins by dying','Wins by killing']]},
  ['What the Lamb does',`He is worshiped (5:8–14), opens the seals (6:1), causes "the anger of the Lamb" (6:16), shepherds (7:17), stands on Zion (14:1), conquers as "Lord of lords and King of kings" (17:14), marries (19:7), lights the city (21:23), and shares God's throne (22:1).`]],
 claude:{title:'Twenty-eight is four sevens',body:`Richard Bauckham noted that "Lamb" is used for Christ exactly 28 times, 7 × 4: seven for completeness, four for the world. I counted in the Greek text and found the same: 29 uses of <i>arnion</i>, one of which (13:11) is the beast. If the count is intended, John is saying in numbers what he says in words: the Lamb's victory is complete and worldwide.`, refs:'5:6; 13:11; 22:3'},
 links:[['Lamb of God','Lamb of God'],['Lion of Judah','Lion of Judah'],['Passover sacrifice','Passover sacrifice']],
 sources:['bauckham','gorman','climax']});

TP({id:'angels', kind:'People', title:'Angels in Revelation', ch:[1,7,8,10,14,18,20,22],
 lead:`<i>Angelos</i> means "messenger." Revelation mentions angels 67 times, more than any other book of the Bible. They carry messages, blow trumpets, pour bowls, hold back winds, guard gates and lead worship.`,
 sections:[
  {h:'What angels do in Revelation', table:[['Role','Examples'],['Bring the revelation','"He sent his angel to his servant John" (1:1; 22:6, 16)'],['Over the churches','"The seven stars are the angels of the seven churches" (1:20)'],['Lead worship','Myriads around the throne (5:11; 7:11)'],['Control nature','Angels of the four winds (7:1), of fire (14:18), of the waters (16:5)'],['Carry out judgments','Seven trumpets (8–11), seven bowls (16)'],['Proclaim','Three angels with three messages (14:6–11)'],['Fight','Michael and his angels against the dragon (12:7)'],['Guard','Twelve angels at the city gates (21:12)']]},
  ['The angels of the churches',`"The seven stars are the angels of the seven churches" (1:20). They may be guardian angels, or human messengers or leaders. Each letter scolds its angel for the church's sins, which suggests the angel and the church share one identity.`],
  ['The seven before God',`"The seven angels who stand before God" (8:2) recall Raphael's words in Tobit 12:15: "I am Raphael, one of the seven angels who stand ready and enter before the glory of the Lord." 1 Enoch 20 names seven archangels: Uriel, Raphael, Raguel, Michael, Sariel, Gabriel and Remiel. Revelation names only Michael (12:7) and Abaddon/Apollyon, the angel of the abyss (9:11).`],
  ['The mighty angel',`The angel of chapter 10 is "wrapped in a cloud, with a rainbow over his head; his face was like the sun, and his legs like pillars of fire" (10:1). Some readers think he is Christ himself, since these are the features of the son of man (1:15–16) and of God's throne (4:3). Most think he is a great angel reflecting Christ's glory.`],
  ['Not to be worshiped',`Twice John falls down to worship an angel and is stopped: "Don't do that! I am a servant with you and with your brothers and sisters... Worship God!" (19:10; 22:8–9). Some early Christians were tempted to worship angels (Colossians 2:18), and some Jewish writings show the same caution.`]],
 views:{P:`Angels are God's agents in the first-century judgments.`,H:`Angels sometimes stand for human figures in church history, such as reformers or missionaries.`,F:`Literal angels carrying out the end-time judgments.`,I:`Angels show that heaven is behind the events of every age.`},
 links:[['Angels in Christianity','Angels in Christianity'],['Seven Archangels','Seven Archangels'],['Book of Tobit','Book of Tobit']],
 sources:['aune','koester']});

TP({id:'living-creatures', kind:'People', title:'The Four Living Creatures', ch:[4,5,6,15,19],
 lead:`Around God's throne are four <i>zōa</i>, "living ones," like a lion, an ox, a human and an eagle, each with six wings and covered with eyes (4:6–8). They never stop saying, "Holy, holy, holy."`,
 sections:[
  {h:'Three visions compared', table:[['','Ezekiel 1 and 10 (cherubim)','Isaiah 6 (seraphim)','Revelation 4'],['How many','Four','Two or more','Four'],['Faces','Each has four: human, lion, ox, eagle','Not described','One each: lion, ox, human, eagle'],['Wings','Four each','Six each','Six each'],['Eyes','Wheels full of eyes','—','Covered with eyes'],['Cry','—','"Holy, holy, holy"','"Holy, holy, holy"']]},
  ['Meaning',`Many read them as all living creation worshiping God: wild animals, tame animals, humans and birds. A Jewish saying, recorded later, calls these four the mightiest of their kinds: the lion among wild beasts, the ox among tame ones, the eagle among birds, and humanity over all. In Revelation they also call out the four horsemen ("Come!" 6:1–7) and hand the bowls to the angels (15:7): creation itself takes part in judging those who destroy it (11:18).`],
  ['The four Gospels',`From Irenaeus and Jerome on, Christian art gave them to the Gospel writers. The usual pairing is Matthew the man, Mark the lion, Luke the ox and John the eagle. You can see them in medieval Bibles, church windows and the Book of Kells.`],
  ['KJV wording',`The KJV calls them "four beasts," the same word it uses for the monster of chapter 13, though the Greek words differ (<i>zōa</i> versus <i>thērion</i>). Modern translations say "living creatures."`]],
 claude:{title:'Israel’s camp around the throne',body:`In the wilderness Israel camped in four groups around the tabernacle (Numbers 2). Medieval Jewish tradition (for example Ibn Ezra, and Numbers Rabbah 2:7) gives the lead tribes banners: Judah a lion, Reuben a man, Ephraim an ox, Dan an eagle. If those banners are older than the written sources, the throne room is Israel's camp around God, and "the Lion of the tribe of Judah" (5:5) is named right beside the lion-faced creature. The banner tradition is written down later than Revelation, so this is a possible echo, not a proof.`, refs:'Numbers 2:1–34; 4:6–8; 5:5'},
 links:[['Living creatures','Living creatures (Bible)'],['Cherub','Cherub'],['Seraph','Seraph'],['Tetramorph','Tetramorph']],
 sources:['aune','beale']});

TP({id:'elders', kind:'People', title:'The Twenty-Four Elders', ch:[4,5,7,11,19],
 lead:`Twenty-four elders in white, with gold crowns, sit on thrones around God (4:4). They fall down, lay their crowns before the throne, hold harps and bowls of incense, and sing.`,
 sections:[
  {h:'Where they appear', table:[['Verse','What they do'],['4:4, 10–11','Sit on thrones; lay down their crowns; sing "You are worthy"'],['5:5','One tells John not to weep: the Lion has won'],['5:8–10','Hold harps and bowls of incense, "the prayers of God’s people"; sing the new song'],['7:13–14','One explains who the great crowd in white is'],['11:16–18','Worship when the seventh trumpet sounds'],['19:4','Say "Amen. Hallelujah!"']]},
  ['Who are they?',`<b>The whole people of God:</b> 12 tribes plus 12 apostles, which matches the city's 12 gates and 12 foundations (21:12–14). <b>Angels</b> who lead heavenly worship; one acts as an interpreter, the way angels do in Daniel (7:13). <b>The raptured church</b> in heaven, crowned and seated (many dispensationalists). <b>A heavenly council</b> like the one in Isaiah 24:23, "before his elders, gloriously."`],
  ['Twenty-four in the temple',`David divided the priests into 24 divisions to serve in turn (1 Chronicles 24:7–19), and the temple musicians into 24 groups who "prophesied with harps" (1 Chronicles 25:1–31). The elders hold harps and bowls of incense, which are exactly the tasks of musicians and priests.`],
  ['"Made them" or "made us"?',`In the KJV the elders sing that Christ "hast redeemed us to God... and hast made us unto our God kings and priests" (5:9–10). The oldest manuscripts read "them," not "us." If "us" is right, the elders are redeemed humans; if "them" is right, they may be angels singing about humans. Most modern translations follow "them."`],
  ['Laying down crowns',`Their crowns are victory wreaths (<i>stephanoi</i>). Laying them before the throne echoes the way kings submitted to Rome: the Armenian king Tiridates laid his diadem before Nero's statue (Tacitus, <i>Annals</i> 15.29). Every honor they have, they hand back to God.`]],
 views:{P:`The leaders of the people of God, Old and New Testament, worshiping in heaven.`,H:`The church in heaven through history.`,F:`The raptured church, crowned and rewarded, already in heaven before the tribulation.`,I:`The whole people of God, represented in worship around the throne.`},
 links:[['Twenty-four elders','Twenty-four elders'],['Priestly divisions','Priestly divisions']],
 sources:['beale','walvoord','aune']});

TP({id:'michael', kind:'People', title:'Michael', ch:[12],
 lead:`The archangel who leads heaven's armies and throws the dragon out of heaven (12:7–9). His name is a question: <i>Mi-ka-el</i>, "Who is like God?"`,
 sections:[
  ['In Scripture',`Daniel calls him "one of the chief princes" and "the great prince who protects your people," who will arise in a time of distress like no other (Daniel 10:13, 21; 12:1). Jude 9 has him disputing with the devil over Moses's body, a story from a lost Jewish book called the Assumption of Moses. Paul's "voice of the archangel" at Christ's return (1 Thessalonians 4:16) may refer to him.`],
  ['In Jewish writings',`1 Enoch lists him among seven archangels, set over Israel (1 Enoch 20:5). In the Dead Sea Scrolls' <i>War Scroll</i>, God raises up "the dominion of Michael" among the angels and the kingdom of Israel among people for the final battle against darkness (1QM 17:6–7). Revelation 12 draws on this hope.`],
  ['When was the war in heaven?',`Readers disagree. (1) At the beginning, when Satan first rebelled; this is the version popularized by Milton's <i>Paradise Lost</i>. (2) At Jesus's death and exaltation: the war follows the child being "snatched up to God" (12:5), and the victory song says "now the salvation... has come" because the saints won "by the blood of the Lamb" (12:10–11); compare Jesus's words "I saw Satan fall like lightning" (Luke 10:18) and "now the ruler of this world will be driven out" (John 12:31). (3) In the future, in the middle of the tribulation (many futurists).`],
  ['Michael and Jesus',`Jehovah's Witnesses identify Michael with the pre-human Christ, whom they see as a created being. Seventh-day Adventists also use "Michael" as a name for Christ, but affirm that he is fully God and not an angel. Most Christians see Michael as an angel acting because of the Lamb's victory.`],
  ['In later tradition',`Michael became the most honored angel in Christian devotion: Mont-Saint-Michel in France and Saint Michael's Mount in England, countless churches, and the Catholic "Prayer to Saint Michael" composed under Pope Leo XIII in 1886.`]],
 links:[['Michael (archangel)','Michael (archangel)'],['War in Heaven','War in Heaven'],['War Scroll','War Scroll']],
 sources:['koester','aune']});

TP({id:'dragon', kind:'People', title:'The Dragon', ch:[12,13,16,20],
 lead:`"That ancient serpent called the Devil and Satan, who leads the whole world astray" (12:9). This is one of the few symbols Revelation decodes outright, and the dragon is the enemy behind every other enemy in the book.`,
 sections:[
  {h:'His names', table:[['Name','Meaning','Verses'],['The great dragon','<i>Drakōn</i>, a huge serpent','12:3, 9; 20:2'],['The ancient serpent','The snake of Eden','12:9; 20:2'],['The devil','<i>Diabolos</i>, "slanderer"','12:9, 12; 20:2, 10'],['Satan','Hebrew "adversary, accuser"','2:9, 13, 24; 3:9; 12:9; 20:2, 7'],['The accuser','Prosecutor in God’s court (Job 1–2; Zechariah 3:1)','12:10'],['The deceiver','"Who leads the whole world astray"','12:9; 20:3, 8, 10']]},
  ['His features',`Red, with seven heads and seven royal crowns and ten horns (12:3). The crowns sit on his heads, not his horns (the sea beast has them on its horns, 13:1): he claims to be king. Red may stand for murder: Jesus called the devil "a murderer from the beginning" (John 8:44). His tail sweeps a third of the stars to the earth (12:4), like the arrogant horn in Daniel 8:10.`],
  ['Background',`The serpent of Eden (Genesis 3), and the promise that the woman's offspring would crush its head (Genesis 3:15). Leviathan, "the twisting serpent," the "dragon of the sea" (Isaiah 27:1; Psalm 74:13–14). Pharaoh as "the great dragon lying in his rivers" (Ezekiel 29:3). The ancient combat myths of a sea monster defeated by a god (see "End-times stories from other traditions").`],
  ['His career in Revelation',`He waits to devour the child (12:4), loses the war in heaven (12:7–9), is thrown down to earth "filled with fury, because he knows his time is short" (12:12), pursues the woman (12:13–17), gives his power to the beast (13:2), sends out frog-like spirits to gather the kings (16:13), is bound for a thousand years (20:2–3), is released, deceives the nations again, and is thrown into the lake of fire forever (20:7–10).`]],
 views:{P:`Satan working through Rome and through Jerusalem's leaders against the early church.`,H:`Satan working through pagan Rome and later through other powers in history.`,F:`Satan's final, intensified activity during the tribulation, then his literal binding.`,I:`The spiritual power behind every persecuting system, already defeated by the cross.`},
 links:[['Satan','Satan'],['Leviathan','Leviathan'],['Chaoskampf','Chaoskampf'],['The Great Red Dragon paintings','The Great Red Dragon paintings']],
 sources:['collins','koester']});

TP({id:'beasts', kind:'People', title:'The Beasts', ch:[11,13,17,19],
 lead:`<i>Thērion</i>, "wild beast," appears 39 times. Revelation has a beast from the abyss (11:7), a beast from the sea (13:1), a beast from the earth (13:11, later called the false prophet), and a scarlet beast (17:3) that seems to be the sea beast in its final form. The study page "The beasts" lays out every reading; this page summarizes.`,
 sections:[
  {h:'The two beasts of chapter 13', table:[['','Beast from the sea (13:1–10)','Beast from the earth (13:11–18)'],['Looks like','Leopard, bear, lion; ten horns, seven heads','Two horns like a lamb; speaks like a dragon'],['Power from','The dragon','Acts on the first beast’s authority'],['Does','Blasphemes, makes war on the saints, rules every nation','Performs signs, makes an image, enforces the mark'],['Later called','The beast (17; 19)','The false prophet (16:13; 19:20)'],['First-century match','Rome and its emperors','The priests and promoters of emperor worship'],['End','Thrown alive into the lake of fire (19:20)','Thrown alive into the lake of fire (19:20)']]},
  ['The sea beast',`Leopard body, bear's feet, lion's mouth, ten crowned horns, seven heads (13:1–2): all four of Daniel's beasts rolled into one (Daniel 7:3–8). Daniel says his beasts are kingdoms (Daniel 7:17, 23). Its first referent is almost certainly Rome; futurists add a final world empire and ruler.`],
  ['"Names that insulted God"',`The beast's heads carry "blasphemous names" (13:1). Roman emperors took titles like <i>divi filius</i> ("son of a god"), <i>Sebastos</i> ("one to be worshiped," the Greek for Augustus), "Savior" and "Lord." Domitian liked to be addressed as "our lord and god" (Suetonius, <i>Domitian</i> 13). Coins and inscriptions in Asia carried these titles everywhere.`],
  ['Its healed wound',`One head was "slaughtered" but healed (13:3), the same Greek as the Lamb "slaughtered" (5:6). The beast copies the death and resurrection of Christ. Many link this to the Nero legend (see Nero); others to the empire's near-collapse in the civil wars of AD 68–69, after which it revived under Vespasian. The Roman poet Juvenal called Domitian "a bald Nero" (<i>Satires</i> 4.38).`],
  ['The scarlet beast',`It "once was, now is not, and is about to come up out of the abyss" (17:8), a parody of God "who is, who was, and who is coming" (1:4). Its seven heads are seven mountains and seven kings (17:9–10), and its ten horns are ten kings who will turn on the prostitute (17:16).`]],
 views:{P:`Rome, or Nero in particular; the land beast as the imperial priesthood or Jerusalem's leaders.`,H:`Pagan Rome and then papal Rome; the land beast as the papacy's clergy.`,F:`A future world ruler (the Antichrist) and his religious ally.`,I:`Political power that claims divine honor, and the religion and propaganda that serve it, in every age.`},
 common:[`The beast is a single future dictator.`,`The beast was Rome, and stands for every empire like it.`],
 uncommon:[`In Daniel, beasts are kingdoms, not individuals; the beast is purely a system that takes many forms.`],
 links:[['The Beast (Revelation)','The Beast (Revelation)'],['Daniel 7','Daniel 7'],['Nero Redivivus legend','Nero Redivivus legend'],['Imperial cult of ancient Rome','Imperial cult of ancient Rome']],
 sources:['bauckham','koester','beale']});

TP({id:'false-prophet', kind:'People', title:'The False Prophet', ch:[13,16,19,20],
 lead:`The beast from the earth, with two horns like a lamb and a dragon's voice (13:11). From 16:13 on it is called "the false prophet." It is the propaganda minister of the beast: religious, persuasive and deadly.`,
 sections:[
  {h:'What it does', table:[['Action','Verse','A copy of'],['Makes everyone worship the first beast','13:12','The Spirit leading people to worship Christ'],['Calls fire down from heaven','13:13','Elijah on Mount Carmel (1 Kings 18:38); the two witnesses (11:5)'],['Gives breath to the image, which speaks','13:15','God breathing life into Adam (Genesis 2:7); the witnesses receiving "the breath of life" (11:11)'],['Kills those who will not worship','13:15','Nebuchadnezzar’s gold statue (Daniel 3)'],['Puts a mark on hand or forehead','13:16','God’s seal (7:3)'],['Sends out frog-like spirits','16:13–14','The Egyptian frogs (Exodus 8)']]},
  ['Background',`Deuteronomy 13:1–3: a prophet who gives a sign that comes true but leads people to other gods is still false. Jesus warned, "False messiahs and false prophets will appear and perform great signs and wonders to deceive, if possible, even the elect" (Matthew 24:24). Paul speaks of the lawless one coming "with all kinds of counterfeit miracles" (2 Thessalonians 2:9).`],
  ['First-century setting',`In Asia, the provincial council and local elites built emperor temples, paid for festivals and served as high priests of the cult. They made worship of the emperor a civic duty. Talking statues and faked wonders were well known. Lucian describes Alexander of Abonoteichus, a "false prophet" of the 100s AD, who made a tame snake with a puppet head called Glycon that gave oracles through a hidden tube (<i>Alexander the False Prophet</i>). Christian stories said Simon Magus made statues walk.`],
  ['Lamb’s horns, dragon’s voice',`It looks like the Lamb and sounds like the dragon. Jesus warned of "false prophets who come to you in sheep's clothing, but inwardly are ravenous wolves" (Matthew 7:15). The danger is not obvious evil but religion that serves power.`]],
 views:{P:`The priests of the imperial cult in Asia, or the Jewish leaders who cooperated with Rome.`,H:`The papacy or the Roman clergy who enforced the church's power.`,F:`A future religious leader who promotes the Antichrist and enforces his mark.`,I:`Any religion, media or ideology that persuades people to worship power.`},
 links:[['False prophet','False prophet'],['Glycon','Glycon'],['Alexander of Abonoteichus','Alexander of Abonoteichus']],
 sources:['koester','friesen']});

TP({id:'unholy-trinity', kind:'Ideas', title:'The Unholy Trinity', ch:[12,13,16,19,20],
 lead:`The dragon, the beast and the false prophet act together (16:13), and each copies a person of God. Evil in Revelation is never original. It can only imitate.`,
 sections:[
  {h:'The copies', table:[['God','The counterfeit'],['The Father gives the Son his throne and authority (2:27; 3:21)','The dragon gives the beast "his power, his throne, and great authority" (13:2)'],['The Lamb "as if slaughtered," alive (5:6)','The beast’s head "as if slaughtered," healed (13:3)'],['God "who is, who was, and who is coming" (1:4)','The beast "once was, now is not, and is about to come" (17:8)'],['The Spirit leads people to worship Christ (19:10)','The false prophet leads people to worship the beast (13:12)'],['God gives breath of life (11:11)','The false prophet gives breath to the image (13:15)'],['God’s seal on foreheads (7:3)','The beast’s mark on foreheads (13:16)'],['The bride, the holy city (21:2)','The prostitute, the great city (17:1–5)'],['Worship of the Lamb by every nation (5:9)','Worship of the beast by the whole earth (13:3–4)']]},
  ['Why it matters',`Revelation teaches readers to spot the fake by knowing the real thing well. The beast looks like the Lamb in some ways, and the false prophet looks like a lamb outright. The test is whom the worship goes to and what kind of power is used: the Lamb wins by dying, the beast by killing.`],
  ['Their end',`They are judged in reverse order of their appearance: Babylon falls (18), the beast and false prophet are thrown into the lake of fire (19:20), and finally the dragon joins them (20:10).`]],
 views:{P:`Satan, Rome (or Nero) and the imperial priesthood.`,H:`Satan, the papacy and its supporting powers.`,F:`Satan, the Antichrist and the false prophet of the end times.`,I:`The spiritual, political and religious forms of evil in every age.`},
 links:[['Unholy trinity','Unholy trinity']],
 sources:['bauckham','koester']});

TP({id:'two-witnesses', kind:'People', title:'The Two Witnesses', ch:[11],
 lead:`Two prophets in sackcloth who prophesy for 1,260 days, are killed by the beast, lie dead for 3½ days while the world celebrates, and rise and go up to heaven in a cloud (11:3–12).`,
 sections:[
  {h:'Who are they?', table:[['Identification','Held by','Reasoning'],['Moses and Elijah','Many futurists','They turn water to blood and shut the sky (Exodus 7:17–20; 1 Kings 17:1); both appeared with Jesus at the Transfiguration (Mark 9:4)'],['Enoch and Elijah','Hippolytus, Tertullian and much of the early church','The two who never died (Genesis 5:24; 2 Kings 2:11)'],['The witnessing church','Many idealists and amillennialists','They are "two lampstands," and lampstands are churches (1:20); two witnesses make testimony valid (Deuteronomy 19:15)'],['Peter and Paul','Some preterists','Both killed in Rome under Nero'],['The Law and the Prophets, or the two Testaments','Some historicists','God’s word suppressed and revived'],['Two future individuals','Many futurists','Real prophets in a rebuilt Jerusalem']]},
  ['Zechariah 4',`"These are the two olive trees and the two lampstands that stand before the Lord of the earth" (11:4) quotes Zechariah 4:3, 11–14, where two olive trees feed a lampstand. In Zechariah they are Zerubbabel the governor and Joshua the high priest, a king and a priest. Revelation's witnesses are "a kingdom and priests" (1:6) in action.`],
  ['Their story is Jesus’s story',`They witness, are killed in "the great city... where their Lord was also crucified" (11:8), lie dead in public for three days, are raised by "the breath of life from God" (Ezekiel 37:10), and go up in a cloud while their enemies watch (Acts 1:9). Then "the rest were terrified and gave glory to the God of heaven" (11:13): their death does what the plagues could not.`]],
 claude:{title:'Israel and the church as the two branches',body:`Zechariah 4 has two olive trees feeding one lampstand; Romans 11 has one olive tree with natural branches (Israel) and grafted branches (the nations). Revelation 11 has two olive trees and two lampstands. My speculation: the two lampstands are believing Israel and the church from the nations, witnessing side by side as "a kingdom and priests" (1:6). That would explain why there are two, why they share one story of death and resurrection, and why they appear in Jerusalem. I have not found this in the major commentaries.`, refs:'11:3–4; Zechariah 4:11–14; Romans 11:17–24; 1:6; 1:20'},
 views:{P:`Christian witnesses in Jerusalem before AD 70, or Peter and Paul.`,H:`The faithful witnesses of the Reformation era, or the two Testaments.`,F:`Two literal prophets in Jerusalem during the tribulation.`,I:`The witnessing church in every age, suffering and vindicated.`},
 links:[['Two witnesses','Two witnesses'],['Transfiguration of Jesus','Transfiguration of Jesus'],['Book of Zechariah','Book of Zechariah']],
 sources:['bauckham','gregg','beale']});

TP({id:'woman-of-ch12', kind:'People', title:'The Woman Clothed with the Sun', ch:[12],
 lead:`"A great sign appeared in heaven: a woman dressed in the sun, with the moon under her feet and a crown of twelve stars on her head" (12:1). She gives birth to the Messiah, escapes the dragon, and is protected in the wilderness.`,
 sections:[
  ['Israel',`Joseph dreamed that the sun, moon and eleven stars bowed to him, meaning Jacob, Rachel and his brothers (Genesis 37:9): sun, moon and twelve stars are the family of Israel. The prophets picture Zion as a woman in labor: "Before she goes into labor, she gives birth" (Isaiah 66:7–8); "Writhe in agony, Daughter Zion, like a woman in labor" (Micah 4:10).`],
  ['Mary',`Catholic and Orthodox tradition see Mary, the mother of Jesus, here, and the image shapes much Christian art: Mary standing on the moon crowned with stars. Our Lady of Guadalupe (Mexico, 1531) is pictured this way. The Catholic Church reads 11:19–12:10 on the Feast of the Assumption (August 15). Many Protestant scholars accept a secondary reference to Mary within the larger picture of Israel.`],
  ['The church',`After the birth she is persecuted and protected (12:13–17), carried on eagle's wings into the wilderness as Israel was (Exodus 19:4), and fed there 1,260 days. "The rest of her children" are those who "hold to the testimony about Jesus" (12:17). The woman continues as the people of God after Christ's ascension.`],
  ['Eve',`The "ancient serpent" fights the woman and her offspring, echoing God's promise in Genesis 3:15: "I will put hostility between you and the woman, and between your offspring and hers." Revelation 12 is that war.`],
  {myth:{culture:'Greece and Egypt', title:'Leto, Isis and the hunted mother', body:`In the Greek myth, the dragon Python pursued the pregnant goddess Leto; she escaped to an island and gave birth to Apollo, who later killed the dragon. Ephesus claimed the birth happened nearby. In Egypt, Isis hid in the marshes from Set to protect her son Horus. Revelation 12 tells the same kind of story about the true Son, perhaps on purpose. See "End-times stories from other traditions."`, link:['Leto','Leto'], link2:'probably known to John’s readers'}},
  {fact:`In 2017 a widely shared claim said a rare star alignment in the constellation Virgo on September 23 fulfilled 12:1–2 and signaled the end. Astronomers noted that similar alignments have happened before, and nothing unusual followed. John calls the woman "a sign" (<i>sēmeion</i>), a symbol, not a horoscope.`}],
 views:{P:`Faithful Israel giving birth to the Messiah, and the Jerusalem church fleeing to Pella before AD 70.`,H:`The true church through history, hidden in the wilderness during the 1,260 years of papal power.`,F:`Israel, persecuted and protected during the second half of the tribulation.`,I:`The people of God in every age, bringing forth Christ and protected by God.`},
 links:[['Woman of the Apocalypse','Woman of the Apocalypse'],['Our Lady of Guadalupe','Our Lady of Guadalupe']],
 sources:['koester','collins']});

TP({id:'bride', kind:'People', title:'The Bride of the Lamb', ch:[19,21,22],
 lead:`"The wedding of the Lamb has come, and his bride has made herself ready" (19:7). Later the angel shows John "the bride, the wife of the Lamb," and it is a city (21:9–10). The book's final invitation comes from her: "The Spirit and the bride say, ‘Come!’" (22:17).`,
 sections:[
  ['Background',`God is Israel's husband: "Your Maker is your husband, the LORD Almighty is his name" (Isaiah 54:5); "I will betroth you to me forever" (Hosea 2:19–20). Paul calls Christ and the church husband and wife (Ephesians 5:25–32) and says he promised the Corinthians "to one husband, to Christ" (2 Corinthians 11:2). Jesus told wedding parables (Matthew 22:1–14; 25:1–13) and called himself the bridegroom (Mark 2:19–20).`],
  ['A Jewish wedding',`A Jewish marriage had two stages: betrothal, which was legally binding, and, months later, the wedding, when the groom came with his friends to bring the bride to his home, followed by a feast that could last a week. The church is now "betrothed"; the wedding is the return of Christ. "Blessed are those who are invited to the wedding supper of the Lamb" (19:9).`],
  ['Her dress',`"She was given fine linen, bright and clean, to wear. The fine linen stands for the righteous deeds of God's people" (19:8). The dress is both a gift ("she was given") and her own deeds. The robes of the martyrs were "washed... white in the blood of the Lamb" (7:14).`],
  {h:'Two women, two cities', table:[['The prostitute (17–18)','The bride (19; 21)'],['Babylon, "the great city"','The new Jerusalem, "the holy city"'],['Purple, scarlet, gold and pearls (17:4)','Fine linen, bright and clean (19:8)'],['Drunk on the blood of God’s people (17:6)','Washed in the blood of the Lamb (7:14)'],['Rides the beast (17:3)','Married to the Lamb (19:7)'],['Shown "in a wilderness" (17:3)','Shown "on a great, high mountain" (21:10)'],['Her name: "a mystery" (17:5)','Her names: the twelve tribes and apostles (21:12–14)'],['Burned and ruined (18:8)','Lasts forever (22:5)']],
   note:'Both visions open with the same words: "One of the seven angels who had the seven bowls came and said to me, ‘Come, I will show you...’" (17:1; 21:9).'}],
 views:{P:`The church, the new covenant people, replacing unfaithful Jerusalem.`,H:`The true church, finally united with Christ.`,F:`The church raptured before the tribulation, married to Christ in heaven before returning with him.`,I:`The whole people of God, perfected and united with Christ.`},
 links:[['Bride of Christ','Bride of Christ'],['Marriage of the Lamb','Marriage of the Lamb'],['Jewish wedding','Jewish wedding']],
 sources:['bauckham','koester']});

TP({id:'nero', kind:'People', title:'Nero', ch:[13,17],
 lead:`Roman emperor from AD 54 to 68. He blamed Christians for the great fire of Rome in 64 and had many killed; tradition says Peter and Paul died under him. For many readers he is the best candidate for the number 666 and the model for the beast.`,
 facts:[['Born','AD 37; emperor at 16'],['Infamous for','Killing his mother Agrippina (59), the persecution of 64, and stage performances'],['Death','Suicide, June 9, 68, saying "What an artist dies in me!"'],['After death','At least three men claimed to be Nero returned (69, about 80, 88)']],
 sections:[
  ['The persecution of 64',`Tacitus, no friend of Christians, describes it: "Mockery was added to their deaths. Covered with the skins of animals, they were torn by dogs and died, or were nailed to crosses, or were set on fire and burned to light the night" (<i>Annals</i> 15.44). It was the first time Rome treated Christians as a separate group to be punished.`],
  {h:'666 and 616', table:[['Spelling','Hebrew letters','Total'],['"Nero Caesar" (Greek form <i>Nerōn Kaisar</i>)','נרון קסר: N 50 + R 200 + W 6 + N 50, Q 100 + S 60 + R 200','666'],['"Nero Caesar" (Latin form <i>Nero</i>)','נרו קסר: drop the final N (50)','616']],
   note:'Some ancient manuscripts of 13:18 read 616, which is exactly the difference between the two spellings. The spelling with the final N appears in a Hebrew document from Wadi Murabba’at near the Dead Sea, dated to Nero’s reign. Many scholars find this the strongest identification; others note that hundreds of names can be made to add up to 666.'},
  ['The return of Nero',`After his suicide, rumors said he was not really dead and would return from the east with Parthian armies. At least three impostors claimed to be him (Tacitus, <i>Histories</i> 2.8; Suetonius, <i>Nero</i> 57). Jewish and Christian writings picked up the legend: the Sibylline Oracles describe a matricide king fleeing beyond the Euphrates and coming back (4.119–139; 5.361–370). The beast whose fatal wound was healed (13:3) and that "once was, now is not, and is about to come" (17:8) fits that legend.`],
  ['For the early date',`If Nero is the sixth king, "one is" (17:10), the book was written before 68. Most scholars instead think John wrote under Domitian and used Nero as the pattern: a returning Nero, a new persecutor. The poet Juvenal called Domitian "a bald Nero."`]],
 views:{P:`Nero is the beast; the book was written during or just after his reign.`,H:`Nero was the first of a long line of persecuting powers.`,F:`Nero was a type, a preview, of the future Antichrist.`,I:`Nero is a classic example of the beast's character, not its only meaning.`},
 links:[['Nero','Nero'],['Nero Redivivus legend','Nero Redivivus legend'],['Great Fire of Rome','Great Fire of Rome']],
 sources:['koester','gentry','bauckham']});

TP({id:'jezebel', kind:'People', title:'"Jezebel" of Thyatira', ch:[2],
 lead:`A woman in the Thyatira church "who calls herself a prophet" and teaches eating food sacrificed to idols and sexual sin (2:20). The chapter 2 page has a full study of her and of the prostitution language.`,
 sections:[
  ['The nickname',`The original Jezebel was the Phoenician queen of King Ahab who promoted Baal worship in Israel and persecuted the prophets (1 Kings 16:31; 18:4; 2 Kings 9:22). John gives the name to a real local teacher, the way we might call someone "a Judas."`],
  ['The issue',`Thyatira had many trade guilds (wool, dyers, bronze workers), whose banquets honored patron gods. Her teaching seems to have made room for Christians to join in.`]],
 links:[['Jezebel','Jezebel'],['Thyatira','Thyatira']],
 sources:['hemer','ramsay']});

TP({id:'balaam', kind:'People', title:'Balaam and the Nicolaitans', ch:[2],
 lead:`Two groups in the churches: those who "hold to the teaching of Balaam" (2:14) and the Nicolaitans (2:6, 15), probably the same group or close allies. Ephesus hated their practices; Pergamum tolerated them.`,
 sections:[
  ['Balaam in the Bible',`A famous foreign prophet hired by King Balak of Moab to curse Israel. God made him bless Israel instead, after his donkey saw the angel he could not (Numbers 22–24). But afterward he advised Moab to lure Israel into idol feasts and sexual sin at Baal of Peor (Numbers 25:1–2; 31:16). In the New Testament, he is the prophet who "loved the wages of wickedness" (2 Peter 2:15; Jude 11).`],
  {fact:`Balaam was a real name known outside the Bible. In 1967 archaeologists at Deir Alla in Jordan found plaster wall writing from about 800 BC that begins, "The account of Balaam son of Beor, who was a seer of the gods." It is one of the oldest references outside the Bible to a person named in the Old Testament.`},
  ['The Nicolaitans',`Irenaeus (about AD 180) says they followed Nicolaus, one of the seven deacons chosen in Jerusalem (Acts 6:5), and "lived lives of unrestrained indulgence" (<i>Against Heresies</i> 1.26.3). Clement of Alexandria defended Nicolaus himself and said his followers twisted his words (<i>Miscellanies</i> 2.20; 3.4). Their teaching seems to have been that Christians could eat at idol feasts and that what you did with your body did not matter.`],
  ['Two names, one meaning?',`"Nicolaus" in Greek means "conquers the people" (<i>nikā</i> + <i>laos</i>). Jewish tradition explained "Balaam" in Hebrew as "swallows the people" (<i>bala' 'am</i>; Talmud, Sanhedrin 105a). Many scholars think John saw the two names as the same idea in two languages.`],
  ['"Conquerors of the laity"',`A popular later reading, found for example in Watchman Nee, took "Nicolaitans" as "conquering the laity" and saw in them the rise of a clergy class ruling over ordinary believers. It is a creative sermon point, not what the Nicolaitans were in the first century.`]],
 views:{P:`A real first-century group that permitted idol feasts and loose living.`,H:`The rise of clerical hierarchy and worldly compromise in the church.`,F:`A real group, and a warning against compromise in every period of church history.`,I:`Any teaching that makes peace with the culture's idols in the name of freedom.`},
 links:[['Balaam','Balaam'],['Nicolaism','Nicolaism'],['Deir Alla Inscription','Deir Alla Inscription']],
 sources:['hemer','aune','irenaeus']});

TP({id:'synagogue-of-satan', kind:'Words', title:'"Synagogue of Satan"', ch:[2,3],
 lead:`"Those who say they are Jews and are not, but are a synagogue of Satan" (2:9; 3:9), at Smyrna and Philadelphia. The topic page "Those who say they are... and are not" studies the whole pattern; this page focuses on the phrase itself.`,
 sections:[
  ['The words',`"Synagogue" means "gathering." The Greek Old Testament calls Israel "the congregation (<i>synagōgē</i>) of the LORD" (Numbers 27:17; 31:16). John's phrase turns that around: a gathering that serves the accuser instead of the Lord. James uses "synagogue" even for a Christian assembly (James 2:2), so the word was not yet a label for "the other religion."`],
  ['In context',`John is a Jewish writer, and the dispute is about who belongs to Israel's Messiah. "Satan" means "accuser," and these local opponents may have been accusing Christians before Roman officials. Smyrna's later bishop Polycarp was martyred around AD 155 after a crowd that included local Jews called for his death (<i>Martyrdom of Polycarp</i> 12–13). John's Gospel shows the same painful split (John 8:44; 9:22; 16:2).`],
  ['Misuse',`The phrase has been used to justify hatred of Jews, from medieval sermons to modern hate groups. That reading turns a family argument in the first century into a weapon John never intended. Paul makes a similar point to John's in Romans 2:28–29, and in Romans 11 insists that God has not rejected his people.`]],
 links:[['Synagogue of Satan','Synagogue of Satan'],['Polycarp','Polycarp']],
 sources:['koester','blount']});

TP({id:'abaddon', kind:'People', title:'Abaddon / Apollyon', ch:[9],
 lead:`"They had as king over them the angel of the abyss. His name in Hebrew is Abaddon, and in Greek it is Apollyon" (9:11). Abaddon is Hebrew for "destruction"; Apollyon is Greek for "Destroyer."`,
 sections:[
  ['From a place to a person',`In the Old Testament, Abaddon is a place, the realm of the dead and destruction: "Death and Abaddon lie open before the LORD" (Proverbs 15:11; also Job 26:6; 28:22; Psalm 88:11). The Dead Sea Scrolls' Thanksgiving Hymns speak of "the torrents of Belial" bursting into Abaddon (1QH 11). Revelation turns the place into a ruler, the king of the locusts.`],
  ['Who is he?',`Readers disagree whether he is Satan himself, a chief demon, or a good angel carrying out God's judgment (since the locusts can only harm those without God's seal, 9:4). Proverbs 30:27 says "locusts have no king," which makes it striking that these do.`],
  ['Apollo?',`Apollyon sounds very like Apollo. The locust was one of Apollo's symbols; Athens had a statue of "Apollo the Locust-God" (Pausanias 1.24.8). Emperors liked to be linked with Apollo: Augustus built him a temple, and Nero performed as Apollo the singer. Many scholars think John is making a pointed joke: Rome's patron god is really the Destroyer, king of a demonic plague.`],
  ['In literature',`John Bunyan's <i>The Pilgrim's Progress</i> (1678) has Christian fight Apollyon, a scaled monster with wings like a dragon, in the Valley of Humiliation.`]],
 views:{P:`Demonic forces behind the destruction of Jerusalem or Rome's armies.`,H:`Muhammad or the Muslim caliphs (the fifth trumpet as the Arab conquests); some Protestants said the pope.`,F:`A powerful demon released from the abyss during the tribulation.`,I:`The destructive power of evil, which turns on its own followers.`},
 links:[['Abaddon','Abaddon'],['Apollo','Apollo']],
 sources:['aune','koester']});

TP({id:'gog-magog', kind:'People', title:'Gog and Magog', ch:[20],
 lead:`The nations Satan gathers for the final battle after the thousand years, "as many as the sand on the seashore" (20:8). They surround "the city he loves" and are consumed by fire from heaven.`,
 sections:[
  ['Background',`Magog is a grandson of Noah through Japheth (Genesis 10:2); Josephus identified his descendants with the Scythians of the far north (<i>Antiquities</i> 1.123). In Ezekiel 38–39, Gog is a ruler "of the land of Magog," leading northern nations against restored Israel, defeated by God with earthquake, fire and hail. Revelation makes both names into peoples "at the four corners of the earth": no longer one northern enemy but all the rebellious nations.`],
