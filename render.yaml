# Render Blueprint: the public site (bible/public/) as a static site at codexcollection.com.
# Render runs the same publish build as `node tools/build.js --publish`, so only reviewed books go online.
# Every push to main deploys. That is safe because --publish leaves out every book not yet reviewed and every
# unmerged proposal; pushing is the "go live" step.
services:
  - type: web
    runtime: static
    name: codex-collection
    repo: https://github.com/MatthewLarson/bible-scroll
    branch: main
    rootDir: bible
    buildCommand: node tools/build.js --publish
    staticPublishPath: public
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20"
    # Render adds www.codexcollection.com and redirects it to the root domain on its own
    domains:
      - codexcollection.com
    # the app reads its address from the path (/Gen/1/2, /topics, /articles/<id>): every path that is not a real file
    # (data/, img/) is answered with the one page, index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # the page and the data change with a publish and have fixed names: always revalidate, so a reader never sees an
      # old page with new data. Cloudflare still keeps images for hours whatever this says, so the build adds
      # ?v=<file hash> to every img/ address in the page: a changed image gets a new address
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
